<!--
  ==========================================================================================
  资金账户管理模块 · 高保真可交互设计稿（Steep 体系 / 后台 admin）
  ==========================================================================================
  项目：profo（Next.js + FastAPI + PostgreSQL，后台 admin 页面在 frontend/src/app/(main)/admin）
  日期：2026-10-21 · 版本 v1 · 单一推荐方案 + 页内分支开关
  视觉依据：/DESIGN.md（Steep Style Reference）+ frontend/src/app/globals.css 已落地 token

  设计稿回答的四个业务问题（已与需求方确认口径）：
    1. 现在的「资金账本」只记项目的账 → 改名为「项目账本」（路由 /admin/ledger 不动，只改文案）。
    2. 新增「资金账户」模块：账户增删查改 + 余额由流水推导 + 对账调整记录。
    3. 项目账本记一笔时，流出可选取款账户、流入可选取款账户（必填单选，可显式标记「未走账户」）。
    4. 资金账户模块有独立入口密码（模块入口锁）：解锁后 30 分钟滑动过期 + 手动锁定。

  代码事实依据（已核对，非猜测）：
    · backend/models/project/_project_finance.py  FinanceRecord / FinanceRecordLog / FinanceSubject
    · backend/routers/finance/ledger.py           /admin/ledger/*（LedgerReadPermDep / Write / Settle）
    · backend/schemas/project/finance.py          LedgerRecordCreate（subject_id + outflow/inflow + payer/payee）
    · frontend/src/components/finance/record-dialog.tsx   现有「记一笔」弹窗（本次在其上加账户字段）
    · frontend/src/app/(main)/admin/ledger/**     项目账本列表页 / 明细页 / 统计页 / 科目管理
    · frontend/src/lib/admin-nav-data.ts          侧边栏「财务管理 → 资金账本 / 跟投管理 / 科目管理」
    · frontend/src/lib/auth/permissions.ts        PATH_PERMISSION_MAP：/admin/ledger → ledger:read
    · backend/migrations/__init__.py + _finance.py 启动迁移（幂等）；finance_subjects 表先例可复用
    · frontend/src/app/globals.css                --color-money-positive 红=流入 / --color-money-negative 绿=流出

  交付形态：单文件自包含 HTML（React 18 CDN + Babel 内联转译），双击可开，也便于直接转发。
  数据全部为贴近业务的演示数据，不连接真实接口。
  ⚠️ 设计稿交付物，按要求单文件自包含，故不拆分模块（有意超过 500 行，见 AGENTS.md 例外条款）。
-->

/* 账户余额推导：期初 + 流入 − 流出 + 调整 */
function accountBalance(acc, adjusts) {
  const adj = adjusts.filter((a) => a.accountId === acc.id).reduce((s, a) => s + a.amount, 0);
  return acc.opening + acc.flows.in - acc.flows.out + adj;
}
function accountAdjustSum(acc, adjusts) {
  return adjusts.filter((a) => a.accountId === acc.id).reduce((s, a) => s + a.amount, 0);
}

function Banner({ tone = "fog", icon = "info", children }) {

  );
}

function Dropdown({ label, value, options, onChange, width }) {
  const [open, setOpen] = React.useState(false);
  const cur = options.find((o) => o.value === value);
  React.useEffect(() => {
    if (!open) return;
    const h = () => setOpen(false);
    window.addEventListener("click", h);
    return () => window.removeEventListener("click", h);
  }, [open]);
  return (
    <div className="dropdown" onClick={(e) => e.stopPropagation()}>
      <button className="select" style={width ? { minWidth: width } : null} onClick={() => setOpen(!open)}>
        <span style={{ color: value === "all" || !value ? "var(--graphite)" : "var(--ink)" }}>{cur ? cur.label : label}</span>
        <Ic n="chevDown" size={13} />
      </button>
      {open ? (
        <div className="menu">
          {options.map((o) => (
            <button key={o.value} className={o.value === value ? "on" : ""}
              onClick={() => { onChange(o.value); setOpen(false); }}>
              <span>{o.label}</span>
              {o.value === value ? <Ic n="check" size={13} /> : null}
            </button>
          ))}
        </div>
      ) : null}
    </div>
  );
}

function Seg({ value, onChange, options }) {
  return (
    <div className="seg">
      {options.map((o) => (
        <button key={o.value} className={value === o.value ? "on" : ""} onClick={() => onChange(o.value)}>{o.label}</button>
      ))}
    </div>
  );
}

function AccountGlyph({ type, size = 38, radius }) {
  const t = ACCOUNT_TYPES[type] || ACCOUNT_TYPES.bank;

  return <span className={"acct-glyph " + t.tone} style={style}><Ic n={t.icon} size={Math.round(size * 0.48)} /></span>;
}

function LockScreen({ onUnlock, reason, attemptsLeft, locked, onReset, hasPassword, onSetPassword, onForgot }) {
  const [pw, setPw] = React.useState("");
  const [show, setShow] = React.useState(false);
  const [err, setErr] = React.useState("");
  const [shake, setShake] = React.useState(false);
  const DEMO_PW = "888888";

  const submit = () => {
    if (locked) return;
    if (pw.length < 6) { setErr("请输入 6 位数字密码"); return; }
    if (pw === DEMO_PW) { setErr(""); onUnlock(); return; }
    setErr("密码不正确，还可尝试 " + Math.max(attemptsLeft - 1, 0) + " 次");
    setShake(true);

    <div className="lock-stage">
      <div className={"lock-card" + (shake ? " shake" : "")}>
        <div className="lock-glyph"><Ic n={locked ? "lock" : "key"} size={22} /></div>
        <div className="lock-kicker">财务 · 需密码</div>
        <h1 className="lock-title">资金账户</h1>
        <p className="lock-desc">
          {locked
            ? "密码输错太多次，请 15 分钟后再试。"
            : reason === "expired"
              ? "太久没操作，已自动上锁。"
              : "这里有钱。输密码才能看。"}
        </p>

        {!hasPassword ? (
          <>
            <div style={{ marginTop: 20 }}>
              <Banner tone="warm" icon="alert">
                还没设密码。先设 6 位数字。
              </Banner>
            </div>
            <div className="lock-actions">
              <button className="btn-fill" style={{ width: "100%", padding: "12px 18px" }} onClick={onSetPassword}>
                <Ic n="key" size={15} /> 去设密码
              </button>
            </div>
            <div className="lock-foot">
              <div className="ln"><Ic n="info" size={13} /><span>密码只存加密结果，谁都查不到明文。</span></div>
            </div>
          </>
        ) : (
          <>
            <div className="field" style={{ marginTop: 22 }}>
              <div className="field-label">
                <span>密码 <span className="req">*</span></span>
                <span style={{ color: "var(--dove)", fontWeight: 400 }}>6 位数字</span>
              </div>
              <div className={"input-wrap lock-pw" + (err ? " err" : "")}>
                <Ic n="lock" size={15} style={{ color: "var(--graphite)" }} />
                <input
                  type={show ? "text" : "password"}
                  inputMode="numeric"
                  maxLength={6}
                  placeholder="••••••"
                  value={pw}
                  disabled={locked}
                  onChange={(e) => { setPw(e.target.value.replace(/\D/g, "").slice(0, 6)); setErr(""); }}
                  onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
                  autoFocus
                />
                <button className="pw-toggle" onClick={() => setShow(!show)}>
                  <Ic n={show ? "eyeOff" : "eye"} size={14} />
                </button>
              </div>
              {err ? <div className="field-error"><Ic n="alert" size={12} />{err}</div> : null}
            </div>

            <div className="lock-actions">
              <button className="btn-fill" style={{ width: "100%", padding: "12px 18px", opacity: locked ? .45 : 1 }}
                onClick={submit} disabled={locked}>
                <Ic n="unlock" size={15} /> 进去
              </button>
              <div className="lock-row">
                <span className="attempts">
                  剩余尝试
                  {[0, 1, 2].map((i) => <i key={i} className={i >= attemptsLeft ? "used" : ""} />)}
                </span>
                <button className="btn-text muted" onClick={onForgot}>
                  忘了？<Ic n="chevRight" size={12} />
                </button>
              </div>
            </div>

            <div className="lock-foot">
              <div className="ln"><Ic n="clock" size={13} /><span>进去后 30 分钟没操作，自动上锁。</span></div>
              <div className="ln"><Ic n="info" size={13} /><span>演示密码 <b style={{ color: "var(--rust)" }}>888888</b></span></div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ==========================================================================================
   F · 设置模块密码 / 重置（弹窗复用）
   ========================================================================================== */
function PasswordSetupModal({ mode, onClose, onDone }) {
  const [p1, setP1] = React.useState("");
  const [p2, setP2] = React.useState("");
  const [old, setOld] = React.useState("");
  const [err, setErr] = React.useState({});
  const isReset = mode === "reset";
  const isChange = mode === "change";

  const submit = () => {
    const e = {};
    if (isReset && old.length !== 6) e.old = "请输入当前模块密码";
    if (p1.length !== 6) e.p1 = "密码需为 6 位数字";
    if (p2 !== p1) e.p2 = "两次输入不一致";
    if (isReset && p1 === old) e.p1 = "新密码不能与当前密码相同";
    if (/^(\d)\1{5}$/.test(p1)) e.p1 = "不要使用 6 位相同数字";
    setErr(e);
    if (Object.keys(e).length) return;
    onDone();
  };

  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="modal-wrap" style={{ pointerEvents: "none" }}>
        <div className="modal" style={{ pointerEvents: "auto" }}>
          <div className="modal-head">
            <h3>{isReset ? "重设密码" : isChange ? "改密码" : "设密码"}</h3>
            <p>
              这个密码只管资金账户，和登录密码分开。同事共用一把。
            </p>
          </div>
          <div className="modal-body">
            {isReset || isChange ? (
              <div className="field">
                <div className="field-label"><span>原密码 <span className="req">*</span></span></div>
                <div className={"input-wrap" + (err.old ? " err" : "")}>
                  <Ic n="lock" size={15} style={{ color: "var(--graphite)" }} />
                  <input type="password" inputMode="numeric" maxLength={6} placeholder="••••••"
                    value={old} onChange={(e) => setOld(e.target.value.replace(/\D/g, "").slice(0, 6))} />
                </div>
                {err.old ? <div className="field-error"><Ic n="alert" size={12} />{err.old}</div> : null}
              </div>
            ) : null}
            <div className="grid-2">
              <div className="field">
                <div className="field-label"><span>新密码 <span className="req">*</span></span></div>
                <div className={"input-wrap" + (err.p1 ? " err" : "")}>
                  <input type="password" inputMode="numeric" maxLength={6} placeholder="6 位数字"
                    value={p1} onChange={(e) => setP1(e.target.value.replace(/\D/g, "").slice(0, 6))} />
                </div>
                {err.p1 ? <div className="field-error"><Ic n="alert" size={12} />{err.p1}</div> : null}
              </div>
              <div className="field">
                <div className="field-label"><span>再输一遍 <span className="req">*</span></span></div>
                <div className={"input-wrap" + (err.p2 ? " err" : "")}>
                  <input type="password" inputMode="numeric" maxLength={6} placeholder="6 位数字"
                    value={p2} onChange={(e) => setP2(e.target.value.replace(/\D/g, "").slice(0, 6))} />
                </div>
                {err.p2 ? <div className="field-error"><Ic n="alert" size={12} />{err.p2}</div> : null}
              </div>
            </div>
            <Banner tone="fog" icon="info">
              输错 5 次锁 15 分钟。密码只管进门，能不能改还看权限。
            </Banner>
          </div>
          <div className="modal-foot">
            <span style={{ fontSize: 12, color: "var(--graphite)" }}>密码只存加密结果，查不到明文。</span>
            <div className="right">
              <button className="btn-line" onClick={onClose}>取消</button>
              <button className="btn-fill" onClick={submit}>{isReset ? "重设" : "保存"}</button>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

/* ==========================================================================================
   I · 屏 3 · 新建 / 编辑账户（右侧抽屉）
   ========================================================================================== */
function AccountDrawer({ mode, account, accounts, records, adjusts, onClose, onSave }) {
  const isEdit = mode === "edit";
  const [name, setName] = React.useState(account ? account.name : "");
  const [type, setType] = React.useState(account ? account.type : "bank");
  const [no, setNo] = React.useState(account ? account.no : "");
  const [holder, setHolder] = React.useState(account ? account.holder : "");
  const [opening, setOpening] = React.useState(account ? String(account.opening) : "");
  const [openingDate, setOpeningDate] = React.useState(account ? account.openingDate : todayISO());
  const [status, setStatus] = React.useState(account ? account.status : "active");
  const [note, setNote] = React.useState(account ? account.note : "");
  const [err, setErr] = React.useState({});
  const hasFlows = isEdit && records.some((r) => r.accountId === account.id);
  const curBal = isEdit ? accountBalance(account, adjusts) : 0;
  const openingDelta = isEdit ? (Number(opening) || 0) - account.opening : 0;

  const submit = () => {
    const e = {};
    if (!name.trim()) e.name = "请填写账户名称";
    if (!openingDate) e.openingDate = "请选择期初余额日期";
    if (opening === "" || isNaN(Number(opening))) e.opening = "请填写期初余额（可为 0）";
    if (no.trim() && no.length < 4) e.no = "卡号至少 4 位";
    setErr(e);
    if (Object.keys(e).length) return;
    onSave({
      id: account ? account.id : "acc-" + Date.now(),
      name: name.trim(), type, no: no.trim() || "—", holder: holder.trim() || "—",
      opening: Number(opening) || 0, openingDate, status, note: note.trim(),
      flows: account ? account.flows : { in: 0, out: 0 },
      adjust: account ? account.adjust : 0,
      lastDate: account ? account.lastDate : "—",
      count: account ? account.count : 0,
    }, isEdit);
  };

  return (
    <div className="scrim" onClick={onClose}>
      <div className="drawer" onClick={(e) => e.stopPropagation()}>
        <div className="drawer-head">
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <div>
              <h3 style={{ fontSize: 20, fontWeight: 500, letterSpacing: "-0.012em" }}>{isEdit ? "改账户" : "新建账户"}</h3>
              <p style={{ fontSize: 12.5, color: "var(--graphite)", marginTop: 6, lineHeight: 1.6 }}>
                只记人民币。存好就能记账用。
              </p>
            </div>
            <button className="icon-btn" onClick={onClose}><Ic n="x" size={16} /></button>
          </div>
        </div>

        <div className="drawer-body" style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          <div className="field">
            <div className="field-label"><span>起个名字 <span className="req">*</span></span><span style={{ color: "var(--dove)", fontWeight: 400 }}>{name.length}/24</span></div>
            <div className={"input-wrap" + (err.name ? " err" : "")} style={{ height: 44 }}>
              <input placeholder="如：工商银行 · 基本户" value={name} maxLength={24} onChange={(e) => setName(e.target.value)} autoFocus />
            </div>
            {err.name ? <div className="field-error"><Ic n="alert" size={12} />{err.name}</div> : <div className="field-hint">银行 + 用途，好认就行。</div>}
          </div>

          <div className="field">
            <div className="field-label"><span>什么账户 <span className="req">*</span></span></div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8 }}>
              {Object.entries(ACCOUNT_TYPES).map(([k, v]) => (
                <button key={k} className={"check" + (type === k ? " on" : "")} onClick={() => setType(k)}
                  style={{ flexDirection: "column", alignItems: "center", gap: 7, padding: "12px 6px", textAlign: "center" }}>
                  <AccountGlyph type={k} size={30} radius={10} />
                  <span style={{ fontSize: 12.5, fontWeight: 450, color: type === k ? "var(--ink)" : "var(--ash)" }}>{v.label}</span>
                </button>
              ))}
            </div>
          </div>

          <div className="grid-2">
            <div className="field">
              <div className="field-label"><span>卡号</span></div>
              <div className={"input-wrap" + (err.no ? " err" : "")} style={{ height: 44 }}>
                <input placeholder="6222 **** 4821" value={no} onChange={(e) => setNo(e.target.value)} />
              </div>
              {err.no ? <div className="field-error"><Ic n="alert" size={12} />{err.no}</div> : <div className="field-hint">填后四位就够。</div>}
            </div>
            <div className="field">
              <div className="field-label"><span>谁的卡</span></div>
              <div className="input-wrap" style={{ height: 44 }}>
                <input placeholder="公司名 或 个人姓名" value={holder} onChange={(e) => setHolder(e.target.value)} />
              </div>
              <div className="field-hint">公司的就写公司。</div>
            </div>
          </div>

          <div className="grid-2">
            <div className="field">
              <div className="field-label"><span>起始金额 <span className="req">*</span></span></div>
              <div className={"money-in" + (err.opening ? " err" : "")} style={err.opening ? { boxShadow: "inset 0 0 0 1.5px #d96a63" } : null}>
                <span className="cur">¥</span>
                <input inputMode="decimal" placeholder="0.00" value={opening} onChange={(e) => setOpening(e.target.value.replace(/[^\d.-]/g, ""))} />
              </div>
              {err.opening ? <div className="field-error"><Ic n="alert" size={12} />{err.opening}</div> : <div className="field-hint">开始用它那天有多少。</div>}
            </div>
            <div className="field">
              <div className="field-label"><span>从哪天算 <span className="req">*</span></span></div>
              <div className={"input-wrap" + (err.openingDate ? " err" : "")} style={{ height: 44 }}>
                <Ic n="clock" size={14} style={{ color: "var(--graphite)" }} />
                <input type="date" value={openingDate} onChange={(e) => setOpeningDate(e.target.value)} />
              </div>
              {err.openingDate ? <div className="field-error"><Ic n="alert" size={12} />{err.openingDate}</div> : <div className="field-hint">之前的账不算。</div>}
            </div>
          </div>

          {isEdit && openingDelta !== 0 ? (
            <Banner tone="warm" icon="alert">
              改完变成 <b>{money(curBal + openingDelta)}</b>。想和银行对上，请去核对。
            </Banner>
          ) : null}

          <div className="field">
            <div className="field-label"><span>状态</span></div>
            <div style={{ display: "flex", gap: 10 }}>
              <button className={"check" + (status === "active" ? " on" : "")} style={{ flex: 1 }} onClick={() => setStatus("active")}>
                <span className="box round">{status === "active" ? <Ic n="check" size={11} sw={2.6} /> : null}</span>
                <span><span className="t">在用</span><span className="s">记账时能选到</span></span>
              </button>
              <button className={"check" + (status === "off" ? " on" : "")} style={{ flex: 1 }} onClick={() => setStatus("off")}>
                <span className="box round">{status === "off" ? <Ic n="check" size={11} sw={2.6} /> : null}</span>
                <span><span className="t">停用</span><span className="s">留着旧账，不再记新的</span></span>
              </button>
            </div>
            {status === "off" && hasFlows ? (
              <div className="field-hint" style={{ color: "var(--rust)" }}>
                这有 {records.filter((r) => r.accountId === account.id).length} 笔旧账，停用不会丢。
              </div>
            ) : null}
          </div>

          <div className="field">
            <div className="field-label"><span>备注</span><span style={{ color: "var(--dove)", fontWeight: 400 }}>{note.length}/120</span></div>
            <textarea value={note} maxLength={120} onChange={(e) => setNote(e.target.value)}
              placeholder="它一般用来干什么"
              style={{ minHeight: 76, padding: "12px 14px", borderRadius: "var(--r-input)", background: "var(--fog)", border: "none", resize: "vertical", fontSize: 13.5, lineHeight: 1.65 }} />
          </div>

          {!isEdit ? (
            <Banner tone="sky" icon="info">
              存好后随便记一笔试试，能选到就通了。
            </Banner>
          ) : null}
        </div>

        <div className="drawer-foot">
          <span style={{ fontSize: 12, color: "var(--graphite)" }}>
            {isEdit ? "改动会留记录" : "建好即可记账"}
          </span>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn-line" onClick={onClose}>取消</button>
            <button className="btn-fill" onClick={submit}>{isEdit ? "保存" : "建好"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ==========================================================================================
   J · 对账调整弹窗
   ========================================================================================== */
function ReconModal({ accountId, accounts, adjusts, onClose, onDone }) {
  const [pick, setPick] = React.useState(accountId || accounts[0].id);
  const a = accounts.find((x) => x.id === pick) || accounts[0];
  const sysBal = accountBalance(a, adjusts);
  const [actual, setActual] = React.useState("");
  const [date, setDate] = React.useState(todayISO());
  const [reason, setReason] = React.useState("");
  const [err, setErr] = React.useState({});

  const diff = actual === "" ? null : (Number(actual) || 0) - sysBal;

  const submit = () => {
    const e = {};
    if (actual === "" || isNaN(Number(actual))) e.actual = "请填写对账后的实际余额";
    if (diff !== null && diff === 0) e.actual = "实际余额与系统一致，无需调整";
    if (!reason.trim()) e.reason = "请写明差额原因（对账留痕的关键）";
    if (!date) e.date = "请选择调整日期";
    setErr(e);
    if (Object.keys(e).length) return;
    onDone({ accountId: pick, amount: diff, reason: reason.trim(), date });
  };

  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="modal-wrap" style={{ pointerEvents: "none" }}>
        <div className="modal wide" style={{ pointerEvents: "auto" }} data-screen-label="03 余额对账">
          <div className="modal-head">
            <h3>核对余额</h3>
            <p>把银行卡里的真实数字填进来，差多少系统自己算。</p>
          </div>
          <div className="modal-body">
            <div className="field">
              <div className="field-label"><span>哪个账户 <span className="req">*</span></span></div>
              <Dropdown label="选择账户" value={pick} onChange={setPick} width="100%"
                options={accounts.map((x) => ({ value: x.id, label: x.name + (x.status === "off" ? "（已停用）" : "") }))} />
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <div className="field">
                <div className="field-label"><span>账上有的</span></div>
                <div style={{ height: 46, display: "flex", alignItems: "center", padding: "0 14px", background: "var(--fog)", borderRadius: "var(--r-input)", fontSize: 16, fontWeight: 480, fontVariantNumeric: "tabular-nums" }}>
                  {money(sysBal)}
                </div>
                <div className="field-hint">起始 + 进 − 出 ± 核对</div>
              </div>
              <div className="field">
                <div className="field-label"><span>实际金额 <span className="req">*</span></span></div>
                <div className={"money-in" + (err.actual ? " err" : "")} style={err.actual ? { boxShadow: "inset 0 0 0 1.5px #d96a63" } : null}>
                  <span className="cur">¥</span>
                  <input inputMode="decimal" placeholder="0.00" value={actual} onChange={(e) => setActual(e.target.value.replace(/[^\d.-]/g, ""))} />
                </div>
                {err.actual ? <div className="field-error"><Ic n="alert" size={12} />{err.actual}</div> : <div className="field-hint">看手机银行。</div>}
              </div>
            </div>

            <div style={{
              display: "flex", alignItems: "center", justifyContent: "space-between",
              background: diff === null ? "var(--fog)" : diff === 0 ? "rgba(211,227,252,.5)" : "var(--apricot)",
              borderRadius: 16, padding: "14px 16px",
            }}>
              <div>
                <div style={{ fontSize: 12, color: diff === null ? "var(--graphite)" : "rgba(93,42,26,.72)" }}>差多少</div>

function RecordDialog({ accounts, adjusts, defaultDir, onClose, onSubmit, businessForm }) {
  const [dir, setDir] = React.useState(defaultDir || "out");       // out=流出 / in=流入
  const [subject, setSubject] = React.useState("");
  const [amount, setAmount] = React.useState("");
  const [acctId, setAcctId] = React.useState("");
  const [noAcct, setNoAcct] = React.useState(false);
  const [payer, setPayer] = React.useState("");
  const [payee, setPayee] = React.useState("");
  const [date, setDate] = React.useState(todayISO());
  const [note, setNote] = React.useState("");
  const [err, setErr] = React.useState({});

  const OUT_SUBJECTS = ["购房定金", "购房首付", "购房尾款", "交易税费(买入)", "水电改造", "木瓦工程", "月供利息", "平台服务费", "室内设计费"];
  const IN_SUBJECTS = ["售房款", "定金收款", "验房费", "跟投款", "违约金收入"];
  const subjects = dir === "out" ? OUT_SUBJECTS : IN_SUBJECTS;

  const active = accounts.filter((a) => a.status === "active");
  const chosen = accounts.find((a) => a.id === acctId);
  const lastUsed = dir === "out" ? "acc-1" : "acc-1";

  // 账户字段自动跟随方向：流出=付款账户，流入=收款账户
  const acctLabel = dir === "out" ? "付款账户" : "收款账户";
  const counterpartyLabel = dir === "out" ? "收款方" : "付款方";

  const submit = () => {
    const e = {};
    if (!subject) e.subject = "请选择科目";
    if (!amount || Number(amount) <= 0) e.amount = "请填写大于 0 的金额";
    if (!noAcct && !acctId) e.acct = "请选择" + acctLabel + "，或标记「没走账户」";
    if (!date) e.date = "请选择日期";
    if (noAcct && !note.trim()) e.note = "标记「未走账户」时请写明原因";
    setErr(e);
    if (Object.keys(e).length) return;
    onSubmit({ dir, subject, amount: Number(amount), accountId: noAcct ? null : acctId, date, note, payer, payee });
  };

  return (
    <>
      <div className="scrim" onClick={onClose}></div>

function ScreenProjectDetail({ records, accounts, adjusts, go, onLock, lockLeft }) {
  const [open, setOpen] = React.useState(false);
  const [dir, setDir] = React.useState("all");
  const [q, setQ] = React.useState("");
  const [localRecs, setLocalRecs] = React.useState(records.filter((r) => r.code === "XM-2026-0018"));

  const rows = localRecs.filter((r) => {
    if (dir === "out" && !(r.out > 0)) return false;
    if (dir === "in" && !(r.in > 0)) return false;
    if (q.trim() && !(r.subject + r.payer + r.payee).toLowerCase().includes(q.trim().toLowerCase())) return false;
    return true;
  });

  const totalIn = localRecs.reduce((s, r) => s + r.in, 0);
  const totalOut = localRecs.reduce((s, r) => s + r.out, 0);

  const handleSubmit = (payload) => {
    const account = accounts.find((a) => a.id === payload.accountId);
    setLocalRecs([{
      id: "r-" + Date.now(), project: "阳光里 3-2-1801", code: "XM-2026-0018",
      subject: payload.subject, stage: "签约", date: payload.date,
      out: payload.dir === "out" ? payload.amount : 0,
      in: payload.dir === "in" ? payload.amount : 0,
      payer: payload.dir === "out" ? (account ? account.name : "—") : (payload.payer || "—"),
      payee: payload.dir === "out" ? (payload.payee || "—") : (account ? account.name : "—"),
      accountId: payload.accountId, by: "陈明远", voucher: 0, note: payload.note,
    }].concat(localRecs));
    setOpen(false);
    window.dispatchEvent(new CustomEvent("d-toast", {
      detail: payload.accountId ? "记账成功 · 已同步到 " + account.name : "记账成功 · 未挂账户",
    }));
  };

  return (
    <div className="page" data-screen-label="07 项目账本明细">

        <span className="lock-timer"><Ic n="clock" size={13} /> 还能看 <span className="tnum">{lockLeft}</span></span>
      </div>

      <div className="page-head" style={{ marginBottom: 22 }}>
        <div>
          <div className="h1-row" style={{ gap: 10 }}>
            <h1 style={{ fontSize: 38 }}>阳光里 3-2-1801</h1>
            <Pill tone="solid">在售</Pill>
            <Pill tone="line">没结账</Pill>
          </div>
          <p className="desc">XM-2026-0018 · 浦东张杨路 1288 弄</p>
        </div>
        <div className="aside" style={{ paddingTop: 8 }}>
          <button className="btn-text muted" onClick={() => window.dispatchEvent(new CustomEvent("d-toast", { detail: "演示：导出本项目" }))}>
            <Ic n="download" size={14} /> 导出
          </button>
          <button className="btn-line" onClick={() => window.dispatchEvent(new CustomEvent("d-toast", { detail: "演示：结账要权限" }))}>结账</button>
          <button className="btn-fill" onClick={() => setOpen(true)}><Ic n="plus" size={15} /> 记一笔</button>
        </div>
      </div>

      <div className="stat-grid c4" style={{ marginBottom: 20 }}>
        <div className="stat-card"><div className="stat-label"><span className="stat-dot" />收进来</div><div className="stat-value money-pos">{totalIn > 0 ? "¥" + wan(totalIn) + "万" : "¥0"}</div><div className="stat-sub">{localRecs.filter((r) => r.in > 0).length ? localRecs.filter((r) => r.in > 0).length + " 笔" : "还没收过"}</div></div>
        <div className="stat-card"><div className="stat-label"><span className="stat-dot" />花出去</div><div className="stat-value money-neg">{totalOut > 0 ? "¥" + wan(totalOut) + "万" : "¥0"}</div><div className="stat-sub">{localRecs.filter((r) => r.out > 0).length ? localRecs.filter((r) => r.out > 0).length + " 笔" : "还没花过"}</div></div>

        <div className="stat-card"><div className="stat-label"><span className="stat-dot d-apricot" />记了账户</div>
          <div className="stat-value">{localRecs.filter((r) => r.accountId).length}<span className="unit">/ {localRecs.length} 笔</span></div>
          <div className="stat-sub">{localRecs.filter((r) => !r.accountId).length === 0 ? "都记全了" : "还有 " + localRecs.filter((r) => !r.accountId).length + " 笔没记"}</div>

                    <div className="cell-sub">{r.by} 记的{r.note ? " · " + r.note : ""}</div>
                  </td>
                  <td>
                    {a ? (
                      <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <AccountGlyph type={a.type} size={24} radius={8} />

                  <td className="num tnum">{r.in > 0 ? <span className="money-pos">{money(r.in)}</span> : <span style={{ color: "var(--dove)" }}>—</span>}</td>

/* ==========================================================================================
   P · App（状态编排 + 解锁倒计时 + 路由）
   ========================================================================================== */
function App() {
  const [page, setPage] = React.useState("accounts");
  const [collapsed, setCollapsed] = React.useState(false);
  const [openGroups, setOpenGroups] = React.useState({});
  const [toast, setToast] = React.useState(null);
  const [toastBad, setToastBad] = React.useState(false);
  const [notesOpen, setNotesOpen] = React.useState(false);
  const toastTimer = React.useRef(null);

  // 账户与流水状态
  const [accounts, setAccounts] = React.useState(INITIAL_ACCOUNTS);
  const [adjusts, setAdjusts] = React.useState(INITIAL_ADJUSTS);
  const [records, setRecords] = React.useState(INITIAL_RECORDS);

  // 视图开关
  const [view, setView] = React.useState("grid");

  // 弹层状态
  const [drawer, setDrawer] = React.useState(null);         // { mode, id }
  const [recon, setRecon] = React.useState(null);           // accountId | "any"
  const [pwModal, setPwModal] = React.useState(null);       // "setup" | "reset" | "change"
  const [detailId, setDetailId] = React.useState(null);

  // 入口锁：解锁后 30 分钟滑动过期
  const [unlocked, setUnlocked] = React.useState(true);      // 设计稿默认解锁，便于直接看主界面
  const [hasPassword, setHasPassword] = React.useState(true);
  const [lockReason, setLockReason] = React.useState("manual");
  const [attemptsLeft, setAttemptsLeft] = React.useState(3);
  const [hardLocked, setHardLocked] = React.useState(false);
  const [left, setLeft] = React.useState(30 * 60);           // 秒

  React.useEffect(() => {
    if (!unlocked) return;
    const t = setInterval(() => {
      setLeft((s) => {
        if (s <= 1) { setUnlocked(false); setLockReason("expired"); return 30 * 60; }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, [unlocked]);

  const lockLeft = React.useMemo(() => {
    const m = Math.floor(left / 60);
    const s = left % 60;
    return m + ":" + String(s).padStart(2, "0");
  }, [left]);

  // toast
  React.useEffect(() => {
    const h = (e) => {
      setToast(e.detail);
      setToastBad(!!e.bad);
      clearTimeout(toastTimer.current);
      toastTimer.current = setTimeout(() => setToast(null), 2400);
    };
    window.addEventListener("d-toast", h);
    return () => window.removeEventListener("d-toast", h);
  }, []);

  // 任意操作重置滑动画
  const touch = React.useCallback(() => { if (unlocked) setLeft(30 * 60); }, [unlocked]);

  // 未解锁时点击资金账户菜单：记住目标页，解锁后直接落到那一页（而不是强制回总览）
  const [pendingPage, setPendingPage] = React.useState(null);
  const go = (p) => {
    const lockedTarget = p === "accounts" || p === "accounts-ledger" || p === "accounts-recon";
    if (lockedTarget && !unlocked) { setPendingPage(p); setPage("accounts"); return; }
    touch();
    setPage(p);
    setDetailId(null);
  };

  const onUnlock = () => {
    setUnlocked(true);
    setLeft(30 * 60);
    setAttemptsLeft(3);
    setHardLocked(false);
    if (pendingPage) { setPage(pendingPage); setPendingPage(null); }
    window.dispatchEvent(new CustomEvent("d-toast", { detail: "已进入 · 30 分钟没操作会自动锁" }));
  };

  const onLock = () => {
    if (page === "accounts" || page === "accounts-ledger" || page === "accounts-recon") setPendingPage(page);
    setUnlocked(false);
    setLockReason("manual");
    setPage("accounts");
    setDetailId(null);
    window.dispatchEvent(new CustomEvent("d-toast", { detail: "已锁定" }));
  };

  const saveAccount = (data, isEdit) => {
    if (isEdit) {
      setAccounts(accounts.map((a) => (a.id === data.id ? data : a)));
      window.dispatchEvent(new CustomEvent("d-toast", { detail: "改好了" }));
    } else {
      setAccounts(accounts.concat([data]));
      window.dispatchEvent(new CustomEvent("d-toast", { detail: "建好了 · 现在就能记账" }));
    }
    setDrawer(null);
  };

  const toggleAccount = (id) => {
    setAccounts(accounts.map((a) => (a.id === id ? { ...a, status: a.status === "active" ? "off" : "active" } : a)));
    const a = accounts.find((x) => x.id === id);
    window.dispatchEvent(new CustomEvent("d-toast", { detail: (a && a.status === "active" ? "已停用：" : "已启用：") + (a ? a.name : "") }));
  };

  const submitRecon = (payload) => {
    setAdjusts(adjusts.concat([{
      id: "adj-" + Date.now(), accountId: payload.accountId, date: payload.date,
      amount: payload.amount, reason: payload.reason, operator: "陈明远",
      createdAt: new Date().toISOString().slice(0, 16).replace("T", " "),
    }]));
    setRecon(null);
    window.dispatchEvent(new CustomEvent("d-toast", { detail: "核对已记录 " + signed(payload.amount) }));
  };

  const fixRecord = (id, accountId) => {
    setRecords(records.map((r) => (r.id === id ? { ...r, accountId } : r)));
    const a = accounts.find((x) => x.id === accountId);
    window.dispatchEvent(new CustomEvent("d-toast", { detail: "已挂到：" + (a ? a.name : "") }));
  };

  const isLockedPage = page === "accounts" || page === "accounts-ledger" || page === "accounts-recon";

  let content;
  if (isLockedPage && !unlocked) {
    content = (
      <LockScreen
        onUnlock={onUnlock}
        onReset={() => setPwModal("reset")}
        onForgot={() => setPwModal("reset")}
        onSetPassword={() => setPwModal("setup")}
        reason={lockReason}
        attemptsLeft={attemptsLeft}
        locked={hardLocked}
        hasPassword={hasPassword}
      />
    );
  } else if (page === "accounts") {
    content = (
      <ScreenAccounts
        accounts={accounts} adjusts={adjusts} records={records}
        view={view} setView={setView} go={go}
        onOpenAccount={(id) => { setDetailId(id); setPage("accounts-detail"); }}
        onNew={() => setDrawer({ mode: "new" })}
        onEdit={(id) => setDrawer({ mode: "edit", id })}
        onToggle={toggleAccount}
        onRecon={(id) => setRecon(id || "any")}
        onLock={onLock}
        lockLeft={lockLeft}
        onChangePassword={() => setPwModal("change")}
      />
    );
  } else if (page === "accounts-detail") {
    content = (
      <ScreenAccountDetail
        accountId={detailId || accounts[0].id} accounts={accounts} adjusts={adjusts} records={records}
        onBack={() => { setPage("accounts"); setDetailId(null); }}
        onEdit={(id) => setDrawer({ mode: "edit", id })}
        onRecon={(id) => setRecon(id)}
        onLock={onLock} go={go} lockLeft={lockLeft}
      />
    );
  } else if (page === "accounts-ledger" || page === "accounts-recon") {
    content = (
      <ScreenAccountLedger
        accounts={accounts} records={records} adjusts={adjusts}
        onLock={onLock} go={go} lockLeft={lockLeft}
        onPickAccount={(id) => { setDetailId(id); setPage("accounts-detail"); }}
        onFixRecord={fixRecord}
      />
    );
  } else if (page === "ledger") {
    content = <ScreenProjectLedger records={records} accounts={accounts} go={go} onLock={onLock} />;
  } else if (page === "project-detail") {
    content = (
      <ScreenProjectDetail
        records={records} accounts={accounts} adjusts={adjusts}
        go={go} onLock={onLock} lockLeft={lockLeft}
      />
    );
  } else if (page === "appendix") {
    content = <ScreenAppendix go={go} />;
  } else {
    content = <ScreenPlaceholder go={go} />;
  }

  return (
    <div className={"app" + (collapsed ? " collapsed" : "")} onMouseDown={touch} onKeyDown={touch}>
      <Sidebar page={page} go={go} collapsed={collapsed} setCollapsed={setCollapsed}
        openGroups={openGroups}
        toggleGroup={(id) => setOpenGroups((o) => ({ ...o, [id]: o[id] === false }))}
        onToggleNotes={() => setNotesOpen(!notesOpen)} />
      <main className="main">{content}</main>

      {drawer ? (
        <AccountDrawer
          mode={drawer.mode}
          account={drawer.id ? accounts.find((a) => a.id === drawer.id) : null}
          accounts={accounts} records={records} adjusts={adjusts}
          onClose={() => setDrawer(null)}
          onSave={saveAccount}
        />
      ) : null}

      {recon ? (
        <ReconModal
          accountId={recon === "any" ? (detailId || accounts[0].id) : recon}
          accounts={accounts} adjusts={adjusts}
          onClose={() => setRecon(null)}
          onDone={submitRecon}
        />
      ) : null}

      {pwModal ? (
        <PasswordSetupModal
          mode={pwModal}
          onClose={() => setPwModal(null)}
          onDone={() => {
            setHasPassword(true);
            setPwModal(null);
            onUnlock();
            window.dispatchEvent(new CustomEvent("d-toast", { detail: "密码设好了" }));
          }}
        />
      ) : null}

      <NotesPanel open={notesOpen} onClose={() => setNotesOpen(false)} />
      {toast ? <div className={"toast" + (toastBad ? " bad" : "")}>{toast}</div> : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
