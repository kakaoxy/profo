<!--
  购房模拟器 · 购房模块 高保真可点击设计稿 v1
  ─────────────────────────────────────────────────────────────
  视觉真源：miniapp/app.wxss（Steep 令牌）+ docs/DESIGN.md + 装修模块设计稿 v4/v6

  迭代动因（2026-09-17）：
    装修模块重做后（docs/2026-09-15-装修模块-高保真设计稿.html），再回看购房模块
    显得文字过多。购房模块照装修 v4 的思路减量，但目标不同 —— 装修是「少讲坑、
    只深耕一个坑」，购房要同时讲清三件事：

      目标 ①  流程清晰   —— 12 个节点，一屏一句话，不再有 60-130 字的说明段
      目标 ②  时间周期   —— 「经历周期 / 常规周期」并列，每屏都摆出来
      目标 ③  坑与规避   —— 每个阶段一句「最容易踩的点 + 怎么避免」，
                            另有两个深坑做成逐条决策清单（签约 / 交房）

  三条设计口径（2026-09-17 与用户确认）：
    ① 深坑策略：2 个深坑 = 签约（不可逆的钱）+ 交房（最后一张牌）。
       签约拆两屏：签字前查清 6 项（产调/产权人/学位/税费归属/定金罚则/付款节点）
                   ＋ 合同里写死 6 项（违约金/交期/贷不到怎么办/尾款扣押/欠费/清单）。
       交房一屏：交割 4 项核对 + 「全部结清 / 尾款扣押」二选一。
    ② 决策点：维持现状（不删任何决策点，只压每屏文字）。共 24 屏，与原实现的
       SceneKey 一一对应；每屏 = 一句现场（≤26 字）+ 选项 + 一句坑 + 一句怎么避免。
    ③ 时间口径：单轨 + 一个对照。只有一条「经历周期」时间线——每段天数从该段的
       「常规周期」区间随机抽一个数（如审批 7-15 天 → 抽 11 天），同一次运行内固定、
       重开重抽；行业常见口径（全程 1-3 个月，见 scenes-close.ts）只作对照。
       落到界面上是四处：
         · 每屏顶部「双层时间条」：左 = 经历周期（这一段抽到的天数 + 累计第 N 天），
           右 = 常规周期（X-Y 天）+ 这一段在等谁、为什么是这个区间
         · 顶部状态带的期字条：已走的 N 天（黑）+ 到 90 天刻度的余量（暖色区）
         · 三张「等待屏」（审批 / 过户 / 交房）：常规节点轴（走到哪一步）+ 对方在做什么
           + 你现在要做什么——回答「为什么要等这么久」
         · 每屏主按钮上的等待承诺（如「送银行审批 · 等批贷 7-15 天」）：按下之前就知道要等多久
         · 总账屏：你这趟走出来的总天数（抽取 + 踩坑）→ 常规 1-3 个月的对比条 + 节点柱图
       真不花时间的屏不摆时间条——不编数字：选身份 / 选现金 / 自定义房源 / 成交·到手价 /
       中介费 / 贷款方式 / 算账 / 资格结果（与 qa 同属「资格」节点，时间已在 qa 屏给出）。

  时间体感迭代（2026-09-17 与用户确认后落地，动因：用户「不清楚下一步什么时候做、要多久、
  为什么要等这么久」）：
    ① 时间条信息配对纠错：原来右格只写「常见口径」（等于浪费），而把最能说明问题的
       realNote（如「公积金 15-30 天」）错配在左格；现在右格 = 常规周期 + 等谁 + 为什么。
    ② 主按钮统一加等待承诺：核验 1-3 天 / 筹钱 1-2 周 / 等批贷 7-15 天 / 审税 7-15 天 /
       出证 1-3 天 / 放款 3-15 天；当天办完的屏不加（避免满屏噪音）。
    ③ 三张等待屏（审批 18 / 过户 20 / 交房 22）在原有屏内展开等待明细，不新增屏幕，
       24 屏与 SceneKey 的对应关系不变。
    ④ 措辞与取值（本轮）：模拟工期 → 经历周期、真实周期 → 常规周期；经历周期不再写死档位，
       改为从该段常规区间抽数；逻辑上同期的环节（资格核验与看房同期、砍价在看房里谈、
       网签与签约同一趟）标记 par 不重复计时，使总经历落在 1-3 个月的量级。
       ⚠️ 这条与代码不一致：miniapp constants.ts 的 DAYS「模拟 16 天」轨道在本稿已退休，
          代码侧仍是 16 天档位（同步时需一并决定保留哪一套）。

  付款确认（2026-09-17 与用户确认后加，动因：用户认为「出款时应该同时感知这一步的分量
  和下一步的时间周期」）：五个出款点——定金 / 网签首付先付 / 补足剩余首付 / 缴税 / 扣押尾款
  （kind 名沿用实现的 payModal：deposit / firstPay / restPay / transfer / holdback）。
  ⚠️ 2026-09-17 修正：末笔「扣押尾款」是**从卖方应得房款中扣留**，不占用买方现金——
  弹窗第三格因此显示「现金不变」，总账也不把它算成多花的钱（原先按买方出款算，
  总账少记一笔、且现金刚好够时会显示负剩余）。
  弹窗固定三层信息：
    · 现金三段：现有现金 → 本次支付 → 支付后剩余（与对应屏的账同一口径，不另编数字）
      「现有现金」= 可动用现金（手头 + 已筹）− 进入本屏前已出的款；口径见 paid()
    · 口径说明 + 违约警示（定金罚则 / 网签后违约金 20%，取自实现 payModal 的 warn）
    · 「下一节点：名称 · 常规周期 X-Y 天」+「等谁」——常规周期与 waitWho / waitWhy 复用 FLOW；
      末笔（扣押尾款）的下一节点是装修，本稿不含工期，只标注「见装修模块设计稿」。

  政策口径（2026-09-17 核对，真源：上海市住建委 / 市房屋管理局通知）：
    · 限购（自 2026-02-26 起施行）：沪籍家庭含成年单身按居民家庭执行——外环外不限套数、
      外环内限购 2 套；非沪籍社保 / 个税满 1 年——外环外不限套数、外环内限购 1 套，
      满 3 年及以上——外环内限购 2 套；持《上海市居住证》满 5 年——免社保 / 个税，全市限购 1 套。
    · 二套商贷最低首付（自 2026-08-21 起施行）：外环内 25% / 外环外 15%。
    · 置换：先卖后买、原房已售 → 名下 0 套，按首套认定（首付与利率均按首套算）。
    · 卖方税费：增值税满 2 年免征（不满 2 年全额 5% + 附加）；个税——买卖所得满五唯一免征、
      否则核定 1%，继承 / 赠与所得满五唯一免征、否则按（转让价 − 原值）× 20% 计，
      且满二 / 满五起算可追溯原产权人（原值凭证要留好）。
    · 婚姻状况自 2025-08-26 起不再影响限购口径，故问答树已删去「婚姻状况」一问。

  减量实测（口径：只数中日韩表意字；原实现 = 24 屏场景文案 + 该屏会弹出的弹层文案
  （agreementModal 379 字 / payModal 等），由 miniapp 临时 vitest 实测；本稿 = 屏内可见正文，
  去掉评审用「设计说明」与默认折叠的明细）：
    原实现 5054 字 → 本稿 3830 字（−24.2%）；24 屏里 21 屏更轻；折叠明细 506 字为按需展开。
    ⚠️ 2026-09-17 时间体感迭代后已不是 3830：按同一口径实测 +478 字（三张等待屏约 258 字，
    时间条「等谁 + 为什么」与主按钮等待承诺约 220 字，同时删去了不再显示的 realNote 与
    「常见口径」），本稿正文约 4308 字（对原实现 −14.8%）——减量让位于「等多久、为什么等」。
    ⚠️ 同日又加了五个付款确认弹窗：实测 +551 字（deposit 117 / firstPay 129 / restPay 126 /
    transfer 93 / holdback 86，含现金三段与按钮）。这部分文案原实现本来就有（payModal 等，
    已计入 5054 字的原实现口径）——按用户要求加回，本稿正文约 4859 字（对原实现 −3.9%）。
    要回收字数，最直接的是砍掉五个弹窗的「口径说明 + 违约警示」（约 240 字，实现里已有），
    只留现金三段 + 下一节点与常规周期。
    原「3 屏更重」的账（当时口径）：
      · qa +53（原屏只有题干与 2 个选项共 28 字；现在多了「资格不过 → 无法网签」这一坑）
      · loanChk +16（多了「审批 7-15 天 / 公积金 15-30 天」的真实周期条）
      · settle +89（多的是「学费单」结算块；写清路径下 settle 为 65 字，反而 −44%）

  与代码的对齐（事实真源：miniapp/pages/house-simulator）：文案与数据均取自
  constants.ts（房源 / 角色 / 贷款方式 / 12 节点 / 税费口径）、calc.ts（限购问答树 /
  砍价底线）、scenes-*.ts（各屏原文，本稿只做压缩不做改写口径）。
  ⚠️ 本稿是设计稿，不是实现：金额为演示口径（房源 F · 522.5 万成交 · 首套组合贷）。

  ⚠️ 2026-09-17 全流程金额与逻辑修正（评审稿自查后逐项修，改动都要同步进 miniapp）：
    ① 筹钱：缺口 = 需现金 −（手头 + 已筹），三条渠道各有上限（30/20/20），已筹只补到缺口为止；
       原先借款不减缺口，「签约」按钮永不出现 → 缺口 ≤70 万时流程死锁。
    ② paid() 改为「进入本屏之前已出的款」，出款弹窗不再把本次支付重复扣一次（现金刚好够时会显示负剩余）。
    ③ 「追加首付」标出真实差额（首付提到 X%、多掏 Y 万），提档后必须回算账屏复核现金是否够。
    ④ 契税统一由 deedRateOf（面积 × 家庭套数）推导，预设房源不再写死 1.5%（二套 >140㎡ 应为 2%）。
    ⑤ 自定义房源税费预览与实付同走 sellerVatOf（未满 2 年的增值税含 12% 附加）。
    ⑥ 「自定义房源」屏不再被 ensureData 静默塞入房源 F；「用不上」改为回选房。
    ⑦ 纯公积金额度上限 80 万计入账：超出部分列为「需现金补足」，贷款额与月供按上限算。
    ⑧ 全款（100%）跳过贷款方案 / 审批，直达补足尾款；贷款方式标签按所选方式显示，不再硬编码「组合贷」。
    ⑨ 后果落到流程里：资格不过 → 网签屏被拦下；风控「坚持硬上」→ 银行拒批，需追加首付 / 拉长年限 / 换房。
    ⑩ 天数统一 elapsed() = 抽取累计 + 坑拖出的天，状态带 / 时间条 / 总账同口径；砍价折扣按「9.4 折」显示。
    ⑪ 第一轮出价即越线（如 -6% 撞上 5% 底线）时立刻定成交价 = 房东底线价：
      原先只在第二轮落价，叫停屏读的是还没赋值的 S.deal，会显示「最多让到 0 万 / 接受底价 0 万」。
     ⚠️ 以上修正让正文文案净增约 150 字（额度缺口行、拒批与网签被拦的后果块），字数口径需重算。

  ⚠️ 移植到微信小程序的已知替换（评审稿里的写法在小程序不可用 / 降级）：
    · font-variant-numeric:tabular-nums —— 微信不支持，数字会跳动，改用等宽字体
    · scrollIntoView({behavior:'smooth'}) —— 改用 scroll-into-view 属性
    · wheel 事件（桌面评审用）—— 小程序无滚轮，移植时删掉
    · 本文件自包含单文件（无 CDN / 无构建），file:// 直接打开即可评审。
      之所以不拆文件：与 装修模块设计稿 保持同一交付形态，评审时两个文件对照看。

<style>
/* ════════════════════════════════════════════════════════════════
   令牌层 · 与 miniapp/app.wxss 逐项对齐（rpx ÷ 2 = px，375px 设计宽）
   ════════════════════════════════════════════════════════════════ */
:root{
  --ink:#17191c; --pure-white:#ffffff; --fog:#f7f7f8;
  --ash:#4c4c4c; --graphite:#777b86; --dove:#a3a6af;
  --rust:#5d2a1a; --apricot-wash:#fbe1d1; --sky-wash:#d3e3fc;
  --shadow-sm:0 4px 16px rgba(23,25,28,.06);
  --shadow-md:0 8px 28px rgba(23,25,28,.10);
  --hairline:#ece7de;
  --hairline-soft:#eeeff1;
  --ok:#176b4d;
  --danger:#b7410e;
  --sky-ink:#2a5ca0;
  --font:-apple-system,BlinkMacSystemFont,Roboto,"Noto Sans SC","Source Han Sans SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:#111214;
  font-family:var(--font);
  font-size:14px; line-height:1.4; color:var(--ink);
  display:grid; place-items:center;
}

/* ── 设备外框（≥700px 时居中成手机；窄屏全屏铺满） ── */
#app{
  position:relative; width:100vw; height:100vh;
  display:flex; flex-direction:column;
  background:var(--fog); overflow:hidden;
}
@media (min-width:700px){
  #app{width:390px;height:844px;border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
}

/* ════════════════════════════════════════════════════════════════
   购房状态带（guard）· 一行定位 + 12 段节点线 + 钱条 + 时间条
   时间条是本稿与装修稿最大的差别：经历在我这边，常规在我对面
   ════════════════════════════════════════════════════════════════ */
.guard{
  flex:none; background:var(--pure-white); border-bottom:1px solid var(--hairline);
  padding:10px 16px 12px; z-index:6;
}
.g-top{display:flex;align-items:center;gap:8px;font-size:12px}
.g-badge{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;
  background:var(--fog);border-radius:999px;font-size:12px;font-weight:500;color:var(--ash);
}
.g-dot{width:6px;height:6px;border-radius:50%;background:var(--rust)}
.g-cur{color:var(--ink);font-weight:500}
.g-sp{flex:1}
.g-day{color:var(--graphite);font-variant-numeric:tabular-nums}
.g-day b{color:var(--ink);font-weight:500}

/* 12 段节点线：已完成 ink / 当前 rust / 未到 hairline */
.g-line{display:flex;gap:2px;margin-top:9px}
.g-seg{flex:1;height:4px;border-radius:999px;background:var(--hairline);transition:background .3s}
.g-seg.done{background:var(--ink)}
.g-seg.cur{background:var(--rust);box-shadow:0 0 0 2px var(--apricot-wash)}
.g-seg.future{background:var(--hairline)}
.g-names{display:flex;gap:2px;margin-top:4px}
.g-names span{flex:1;text-align:center;font-size:8.5px;color:var(--dove);overflow:hidden;white-space:nowrap}
.g-names span.on{color:var(--ink);font-weight:500}

/* 钱条 / 时间条 */
.g-meters{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.gm{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--graphite)}
.gm-k{flex:none;width:12px;color:var(--dove);font-weight:500}
.gm-bar{
  flex:1;height:7px;border-radius:999px;background:var(--fog);
  display:flex;overflow:hidden;position:relative;
}
.gm-bar i{display:block;height:100%;transition:width .55s cubic-bezier(.22,1,.36,1)}
.gm-base{background:var(--ink)}
.gm-over{background:var(--danger)}
/* 常规周期区间带：经历天数之外、到 90 天刻度还剩下的那些天 */
.gm-range{background:var(--apricot-wash);opacity:.85}
.gm-v{flex:none;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;min-width:0;white-space:nowrap;text-align:right}
.gm-v em{font-style:normal;color:var(--dove);font-weight:400;margin-left:4px}
.gm-bar.hit{animation:barHit .9s ease}
@keyframes barHit{
  0%{box-shadow:0 0 0 0 rgba(183,65,14,0)}
  30%{box-shadow:0 0 0 3px rgba(183,65,14,.28)}
  100%{box-shadow:0 0 0 0 rgba(183,65,14,0)}
}
.g-real{margin-top:2px;font-size:10.5px;color:var(--dove);line-height:1.4}

/* ════════════════════════════════════════════════════════════════
   舞台区
   ═══════════════════════════════════════════════════════════════ */
.stage{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stage::-webkit-scrollbar{width:0;height:0}
.sc{padding:20px 18px 40px;animation:arrive .42s cubic-bezier(.22,1,.36,1)}
@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* 排版（typo.wxss 对齐） */
.eyebrow{display:inline-flex;align-items:center;font-size:12px;font-weight:500;color:var(--rust);letter-spacing:.04em}
.hd{font-weight:500;font-size:25px;line-height:1.22;letter-spacing:-.015em;color:var(--ink);margin:6px 0 0;white-space:pre-line;text-wrap:pretty}
.hd-hero{display:block;font-size:38px;line-height:1.2;margin-bottom:4px}
.sub{margin:6px 0 0;font-size:14px;color:var(--ash);line-height:1.65;text-wrap:pretty}
.sub.sm{font-size:12.5px;color:var(--graphite);line-height:1.6}

/* 卡片 */
.card{background:var(--pure-white);border-radius:24px;box-shadow:var(--shadow-sm);padding:18px;margin-top:14px}
.card-sky{background:var(--sky-wash)}
.b-title{font-size:13px;font-weight:500;color:var(--ink);line-height:1.5}
.b-desc{font-size:12.5px;color:var(--ash);margin-top:5px;line-height:1.7;white-space:pre-line;text-wrap:pretty}

/* 提示条 */
.ok-note{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;line-height:1.6;color:var(--ash);background:var(--fog);border-radius:14px;padding:10px 14px;margin-top:12px;text-wrap:pretty}
.ok-note .ok-b{color:var(--ink);font-weight:500;flex:none}

/* 内部工具类 */
.num{font-variant-numeric:tabular-nums}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:22px}
.sect-t{font-size:13px;font-weight:500;color:var(--ink)}
.sect-x{font-size:11px;color:var(--dove);font-variant-numeric:tabular-nums}

/*  双层时间条（每屏顶部，本稿的签名组件）：左 = 经历周期，右 = 常规周期 ── */
.tstrip{display:flex;gap:8px;margin-top:10px}
.tstrip .cell{flex:1;background:var(--pure-white);border-radius:16px;box-shadow:var(--shadow-sm);padding:9px 11px}
.tstrip .cell.real{background:var(--apricot-wash)}
.tstrip .k{font-size:10.5px;color:var(--graphite)}
.tstrip .v{font-size:17px;font-weight:500;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.tstrip .v em{font-size:11px;font-weight:400;color:var(--graphite);font-style:normal;margin-left:2px}
.tstrip .n{font-size:10px;color:var(--dove);margin-top:3px;line-height:1.35;text-wrap:pretty}
.tstrip .cell.real .k,.tstrip .cell.real .n{color:var(--rust);opacity:.75}

/* ════════════════════════════════════════════════════════════════
   上划卡（并购房版）· 一句现场 + 双层时间 + 一句坑 + 一句怎么避免
   ════════════════════════════════════════════════════════════════ */
.swipe{
  margin-top:14px;background:var(--pure-white);border-radius:26px;box-shadow:var(--shadow-sm);
  padding:17px 16px 14px;animation:arrive .34s cubic-bezier(.22,1,.36,1);
}
.sw-day{font-size:12px;color:var(--graphite);font-variant-numeric:tabular-nums}
.sw-hd{font-size:22px;font-weight:500;letter-spacing:-.015em;color:var(--ink);margin-top:5px;line-height:1.2}
.sw-one{font-size:14.5px;color:var(--ash);line-height:1.62;margin-top:9px;text-wrap:pretty}
.sw-hint{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:14px;font-size:11.5px;color:var(--dove)}
.sw-hint i{font-style:normal;font-size:15px;animation:upse 1.5s ease-in-out infinite}
@keyframes upse{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-5px);opacity:1}}

/* ── 坑 / 怎么避免（每屏一块，本稿的核心减量单元） ── */
.pit{margin-top:12px;border-radius:15px;padding:11px 13px;background:var(--apricot-wash);color:var(--rust)}
.pit-k{font-size:10.5px;font-weight:500;opacity:.8;letter-spacing:.02em}
.pit-t{font-size:13px;line-height:1.6;margin-top:3px;text-wrap:pretty}
.pit-f{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(93,42,26,.16);font-size:12.5px;line-height:1.55;color:var(--ash);text-wrap:pretty}
.pit-f b{flex:none;color:var(--ink);font-weight:500}
.pit.sky{background:var(--sky-wash);color:var(--sky-ink)}
.pit.sky .pit-f{border-top-color:rgba(42,92,160,.18)}

/* ── 进度与状态胶囊 ── */
.prog{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--graphite)}
.prog-bar{flex:1;height:6px;border-radius:999px;background:var(--fog);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .4s cubic-bezier(.22,1,.36,1)}
.prog-v{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:500}
.pill-todo{background:var(--apricot-wash);color:var(--rust)}
.pill-do{background:var(--ink);color:#fff}
.pill-no{background:var(--fog);color:var(--graphite);border:1px solid var(--dove)}
.pill-warn{background:var(--sky-wash);color:var(--sky-ink)}

/* ── 选项按钮 / 档位卡 ── */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:block;width:100%;text-align:left;background:var(--pure-white);
  border:1px solid var(--hairline);border-radius:20px;padding:13px 15px;
  font-family:inherit;color:inherit;cursor:pointer;transition:border-color .16s,box-shadow .16s;
}
.opt:active{transform:scale(.99)}
.opt.on{border:2px solid var(--ink);box-shadow:var(--shadow-sm);padding:12px 14px}
.op-hd{display:flex;align-items:center;gap:8px}
.op-n{font-size:14px;font-weight:500;color:var(--ink)}
.op-tag{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:500;background:var(--fog);color:var(--ash)}
.op-tag.hot{background:var(--apricot-wash);color:var(--rust)}
.op-tag.cool{background:var(--sky-wash);color:var(--sky-ink)}
.op-p{margin-left:auto;font-size:15px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.op-d{font-size:12px;color:var(--graphite);margin-top:4px;line-height:1.5;text-wrap:pretty}
.op-note{font-size:11px;color:var(--dove);margin-top:5px;line-height:1.5}
.op-note.risk{color:var(--danger)}

/* ── 现金档 / 环线选择 ── */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{
  min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--hairline);
  background:var(--pure-white);font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;
}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.chips-2{gap:10px}
.chips-2 .chip{flex:1}

/* ── 表单（自定义房源） ── */
.form{margin-top:14px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:4px 16px}
.f-row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--hairline-soft)}
.f-row:last-child{border-bottom:0}
.f-k{flex:none;width:82px;font-size:13px;color:var(--graphite)}
.f-in{flex:1;border:0;outline:0;font-family:inherit;font-size:14px;color:var(--ink);background:transparent;text-align:right}
.f-in::placeholder{color:var(--dove)}

/* ── 房源卡 ─ */
.hcard{
  display:flex;gap:11px;align-items:center;width:100%;text-align:left;
  background:var(--pure-white);border:1px solid var(--hairline);border-radius:20px;
  padding:12px 14px;margin-top:10px;font-family:inherit;color:inherit;cursor:pointer;
}
.hcard.on{border:2px solid var(--ink);padding:11px 13px}
.hc-emo{flex:none;width:40px;height:40px;border-radius:13px;background:var(--fog);display:grid;place-items:center;font-size:19px}
.hc-b{flex:1;min-width:0}
.hc-n{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--ink)}
.hc-m{display:block;font-size:11.5px;color:var(--graphite);margin-top:3px;line-height:1.5;text-wrap:pretty}
.hc-p{flex:none;text-align:right}
.hc-v{font-size:15px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.hc-x{font-size:10.5px;color:var(--dove);margin-top:3px;font-variant-numeric:tabular-nums}

/* ─ 账单行 ─ */
.rows{margin-top:14px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:4px 16px}
.row{display:flex;align-items:baseline;gap:10px;min-height:44px;padding:9px 0;border-bottom:1px solid var(--hairline-soft)}
.row:last-child{border-bottom:0}
.row .k{flex:1;font-size:12.5px;color:var(--ash);line-height:1.5}
.row .v{font-size:13px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.total .k{color:var(--ink);font-weight:500}
.row.total .v{font-size:15px;color:var(--rust)}

/* ── 对话气泡 ── */
.chat{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.bubble{background:var(--pure-white);border-radius:18px 18px 18px 6px;box-shadow:var(--shadow-sm);padding:11px 14px}
.who{font-size:10.5px;color:var(--dove);margin-bottom:4px}
.bubble p{margin:0;font-size:13px;color:var(--ink);line-height:1.6;text-wrap:pretty}

/* ── 清单（深坑 · 与装修稿合同清单同一套骨架） ── */
.cl-sec{margin-top:18px}
.cl-sec-h{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.cl-sec-t{font-size:13px;font-weight:500;color:var(--ink)}
.cl-sec-x{font-size:11px;color:var(--dove);font-variant-numeric:tabular-nums;margin-left:auto}
.cl-row{padding:12px 0;border-bottom:1px solid var(--hairline-soft)}
.cl-row:last-child{border-bottom:0}
.cl-top{display:flex;align-items:center;gap:7px}
.cl-n{font-size:13.5px;font-weight:500;color:var(--ink)}
.cl-why{font-size:11.5px;color:var(--graphite);line-height:1.6;margin-top:4px;text-wrap:pretty}
.cl-write{font-size:11.5px;color:var(--ash);line-height:1.6;margin-top:5px;background:var(--fog);border-radius:10px;padding:7px 10px;text-wrap:pretty}
.cl-write b{color:var(--ink);font-weight:500}
.cl-acts{display:flex;gap:7px;margin-top:9px}
.cl-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;
  border-radius:999px;border:1px solid var(--hairline);background:var(--pure-white);
  font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer;transition:all .15s;padding:0 10px;
}
.cl-btn:active{transform:scale(.98)}
.cl-btn.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.cl-btn.on-no{background:var(--fog);border-color:var(--dove);color:var(--ink);font-weight:500}
.cl-say{margin-top:12px;font-size:12.5px;line-height:1.65;border-radius:14px;padding:10px 14px;text-wrap:pretty}
.cl-say.warn{background:var(--apricot-wash);color:var(--rust);border:1px solid #e8b79b}
.cl-say.calm{background:var(--fog);color:var(--ash)}
.cl-quick{margin-top:7px;font-size:11px;color:var(--graphite);line-height:1.55;text-wrap:pretty}

/* ── 学费单（合同没写清 / 谈价没谈清的账目化） ── */
.burst{
  margin-top:14px;background:var(--apricot-wash);border:2px solid var(--danger);
  border-radius:20px;padding:14px 16px;animation:burstIn .5s cubic-bezier(.22,1,.36,1);
}
@keyframes burstIn{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
.burst-t{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--danger)}
.burst-src{font-size:10.5px;font-weight:500;color:var(--rust);background:rgba(255,255,255,.6);border-radius:8px;padding:2px 7px;margin-left:auto}
.adj{margin-top:9px;background:rgba(255,255,255,.78);border:1px dashed var(--danger);border-radius:14px;padding:10px 12px}
.adj-line{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink);padding:3px 0;font-variant-numeric:tabular-nums}
.adj-line span:last-child{font-weight:500;white-space:nowrap}
.adj-sum{display:flex;justify-content:space-between;gap:10px;margin-top:5px;padding-top:6px;border-top:1px solid rgba(183,65,14,.28);font-size:12.5px;color:var(--danger);font-weight:600;font-variant-numeric:tabular-nums}
.adj-hint{margin-top:6px;font-size:11px;color:var(--rust);line-height:1.55;text-wrap:pretty}

/* ════════════════════════════════════════════════════════════════
   完成总账 · 钱条 / 时间条 / 长图 / 学费清单
   ════════════════════════════════════════════════════════════════ */
.pricebar{margin-top:14px;background:var(--ink);color:#fff;border-radius:20px;padding:13px 16px}
.pricebar .pb-k{font-size:11px;opacity:.66}
.pricebar .pb-v{font-size:23px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.015em;margin-top:2px}
.pricebar .pb-n{font-size:11.5px;opacity:.8;margin-top:5px;line-height:1.5}
.pricebar .pb-n b{color:#fff;font-weight:600}
.pricebar.bad{background:var(--danger)}
.pricebar.ok{background:var(--ok)}
/* 时间条：黑 = 已经走出来的经历天数，暖色 = 到 90 天刻度的余量。
   工期卡固定黑底不转橙，避免与钱条叠成两张大橙卡 */
.t-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.18);margin-top:9px}
.t-bar i{display:block;height:100%}
.t-base{background:rgba(255,255,255,.92)}
.t-over{background:var(--apricot-wash)}
.gantt{display:flex;gap:2px;align-items:flex-end;height:38px;margin-top:10px}
.gantt i{display:block;border-radius:3px 3px 0 0;background:var(--ink);opacity:.82;flex:1}
.gantt i.hot{background:var(--danger);opacity:1}
.gantt-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dove);margin-top:4px;font-variant-numeric:tabular-nums}
.lrn{margin-top:12px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:14px 16px}
.lrn-row{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--hairline-soft)}
.lrn-row:last-child{border-bottom:0}
.lrn-l{flex:1;min-width:0;font-size:12px;color:var(--ash);line-height:1.6;text-wrap:pretty}
.lrn-l b{color:var(--ink);font-weight:500}
.lrn-r{flex:none;width:86px;text-align:right;font-size:12.5px;font-weight:600;color:var(--danger);font-variant-numeric:tabular-nums}

/* ════════════════════════════════════════════════════════════════
   等待屏（审批 / 过户 / 交房）· 这一段在等谁、为什么等这么久
   ════════════════════════════════════════════════════════════════ */
.wait{margin-top:14px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:14px 15px}
.wait-t{font-size:12.5px;font-weight:500;color:var(--ink)}
.wait-t em{font-style:normal;color:var(--rust)}
.wait-rail{display:flex;margin-top:13px}
.wait-n{flex:1;position:relative;text-align:center}
.wait-n i{display:block;width:8px;height:8px;border-radius:50%;background:var(--hairline);margin:0 auto 6px;position:relative;z-index:2}
.wait-n span{display:block;font-size:10px;color:var(--dove);line-height:1.3}
.wait-n::before,.wait-n::after{content:"";position:absolute;top:3.5px;height:2px;background:var(--hairline)}
.wait-n::before{left:0;right:50%}
.wait-n::after{left:50%;right:0}
.wait-n:first-child::before,.wait-n:last-child::after{display:none}
.wait-n.done i,.wait-n.done::before,.wait-n.done::after{background:var(--ink)}
.wait-n.on i{background:var(--rust);box-shadow:0 0 0 3px var(--apricot-wash)}
.wait-n.on::before{background:var(--ink)}
.wait-n.on span{color:var(--ink);font-weight:500}
.wait-x{display:flex;gap:6px;font-size:11.5px;color:var(--ash);line-height:1.6;margin-top:9px;text-wrap:pretty}
.wait-x b{flex:none;color:var(--ink);font-weight:500}

/* ════════════════════════════════════════════════════════════════
   付款确认弹窗（五个出款点）· 现金三段 + 违约警示 + 下一节点与它的常规周期
   ═══════════════════════════════════════════════════════════════ */
.m-mask{position:absolute;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(23,25,28,.42)}
.m-mask.on{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.m-card{width:100%;background:var(--pure-white);border-radius:26px 26px 0 0;padding:20px 18px 18px;animation:rise .26s cubic-bezier(.22,1,.36,1)}
.m-k{font-size:11px;color:var(--dove);letter-spacing:.04em}
.m-t{font-size:19px;font-weight:500;color:var(--ink);margin-top:3px}
/* 现金三段：现有 → 本次支付 → 支付后剩余 */
.m-amt{display:flex;align-items:flex-end;gap:7px;margin-top:14px;background:var(--fog);border-radius:16px;padding:11px 13px}
.m-amt>div{flex:1;min-width:0}
.m-amt span{display:block;font-size:10.5px;color:var(--graphite)}
.m-amt b{display:block;font-size:15px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.015em}
.m-amt b.pay{color:var(--rust)}
.m-amt i{font-style:normal;font-size:12px;color:var(--dove);line-height:1.9}
.m-note{margin-top:11px;font-size:12px;color:var(--ash);line-height:1.6;text-wrap:pretty}
.m-warn{margin-top:9px;font-size:12px;color:var(--danger);background:var(--apricot-wash);border-radius:12px;padding:9px 12px;line-height:1.6;text-wrap:pretty}
/* 下一节点：出款这一下同时告诉用户「接下来做什么、要等多久、等谁」 */
.m-next{margin-top:12px;background:var(--apricot-wash);border-radius:16px;padding:11px 13px}
.m-next-row{display:flex;align-items:baseline;gap:7px}
.m-next-k{flex:none;font-size:10.5px;color:var(--rust);opacity:.8}
.m-next-row b{font-size:14px;font-weight:500;color:var(--ink)}
.m-next-d{margin-left:auto;font-size:12px;font-weight:500;color:var(--rust);font-variant-numeric:tabular-nums;white-space:nowrap}
.m-next-w{margin-top:5px;font-size:11.5px;color:var(--rust);opacity:.85;line-height:1.5;text-wrap:pretty}
.m-btns{display:flex;gap:10px;margin-top:16px}

/* ── 按钮 / CTA ── */
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;
  min-height:48px;padding:0 18px;border-radius:999px;border:0;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:500;transition:transform .16s,opacity .16s;
}
.btn:active{transform:scale(.98)}
.btn-ink{background:var(--ink);color:#fff}
.btn-out{background:transparent;color:var(--ink);border:1px solid var(--dove)}
.btn-disabled{background:var(--fog);color:var(--dove);cursor:default}
/* 主按钮上的等待承诺：按下之前就知道这一步要等多久 */
.btn-w{font-size:11px;font-weight:400;opacity:.72;margin-left:7px}

/* 折叠区（评审用；小程序需自实现） */
.cal-fold{margin-top:12px;border:1px solid var(--hairline);border-radius:16px;overflow:hidden;background:var(--pure-white)}
.cal-fold>summary{padding:11px 14px;min-height:44px;font-size:12.5px;color:var(--graphite);cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px}
.cal-fold>summary::-webkit-details-marker{display:none}
.cal-fold>summary::after{content:"▾";margin-left:auto;color:var(--dove)}
.cal-fold[open]>summary::after{content:"▴"}
.cal-body{padding:0 12px 12px}
.cal-note{margin-top:8px;font-size:12px;color:var(--ash);line-height:1.6;background:var(--fog);border-radius:14px;padding:10px 13px;text-wrap:pretty}
.cal-note b{color:var(--ink);font-weight:600}

/* ═══════════════════════════════════════════════════════════════
   开场三卡（对应三个目标）
   ════════════════════════════════════════════════════════════════ */
.g3{display:flex;gap:9px;margin-top:14px}
.g3-cell{flex:1;background:var(--pure-white);border-radius:18px;box-shadow:var(--shadow-sm);padding:12px 11px}
.g3-k{font-size:10.5px;color:var(--dove);letter-spacing:.02em}
.g3-v{font-size:15px;font-weight:500;color:var(--ink);margin-top:4px;line-height:1.3;letter-spacing:-.015em}
.g3-n{font-size:10.5px;color:var(--graphite);margin-top:4px;line-height:1.45}
.trail{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.trail span{font-size:10.5px;color:var(--graphite);background:var(--pure-white);border-radius:8px;padding:4px 8px;box-shadow:var(--shadow-sm)}
.trail span.hot{background:var(--ink);color:#fff}

/* ════════════════════════════════════════════════════════════════
   评审工具条（不属于设计稿，评审用；可折叠）
   ════════════════════════════════════════════════════════════════ */
.rv{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-family:var(--font)}
.rv-toggle{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border:0;cursor:pointer;
  background:var(--pure-white);color:var(--ink);border-radius:999px;box-shadow:var(--shadow-md);

/* ── 经历周期：每段从自己的「常规周期」区间随机取一个天数（同一次运行内固定，重开重抽） ──
   par 段（同期发生）照常取数、照常展示「这段花了多久」，但不累加进「已走 N 天」 */
function stageDays(f) {
  if (S.drawn[f.k] === undefined) S.drawn[f.k] = f.days[0] + Math.floor(Math.random() * (f.days[1] - f.days[0] + 1));
  return S.drawn[f.k];
}
/* 已走天数 = 今天 + 走过的各段（不含同期段）之和；只随走过哪些屏变化，不随重绘变化 */
function expDays() {
  let d = 1;
  S.walked.forEach(k => {
    const f = defOf(k);
    if (f && f.days && !f.par) d += stageDays(f);
  });
  return d;
}

  const y = S.loanYears, r = loanRate() / 12, n = y * 12;
  if (!P || !n) return 0;
  return P * 10000 * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
}
const RISK_INCOME = 40000;   /* 演示：家庭月收入 4 万，风控线 = 月供 ≤ 50% */
const OVER_RISK = () => monthlyOf() / RISK_INCOME > 0.5;
/* 追加首付到多少才能过风控线：取第一档达标值，最高全款（全款必然达标） */
function minDownToClear() {
  const floor = downRate();
  for (const c of [0.3, 0.5, 0.7, 1]) {
    const d = Math.max(c, floor);
    if (monthlyOf(d) / RISK_INCOME <= 0.5) return d;
  }
  return 1;
}
function money() {
  const h = houseOf();
  const lessons = S.lessons.reduce((a, b) => a + b.cost, 0);
  if (!h || !S.deal) return { deal: 0, down: 0, downCash: 0, shortfall: 0, deedTax: 0, agentFee: 0, reg: 0, sellerTax: 0, need: 0, base: 0, total: lessons };
  const downPay = S.deal * down();
  const shortfall = Math.max(0, S.deal - downPay - loanPrincipal());  /* 额度不够、必须现金补的房款 */
  const downCash = downPay + shortfall;                               /* 定金 + 先付 + 补足 三段之和 */
  const deedTax = S.deal * deedRateOf(h);
  const agentFee = S.deal * S.agent;
  const reg = 0.008;                       /* 不动产登记费 80 元 */
  const sellerTax = S.netDeal ? sellerTaxOf() : 0;
  const base = downCash + deedTax + reg + agentFee;   /* 不谈「到手价」时该掏的钱 */
  const need = base + sellerTax;
  return { deal: S.deal, down: downPay, downCash: downCash, shortfall: shortfall,
    deedTax: deedTax, agentFee: agentFee, reg: reg, sellerTax: sellerTax,
    need: need, base: base, total: need + lessons };
}
/* 已付出的钱（钱条白段 / 弹窗「现有现金」）：口径 = 进入当前屏之前已经出过的款，
   所以每一屏都按「上一屏完成的那一笔」记，弹窗里的本次支付不会被重复扣一次 */
function paid() {
  const m = money();
  if (!m.need) return 0;
  const i = idxOf(S.screen);
  if (i < idxOf('signNet')) return 0;                                 /* 定金还没付 */
  if (i < idxOf('loan')) return m.deal * 0.05;                        /* 已付定金 */
  if (i < idxOf('transfer')) return m.deal * 0.05 + m.deal * down() * 0.3; /* 已付定金 + 首付先付 */
  if (i < idxOf('handover')) return m.downCash;                       /* 已付清房款现金部分 */
  return m.need;                                                      /* 过户缴税后 */
}
/* 筹钱：三条渠道各有上限，已筹只补到缺口为止（0 缺口时不多借） */
const BORROW_CAPS = { family: 30, gjj: 20, credit: 20 };
const BORROW_CAP = BORROW_CAPS.family + BORROW_CAPS.gjj + BORROW_CAPS.credit;   /* 演示上限 70 万 */
function borrowTotal() {
  const raw = Math.max(0, money().need - S.cash);
  let t = 0;
  Object.keys(BORROW_CAPS).forEach(k => { if (S.usedBorrow[k]) t += BORROW_CAPS[k]; });
  return Math.min(t, raw);
}
/* 可动用现金 = 手头 + 已筹 */
function avail() { return S.cash + borrowTotal(); }
function gap() { const m = money(); return Math.max(0, m.need - avail()); }
/* 踩坑额外拖出来的天 + 这趟实际走过的天（含坑）：状态带、时间条、总账共用同一口径 */
function pitDays() { return S.lessons.reduce((a, b) => a + b.days, 0); }
function elapsed() { return expDays() + pitDays(); }

/* ═══════════════════════════════════════════════════════════════
   付款确认弹窗 · 五个出款点（kind 名沿用实现的 payModal：定金 / 网签首付先付 /
   补足剩余首付 / 缴税（实现里叫 transfer，发生在领证屏）/ 扣押尾款）
   弹窗 = 现有现金 → 本次支付 → 支付后剩余 + 口径说明 + 违约警示
   ＋「下一节点：名称 · 常规周期 X-Y 天 · 等谁」——出款这一下同时让用户感知
   这笔钱锁住了什么、以及接下来等多久、等谁。金额口径与对应屏的账完全一致。
   ═══════════════════════════════════════════════════════════════ */
const PAY_KINDS = {

  },

    note: '网签同步把首付先付部分打进资金监管，随即送银行审批；剩余首付等贷款合同确认后补足。',
    warn: () => '网签合同已生效：此刻反悔或迟延履行，按房价 20% 赔违约金，约 ' + wan(S.deal * 0.2) + ' 万。',
  },
  restPay: {
    next: 'transfer', title: '补足剩余首付 · 贷款合同',
    note: '剩余首付入资金监管；过户领证后由监管账户划转卖方，而不是直接打给对方。',
    warn: () => '网签合同已生效：此刻反悔或迟延履行，按房价 20% 赔违约金，约 ' + wan(S.deal * 0.2) + ' 万。',
  },
  transfer: {
    next: 'handover', title: '过户 · 缴税',
    note: '契税、登记费、中介费一次性缴清，缴完即可领新产证；产证拍照发银行才会放款。',
  },
  holdback: {
    next: null, title: '尾款 · 交割结算', noCash: true,
    note: '这笔钱从卖方应得的房款里扣留，不占用你的现金；户口迁出、费用结清后再划给卖方——它是你手里最后一张牌。',
  },
};
/* 本次支付金额：与 sign / signNet / loanContract / deed / settle 五屏的账同口径 */
function payAmount(kind) {
  const m = money();
  if (kind === 'deposit') return m.deal * 0.05;
  if (kind === 'firstPay') return m.deal * down() * 0.3;
  if (kind === 'restPay') return Math.max(0, m.downCash - m.deal * 0.05 - m.deal * down() * 0.3);
  if (kind === 'transfer') return m.deedTax + m.agentFee + 0.008 + m.sellerTax;
  return m.deal * 0.01;                                    /* holdback：扣押尾款（从卖方房款中扣） */
}
function renderModal() {
  const el = document.getElementById('modal');
  if (!el) return;
  const p = S.modal ? PAY_KINDS[S.modal] : null;
  if (!p) { el.className = 'm-mask'; el.innerHTML = ''; return; }
  const amt = payAmount(S.modal), now = avail() - paid();   /* 现有现金 = 可动用现金 − 之前已付 */
  const nx = p.next ? defOf(p.next) : null;
  el.className = 'm-mask on';
  el.innerHTML = `<div class="m-card">

        <div class="m-next-w">${nx.waitWho}：${nx.waitWhy}</div>`
      : `<div class="m-next-row"><span class="m-next-k">下一节点</span><b>装修</b><span class="m-next-d">交房后即可开工</span></div>

/* ─ 埋雷与爆雷：签约清单里「不写」的项，到对应阶段结算 ─ */
function mineList() {
  /* 「先不写」与「没提」是同一件事：没写进合同就会埋雷 */
  return SIGN_ITEMS.filter(it => S.con[it.k] !== 'do')
    .map(it => ({ it: it, o: it.omit, explicit: S.con[it.k] === 'no' }));
}
function settleMines(screenKey) {
  S.burst = [];
  mineList().forEach(m => {
    if (m.o.at !== screenKey) return;
    if (S.lessons.some(l => l.k === m.it.k)) return;
    const src = m.explicit
      ? '签约清单「' + m.it.name + '」你写的是「先不写」'
      : '签约清单「' + m.it.name + '」你没提';
    S.lessons.push({ k: m.it.k, short: m.it.name, stage: defOf(screenKey) ? defOf(screenKey).name : '', cost: m.o.cost, days: m.o.days, risk: m.o.risk, text: m.o.text, src: src, fix: m.o.fix });
    S.burst.push({ name: m.it.name, cost: m.o.cost, days: m.o.days, risk: m.o.risk, text: m.o.text, fix: m.o.fix });
  });
  if (S.burst.length) S.stress = Math.min(100, S.stress + 22);
}

/* ── 屏幕推进 ── */
function advance() {
  const i = idxOf(S.screen);
  if (i < 0 || i >= FLOW.length - 1) return;
  go(FLOW[i + 1].k);
}
/* 跳转兜底：直接跳到中后段屏时，补齐它依赖的前置状态（评审跳转用） */
function ensureData(k) {
  const i = idxOf(k);
  if (i > idxOf('role') && !S.role) S.role = ROLES[0];
  /* 「自定义房源」屏不补房源：它本来就是「不选预设」的去处，静默塞一套 F 会让用户莫名其妙背上一套 550 万的房子 */
  if (i > idxOf('select') && k !== 'custom' && !S.house && !S.custom) S.house = HOUSES[5];
  if (i >= idxOf('blocked') && !S.ans.hukou) { S.ans = { hukou: 'sh' }; S.qaProg = 1; }
  if (!S.deal && i >= idxOf('nego3')) { S.slash = houseOf().cut; S.deal = houseOf().price * (1 - S.slash); }
}
function go(k) {
  const d = defOf(k);
  if (!d) return;
  ensureData(k);
  S.screen = k;
  if (S.walked.indexOf(k) < 0) S.walked.push(k);   /* 走过的段才计入已走天数（跳转也不会重复累加） */
  settleMines(k);                                  /* 先结算本屏埋的雷，天数才是含坑的总量 */
  S.day = elapsed();
  render();
}
/* 退回选房：清掉上一套房的成交状态，否则状态带还挂着上一套的「需现金」 */
function toSelect() {
  S.deal = 0; S.slash = 0; S.negoR1 = null; S.negoCap = false;
  S.netDeal = false; S.usedBorrow = {}; S.loanRejected = false;
  go('select');
}

/* 多花的钱 = 签约清单没写清的 N 笔 + 谈价时答应的「到手价」（状态带与总账共用一套口径） */
function lossRows() {
  const m = money();
  const rows = S.lessons.slice();
  if (S.netDeal && m.sellerTax > 0) {
    rows.unshift({
      k: 'netprice', short: '「到手价」', src: '砍价时你答应的「到手价」', cost: m.sellerTax, days: 0,
      text: '卖方增值税 + 附加 + 个税整体转嫁给你，签约时这一句就锁定了。',
      fix: '谈价先问一句「含税还是到手」，再落价。',
    });
  }
  return rows;
}

        <span class="gm-v">已走 ${S.day}<em> 天${pitDays() ? '（含坑拖出 ' + pitDays() + ' 天）' : ''} / 常规 1-3 个月</em></span></div>
    </div>
    ${lessons ? `<div class="gm" style="margin-top:1px"><span class="gm-k"></span><span style="font-size:11px;color:var(--danger)">多花 ${rows.length} 笔 · ¥${wan(lessons)} 万（合同没写清 / 谈价没谈清的账）</span></div>` : ''}`;

/* 限购判定 · 口径 = 上海自 2026-02-26 起施行的限购政策
   沪籍家庭（含成年单身）：外环外不限套数；外环内限购 2 套
   非沪籍：社保 / 个税满 1 年 → 外环外不限套数、外环内限购 1 套；满 3 年及以上 → 外环内限购 2 套
   持《上海市居住证》满 5 年：免社保 / 个税证明，全市限购 1 套 */
function judge() {
  const h = houseOf();
  const inner = !!(h && h.ring === '内');      /* 外环外：符合购房条件即不限套数 */
  const owned = ownedCount();
  const a = S.ans;
  const mine = (S.role && S.role.k === 'trade')
    ? '置换：原房已售，名下 0 套'
    : '你名下 ' + owned + ' 套';
  if (a.hukou === 'sh') {
    if (!inner) return { ok: true, t: '可购买（外环外）', d: '沪籍（含成年单身）在外环外购房不限套数；' + mine + '。' };
    return owned < 2
      ? { ok: true, t: '可购买', d: '沪籍外环内限购 2 套；' + mine + '。' }
      : { ok: false, t: '限购 · 不符合条件', d: '沪籍外环内限购 2 套，名下已满 2 套。' };
  }
  if (a.permit === 'yes') {
    return owned === 0
      ? { ok: true, t: '可购买 1 套', d: '持居住证满 5 年：免社保或个税证明，全市限购 1 套；' + mine + '。' }
      : { ok: false, t: '限购 · 不符合条件', d: '持居住证满 5 年全市限购 1 套，名下已有住房。' };
  }
  if (a.years === 'l1') return { ok: false, t: '暂不具备购房资格', d: '社保 / 个税不满 1 年：外环内、外环外都还不能买。' };
  if (a.years === 'm1-3') {
    if (!inner) return { ok: true, t: '可购买（外环外）', d: '非沪籍社保满 1 年：外环外不限套数。' };
    return owned === 0
      ? { ok: true, t: '可购买 1 套', d: '非沪籍社保满 1 年：外环内限购 1 套；' + mine + '。' }
      : { ok: false, t: '限购 · 不符合条件', d: '非沪籍社保满 1 年：外环内限购 1 套，名下已有住房。' };
  }
  if (!inner) return { ok: true, t: '可购买（外环外）', d: '非沪籍社保满 3 年：外环外不限套数。' };
  return owned < 2
    ? { ok: true, t: '可购买', d: '非沪籍社保满 3 年：外环内限购 2 套（原有 1 套 + 增购 1 套）；' + mine + '。' }
    : { ok: false, t: '限购 · 不符合条件', d: '非沪籍社保满 3 年：外环内限购 2 套，名下已满。' };
}

function downRateOf(lt) {
  const inv = S.role && S.role.k === 'invest';
  const inner = houseOf() && houseOf().ring === '内';
  if (!inv) return lt === 'comm' ? 0.15 : 0.2;
  if (inner) return 0.25;
  return lt === 'comm' ? 0.15 : 0.2;
}

/* ═════════════════ 主渲染 ══════════════════ */
function viewKey() { return S.screen + '|' + idxOf(S.screen); }
function doRender() {
  const stageEl = document.getElementById('stage');
  const key = viewKey(), changed = key !== VIEW_KEY;
  const keep = changed ? 0 : stageEl.scrollTop;
  VIEW_KEY = key;
  renderGuard();
  const sc = document.getElementById('sc');
  const d = defOf(S.screen) || FLOW[0];
  sc.innerHTML = screenOf(d);
  stageEl.scrollTop = keep;
  renderJump();
  renderModal();            /* 换屏时若有弹窗残留（如跳转），一并清掉 */
  if (S.burst.length) {
    ['barMoney', 'barTime'].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 950); }
    });
  }
}
/* 屏 → 视图函数（按 k 分发，避免一长串三元） */
function screenOf(d) {
  const byKey = {
    start: screenHero, role: screenRole, cash: screenCash, select: screenSelect, custom: screenCustom,
    qa: screenQa, blocked: screenBlocked, nego1: screenNego1, nego2: screenNego2, nego3: screenNego3,
    feeNego: screenFeeNego, loanType: screenLoanType, funds: screenFunds, borrow: screenBorrow,
    sign: screenSign, signNet: screenSignNet, loan: screenLoan, loanChk: screenLoanChk,
    loanContract: screenLoanContract, transfer: screenCard, deed: screenCard,
    handover: screenHandover, settle: screenSettle, final: screenDone,
  };
  const fn = byKey[d.k] || screenHero;
  return fn(d);
}
function render() { if (SILENT) return; doRender(); }
function renderJump() {
  const el = document.getElementById('rvJump');
  if (!el) return;
  el.innerHTML = FLOW.map(f => `<button data-jump="${f.k}" class="${f.k === S.screen ? 'on' : ''}">${f.lbl.slice(3)}</button>`).join('');
}

/* ══════════════════ 上划 ══════════════════ */
let lastSwipe = 0;
function trySwipe() {
  if (!FAST_ON) return;
  const d = defOf(S.screen);
  if (!d || d.type !== 'card') return;          /* 决策屏不跳过 */
  const stEl = document.getElementById('stage');
  if (stEl.scrollTop + stEl.clientHeight < stEl.scrollHeight - 16) return;
  const now = Date.now();
  if (now - lastSwipe < 420) return;
  lastSwipe = now;
  advance();
}
function bindSwipe() {
  const stEl = document.getElementById('stage');
  let y0 = null;
  stEl.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  stEl.addEventListener('touchend', e => {
    if (y0 == null) return;
    if (y0 - e.changedTouches[0].clientY > 46) trySwipe();
    y0 = null;
  }, { passive: true });
  /* wheel 只是评审稿桌面预览用；小程序没有滚轮，移植时删掉这条 */
  stEl.addEventListener('wheel', e => { if (e.deltaY > 22) trySwipe(); }, { passive: true });
}

/* ══════════════════ 事件 ══════════════════ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-role],[data-cash],[data-house],[data-ring],[data-cy],[data-cu],[data-ca],[data-qa],[data-n1],[data-n2],[data-net],[data-fee],[data-lt],[data-ds],[data-bor],[data-ly],[data-lc],[data-cl],[data-ho],[data-pay],[data-act],[data-jump],[data-demo]');
  if (!t) return;
  const D = t.dataset;

  /* 出款点：先弹出付款确认（含下一节点与常规周期），确认后才真的继续 */
  if (D.pay) { S.modal = D.pay; renderModal(); return; }

  if (D.role) { S.role = ROLES.find(r => r.k === D.role); render(); return; }
  if (D.cash) { S.cash = +D.cash; S.cashSet = true; S.usedBorrow = {}; render(); return; }
  if (D.house) { S.house = HOUSES.find(h => h.id === D.house); S.custom = null; S.loanRejected = false; render(); return; }
  /* 自定义房源：环线 / 持有年限 / 是否唯一 / 取得方式 四组口径，点一下即定稿（税费随之重算） */
  if (D.ring || D.cy !== undefined || D.cu !== undefined || D.ca) {
    const patch = D.ring ? { ring: D.ring }
      : D.cy !== undefined ? { holdYears: +D.cy }
        : D.cu !== undefined ? { unique: D.cu === '1' } : { acq: D.ca };
    S.custom = syncCustom(Object.assign(custDraft(true), patch));
    S.house = null;
    render(); return;
  }
  if (D.qa) { const p = D.qa.split(':'); S.ans[p[0]] = p[1]; S.qaProg++; if (S.qaProg >= qaSteps().length) { S.qaDone = true; next('blocked'); } else render(); return; }
  if (D.n1) {
    S.negoR1 = D.n1;
    const o = NEGO_R1.find(x => x.k === D.n1);
    S.negoCap = o.chip > houseOf().cut;
    S.slash = Math.min(houseOf().cut, o.chip);
    /* 越线被叫停时立刻定成交价（= 房东底线价）：nego2 的叫停屏要显示这个数，
       否则 S.deal 还是 0，会渲染成「最多让到 0 万 / 接受底价 0 万」 */
    S.deal = houseOf().price * (1 - S.slash);
    next('nego2'); return;      /* 出价即行动，一屏只做一次决定 */
  }
  if (D.n2) {
    const p = D.n2.split(':');
    S.negoCap = p[2] === '1';
    S.slash = S.negoCap ? houseOf().cut : +p[1];
    S.deal = houseOf().price * (1 - S.slash);
    if (S.negoCap) { render(); return; }
    next('nego3'); return;
  }
  if (D.net) {
    if (D.net === 'yes') { S.netDeal = true; S.deal = houseOf().price * (1 - S.slash); next('feeNego'); return; }
    if (D.net === 'no') { S.netDeal = false; S.deal = houseOf().price * (1 - S.slash); next('feeNego'); return; }
    next('feeNego'); return;          /* ask：先问清，默认按含税价进下一步 */
  }
  if (D.fee) { S.agent = +D.fee; next('loanType'); return; }
  if (D.lt) { S.loanType = D.lt; S.loanRejected = false; render(); return; }
  if (D.ds !== undefined) { S.downSel = +D.ds; S.loanRejected = false; render(); return; }
  /* 筹钱：三条渠道各有上限，已筹按缺口动态算——点第二次取消该渠道 */
  if (D.bor) {
    if (D.bor === 'changeHouse') { toSelect(); return; }
    if (S.usedBorrow[D.bor]) delete S.usedBorrow[D.bor]; else S.usedBorrow[D.bor] = true;
    render(); return;
  }
  if (D.ly) { S.loanYears = +D.ly; S.loanRejected = false; render(); return; }
  if (D.lc) {
    if (D.lc === 'change') { toSelect(); return; }
    if (D.lc === 'pay') {
      /* 追加首付按「真正能过风控线的首付档」提，并提出后必须重新校验现金是否够 */
      S.downSel = minDownToClear();
      S.loanRejected = false;
      if (gap() > 0) { next('funds'); return; }
      next('loanContract'); return;
    }
    if (D.lc === 'long') { S.loanYears = 30; S.loanRejected = false; render(); return; }
    S.loanRejected = true; render(); return;   /* stick：银行拒批，必须回头调整 */
  }
  if (D.cl) { const p = D.cl.split(':'); S.con[p[0]] = p[1]; render(); return; }
  if (D.ho) {
    if (D.ho === 'ok') { S.hand = { util: true, hukou: true, key: true, fund: true }; S.handHold = false; }
    else { S.hand = { util: false, hukou: false, key: true, fund: true }; S.handHold = true; }
    next('settle'); return;
  }
  if (D.jump) { SILENT = true; go(D.jump); SILENT = false; render(); return; }
  if (D.demo) {
    if (D.demo === 'reset') { S = newState(); render(); return; }
    runPath(D.demo); return;
  }
  switch (D.act) {
    case 'next':
      /* 已在选房屏选定房源时直奔资格核验——自定义房源页只在主动点「自定义房源」时进入 */
      if (S.screen === 'select' && S.house) { next('qa'); break; }
      /* 全款不贷款：跳过贷款方案与审批，直接去补足尾款 */
      if (S.screen === 'loan' && S.downSel === 1) { next('loanContract'); break; }
      advance(); break;
    case 'goCustom': next('custom'); break;
    case 'backSelect': toSelect(); break;
    case 'requalify': S.ans = {}; S.qaProg = 0; S.qaDone = false; next('qa'); break;
    case 'backLoanType': next('loanType'); break;
    case 'n2Accept': S.negoCap = false; next('nego3'); break;
    case 'fundsNext': gap() > 0 ? next('borrow') : next('sign'); break;
    case 'changeHouse': toSelect(); break;
    case 'fastSign': {
      const items = SIGN_ITEMS.filter(it => it.half === (S.screen === 'sign' ? 'sign' : 'signNet'));
      items.forEach(it => { S.con[it.k] = 'no'; });
      advance(); break;
    }
    case 'payOk': {
      const kind = S.modal;
      S.modal = null;
      /* 全款付清「首付先付」后直接进补足尾款，不经过贷款审批 */
      if (kind === 'firstPay' && S.downSel === 1) { next('loanContract'); break; }
      advance(); break;
    }
    case 'payCancel': S.modal = null; renderModal(); break;
    case 'reset': S = newState(); render(); break;
    case 'toRenov': window.open('Done/2026-09-15-装修模块-高保真设计稿.html', '_blank'); break;
  }
});
/* 跳过一屏（用于交互里直接落到指定屏） */
function next(k) { go(k); }

/* 现金自定义输入：只刷新钱条与主按钮，不整屏重绘（重绘会让输入框失焦） */
document.addEventListener('input', e => {
  if (e.target.id === 'cashIn') {
    const v = +e.target.value;
    S.cashSet = v > 0;
    if (v > 0) { S.cash = v; S.usedBorrow = {}; }   /* 改了家底，之前按旧缺口筹的钱作废 */
    document.querySelectorAll('[data-cash]').forEach(c => c.classList.toggle('on', +c.dataset.cash === S.cash));
    renderGuard();
    syncNextBtn(v > 0 ? '手头 ' + S.cash + ' 万 · 去看房' : '先亮家底', !(v > 0));
    return;
  }
  /* 自定义房源：改挂牌价 / 面积 / 取得原值即定稿，并就地重算税费口径与主按钮 */
  if (e.target.id !== 'cPrice' && e.target.id !== 'cArea' && e.target.id !== 'cBase') return;
  const draft = custDraft(false);
  const ok = draft.price > 0;
  if (ok) {
    S.custom = syncCustom(draft);
    S.house = null;
    const chips = document.getElementById('custChips'), rows = document.getElementById('custTaxRows');
    if (chips) chips.innerHTML = custChipsBlock(S.custom);
    if (rows) rows.innerHTML = custTaxRows(S.custom);
    renderGuard();
  }
  syncNextBtn(ok ? '确认这套 · 去核验资格' : '填完再继续', !ok, '核验 1-3 天');
});

/* ═════════════════ 评审：三条演示路径 ══════════════════ */
function runPath(p) {
  S = newState();
  S.role = ROLES[0];
  S.cash = 200; S.cashSet = true;
  S.house = HOUSES[5];                 /* F · 中环新交付次新 · 不满 2 年 */
  S.slash = HOUSES[5].cut;
  S.deal = HOUSES[5].price * (1 - S.slash);
  S.negoR1 = 'soft';
  S.agent = 0.01;
  S.loanType = 'combo';
  S.ans = { hukou: 'sh' };
  S.qaProg = 1; S.qaDone = true;
  if (p === 'quick') { S.netDeal = true; SIGN_ITEMS.forEach(it => { S.con[it.k] = 'no'; }); }
  if (p === 'careful') { S.netDeal = false; SIGN_ITEMS.forEach(it => { S.con[it.k] = 'do'; }); }
  if (p === 'net') { S.netDeal = true; SIGN_ITEMS.forEach(it => { S.con[it.k] = 'do'; }); }
  S.hand = p === 'quick' ? { util: false, hukou: false, key: true, fund: true } : { util: true, hukou: true, key: true, fund: true };
  S.handHold = p === 'quick';
  /* 重放埋雷结算，让总账一次算完 */
  S.lessons = []; SIGN_ITEMS.forEach(it => {
    if (S.con[it.k] === 'do') return;
    S.lessons.push({ k: it.k, short: it.name, stage: defOf(it.omit.at) ? defOf(it.omit.at).name : '', cost: it.omit.cost, days: it.omit.days, risk: it.omit.risk, text: it.omit.text, src: '签约清单「' + it.name + '」你没写', fix: it.omit.fix });
  });
  S.burst = [];
  /* 演示路径 = 走完一整趟：先记下各段，总账屏的经历天数才是完整一趟的量级（而不是 1 天） */
  S.walked = FLOW.filter(f => f.days).map(f => f.k);
  go('final');
  render();
}

/* ═════════════════ 评审工具 ══════════════════ */
const rvToggle = document.getElementById('rvToggle'), rvPanel = document.getElementById('rvPanel');
rvToggle.addEventListener('click', () => { rvPanel.classList.toggle('on'); });
document.getElementById('ckFast').addEventListener('change', e => { FAST_ON = e.target.checked; });
document.getElementById('ckNote').addEventListener('change', e => { document.body.classList.toggle('notes', e.target.checked); });

bindSwipe();
S = newState();
/* 默认停在开场屏；带 hash 时跳到对应屏（评审用） */
(function () {
  const h = location.hash.replace(/^#/, '');
  if (h === 'quick' || h === 'careful' || h === 'net') { runPath(h); return; }
  if (h && defOf(h)) go(h); else render();
})();
</script>
