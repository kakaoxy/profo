<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin 工作台 · Steep 重构高保真设计稿</title>
<!--
  ============================================================
  Admin 工作台 · 按 /DESIGN.md(Steep)重构的高保真可交互设计稿
  ============================================================
  覆盖范围(核心六屏,桌面端):
    · 全局骨架 —— Fog 侧边栏(240px/无描边/白底激活)+ 分组导航 + 折叠
    · 工作台   /admin
    · 项目管理 /admin/projects
    · 线索中心 /admin/leads
    · 资金账本 /admin/ledger
    · 数据报表 /admin/reports/market
    其余导航项为占位屏(标注未含于本次迭代)。

  本次重构的关键决策(相对现状):
    1. 侧边栏:旧 Apple 毛玻璃半透明 → Steep Fog #f7f7f8 实底、
       无描边、激活项白底 12px 圆角 + 微阴影;Logo 方块改 Ink。
    2. 主色:#005daa 蓝 → Ink #17191c;Rust #5d2a1a 为唯一暖强调。
    3. 状态徽章:统一「单色洗底药丸」体系
       (Sky=待看房/签约项目、Apricot=装修/待评估、Ink 填充=在售/已签约、
        Fog=已售/已放弃、白底描边=已看房)。
    4. 每屏最多一张 Apricot 暖卡 + 一个 Ink 填充按钮(次级动作为 text link)。
    5. 页头 h1 用 Signifier(Source Serif 4)44px —— 修正现状 30px
       低于 DESIGN.md「Signifier 不低于 40px」的问题。
    6. 金额:万元单位、tabular-nums、红正绿负(中国习惯)。
    7. 图表只有两个彩色声音:Rust 暖 + #4a90e2 蓝,其余为 Ink 无彩色。
    8. 三层签名阴影(--shadow-steep / --shadow-steep-sm)。

  技术形态:单文件自包含 HTML + React 18(CDN,Babel 内联转译)。
  字体:Inter(Sohne 替代)+ Source Serif 4(Signifier 替代),
  与 frontend/src/app/layout.tsx 实际落地方案一致。
  ⚠️ 设计稿交付物,有意单文件不拆分。数据为贴近业务的演示数据。
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;450;480;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* ============ 1. Steep tokens(对齐 /DESIGN.md 与 globals.css) ============ */
  :root {
    --ink: #17191c;
    --pwhite: #ffffff;
    --fog: #f7f7f8;
    --ash: #4c4c4c;
    --graphite: #777b86;
    --dove: #a3a6af;
    --rust: #5d2a1a;
    --apricot: #fbe1d1;
    --sky: #d3e3fc;
    --blue: #4a90e2;
    --pos: #ef4444;   /* 金额:红=流入/正向 */
    --neg: #10b981;   /* 金额:绿=流出/负向 */
    --font-display: "Source Serif 4", "Songti SC", "Noto Serif SC", serif;
    --font-ui: "Inter", -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    --r-card: 24px; --r-img: 12px; --r-input: 16px; --r-pill: 9999px;
    --shadow-steep: rgba(4,23,43,.05) 0 0 0 1px, rgba(0,0,0,.1) 0 20px 25px -5px, rgba(0,0,0,.1) 0 8px 10px -6px;
    --shadow-steep-sm: rgba(4,23,43,.05) 0 0 0 1px, rgba(0,0,0,.06) 0 10px 20px -8px, rgba(0,0,0,.05) 0 3px 6px -4px;
    --sidebar-w: 240px;
    --sidebar-w-c: 76px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    font-family: var(--font-ui);
    font-size: 15px; color: var(--ink);
    letter-spacing: -0.009em;
    background: var(--fog);
    min-width: 1180px;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; letter-spacing: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ============ 2. 全局骨架 ============ */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
    background: var(--fog); display: flex; flex-direction: column;
    padding: 20px 14px 16px; z-index: 40;
    transition: width .28s cubic-bezier(.4,0,.2,1);
    overflow: hidden; white-space: nowrap;
  }
  .app.collapsed .sidebar { width: var(--sidebar-w-c); }
  .app.collapsed .main { margin-left: var(--sidebar-w-c); }
  .main { flex: 1; margin-left: var(--sidebar-w); transition: margin-left .28s cubic-bezier(.4,0,.2,1); min-width: 0; }
  .side-logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
  .side-logo .mark {
    width: 30px; height: 30px; border-radius: 9px; background: var(--ink);
    color: #fff; font-size: 15px; font-weight: 600; letter-spacing: 0;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .side-logo .word { font-size: 16px; font-weight: 500; }
  .side-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; margin: 0 -6px; padding: 0 6px; }
  .side-scroll::-webkit-scrollbar { width: 4px; }
  .side-scroll::-webkit-scrollbar-thumb { background: rgba(163,166,175,.35); border-radius: 4px; }
  .nav-group-label {
    font-size: 12px; font-weight: 500; color: var(--graphite);
    letter-spacing: .06em; padding: 16px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 8px 12px; border-radius: 12px; font-size: 14.5px; font-weight: 450;
    color: var(--ink); transition: background .15s; position: relative;
  }
  .nav-item:hover { background: rgba(23,25,28,.05); }
  .nav-item.active { background: var(--pwhite); box-shadow: var(--shadow-steep-sm); }
  .nav-item .ic { color: var(--graphite); display: flex; flex: none; }
  .nav-item.active .ic { color: var(--ink); }
  .nav-item .chev { margin-left: auto; color: var(--dove); transition: transform .2s; display: flex; }
  .nav-item.open .chev { transform: rotate(90deg); }
  .nav-children { overflow: hidden; max-height: 0; transition: max-height .25s ease; }
  .nav-children.open { max-height: 200px; }
  .nav-child {
    display: flex; align-items: center; padding: 6px 12px 6px 41px;
    font-size: 13.5px; font-weight: 430; color: var(--ash); border-radius: 10px;
    transition: color .15s;
  }
  .nav-child:hover { color: var(--ink); }
  .nav-child.active { color: var(--rust); font-weight: 500; }
  .side-foot { padding-top: 12px; border-top: 1px solid rgba(163,166,175,.25); margin-top: 10px; }
  .side-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; width: 100%; }
  .side-user:hover { background: rgba(23,25,28,.05); }
  .side-user .info { text-align: left; line-height: 1.25; }
  .side-user .info .n { font-size: 13.5px; font-weight: 500; }
  .side-user .info .r { font-size: 11.5px; color: var(--graphite); }
  .avatar {
    width: 30px; height: 30px; border-radius: var(--r-pill); flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500; color: var(--ink);
  }
  .av-1 { background: #d9ead3; } .av-2 { background: var(--sky); } .av-3 { background: var(--apricot); }
  .av-4 { background: #e8e2f4; } .av-5 { background: #f0ece1; } .av-6 { background: #dbe6e9; }
  .collapse-btn {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 8px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 450;
    color: var(--graphite); transition: background .15s, color .15s;
  }
  .collapse-btn:hover { background: rgba(23,25,28,.05); color: var(--ink); }

  /* 折叠态:仅图标 */
  .app.collapsed .side-logo { padding-left: 6px; }
  .app.collapsed .side-logo .word,
  .app.collapsed .nav-group-label,
  .app.collapsed .nav-item .lbl,
  .app.collapsed .nav-item .chev,
  .app.collapsed .nav-children,
  .app.collapsed .side-user .info,
  .app.collapsed .collapse-btn .lbl { display: none; }
  .app.collapsed .nav-item { justify-content: center; padding: 10px 0; }
  .app.collapsed .side-user { justify-content: center; }
  .app.collapsed .collapse-btn { justify-content: center; }

  /* ============ 3. 页面通用 ============ */
  .page { max-width: 1480px; margin: 0 auto; padding: 34px 44px 72px; animation: pageIn .38s ease both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 30px; }
  .page-head h1 {
    font-family: var(--font-display); font-weight: 400; font-size: 44px;
    line-height: 1.1; letter-spacing: -0.015em; color: var(--ink);
  }
  .page-head .desc { margin-top: 10px; font-size: 15px; color: var(--graphite); }
  .page-head .aside { font-size: 13px; color: var(--graphite); padding-bottom: 8px; }
  .sec-title { font-size: 21px; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 34px 0 18px; }
  .sec-link { font-size: 14px; font-weight: 450; color: var(--ink); display: inline-flex; align-items: center; gap: 4px; }
  .sec-link:hover { color: var(--rust); }

  /* 卡片 */
  .card {
    background: var(--pwhite); border-radius: var(--r-card);
    box-shadow: var(--shadow-steep-sm);
    padding: 22px 24px;
  }
  .card-warm { background: var(--apricot); box-shadow: none; }
  .card-sky  { background: var(--sky); box-shadow: none; }
  .card-title { font-size: 15px; font-weight: 500; color: var(--ink); }

  /* ============ 4. 统计卡 ============ */
  .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .stat-grid.c4 { grid-template-columns: repeat(4, 1fr); }
  .stat-card { background: var(--pwhite); border-radius: var(--r-card); box-shadow: var(--shadow-steep-sm); padding: 20px 22px 18px; }
  .stat-card.warm { background: var(--apricot); box-shadow: none; }
  .stat-label { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--graphite); }
  .stat-dot { width: 7px; height: 7px; border-radius: var(--r-pill); background: var(--ink); flex: none; }
  .stat-dot.d-rust { background: var(--rust); } .stat-dot.d-apricot { background: var(--apricot); }
  .stat-dot.d-sky { background: #9dbef2; } .stat-dot.d-dove { background: var(--dove); }
  .stat-card.warm .stat-dot { background: var(--rust); }
  .stat-value { font-size: 30px; font-weight: 480; color: var(--ink); margin-top: 12px; line-height: 1; }
  .stat-value .unit { font-size: 14px; font-weight: 430; color: var(--graphite); margin-left: 4px; letter-spacing: 0; }
  .stat-card.warm .stat-value { color: var(--rust); }
  .stat-sub { margin-top: 10px; font-size: 12.5px; color: var(--graphite); display: flex; align-items: center; gap: 5px; }

  /* ============ 5. 工具栏 / 按钮 / 输入 ============ */
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 22px 0 18px; }
  .tabs { display: flex; gap: 4px; background: var(--pwhite); border-radius: var(--r-pill); padding: 4px; box-shadow: var(--shadow-steep-sm); }
  .tab {
    padding: 6px 14px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 450;
    color: var(--ash); transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--ink); color: #fff; }
  .tab .cnt { font-size: 12px; color: var(--dove); font-weight: 430; }
  .tab.active .cnt { color: rgba(255,255,255,.65); }
  .select {
    display: flex; align-items: center; gap: 7px; background: var(--pwhite);
    border-radius: var(--r-input); box-shadow: var(--shadow-steep-sm);
    padding: 8px 14px; font-size: 13.5px; font-weight: 450; color: var(--ash);
  }
  .select:hover { color: var(--ink); }
  .select .ic { color: var(--graphite); display: flex; }
  .search {
    display: flex; align-items: center; gap: 8px; background: var(--pwhite);
    border-radius: var(--r-input); box-shadow: var(--shadow-steep-sm);
    padding: 8px 14px; width: 260px; color: var(--dove); font-size: 13.5px;
  }
  .search input { border: none; outline: none; font: inherit; color: var(--ink); width: 100%; background: none; }
  .search input::placeholder { color: var(--dove); }
  .btn-fill {
    background: var(--ink); color: #fff; border-radius: var(--r-pill);
    padding: 9px 20px; font-size: 14px; font-weight: 450;
    display: inline-flex; align-items: center; gap: 7px; transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 16px -6px rgba(23,25,28,.4);
  }
  .btn-fill:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -8px rgba(23,25,28,.5); }
  .btn-text {
    font-size: 14px; font-weight: 450; color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 6px;
  }
  .btn-text:hover { color: var(--rust); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 12px; background: var(--pwhite);
    box-shadow: var(--shadow-steep-sm); color: var(--graphite);
    display: inline-flex; align-items: center; justify-content: center;
    transition: color .15s;
  }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn:disabled { opacity: .55; cursor: not-allowed; }
  .spacer { flex: 1; }
  .view-toggle { display: flex; gap: 2px; background: var(--pwhite); border-radius: 12px; padding: 3px; box-shadow: var(--shadow-steep-sm); }
  .view-toggle button { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: var(--graphite); }
  .view-toggle button.on { background: var(--fog); color: var(--ink); }

  /* ============ 6. 表格 ============ */
  .tbl-card { padding: 6px 8px; overflow: hidden; }
  table.tbl { width: 100%; border-collapse: collapse; }
  .tbl th {
    text-align: left; font-size: 12.5px; font-weight: 500; color: var(--graphite);
    letter-spacing: .02em; padding: 14px 14px 10px; border-bottom: 1px solid rgba(163,166,175,.35);
    white-space: nowrap;
  }
  .tbl td {
    font-size: 14px; color: var(--ink); padding: 13px 14px;
    border-bottom: 1px solid rgba(163,166,175,.18); white-space: nowrap; vertical-align: middle;
  }
  .tbl tbody tr { transition: background .12s; }
  .tbl tbody tr:hover { background: var(--fog); }
  .tbl tbody tr:last-child td { border-bottom: none; }
  .tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl th.num { text-align: right; }
  .td-sub { font-size: 12px; color: var(--graphite); margin-top: 2px; font-weight: 430; }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: .86em; letter-spacing: 0; }
  .cell-main { font-weight: 480; font-size: 14px; }
  .money-pos { color: var(--pos); font-variant-numeric: tabular-nums; }
  .money-neg { color: var(--neg); font-variant-numeric: tabular-nums; }
  .op-link { font-size: 13px; font-weight: 450; color: var(--ash); margin-right: 12px; }
  .op-link:hover { color: var(--ink); }
  .tbl-foot { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; font-size: 13px; color: var(--graphite); }
  .pager { display: flex; gap: 6px; }
  .pager button {
    min-width: 30px; height: 30px; padding: 0 8px; border-radius: 9px; font-size: 13px;
    color: var(--ash); font-weight: 450;
  }
  .pager button:hover { background: var(--fog); color: var(--ink); }
  .pager button.on { background: var(--ink); color: #fff; }
  .person {
    display: inline-flex; align-items: center; gap: 7px;
  }
  .person .avatar { width: 24px; height: 24px; font-size: 11px; }
  .person .nm { font-size: 13px; font-weight: 450; color: var(--ash); }

  /* ============ 7. 徽章(单色洗底药丸) ============ */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; border-radius: var(--r-pill);
    font-size: 12.5px; font-weight: 450; padding: 3.5px 11px; line-height: 1.35;
  }
  .b-sky     { background: var(--sky); color: var(--ink); }
  .b-apricot { background: var(--apricot); color: var(--rust); }
  .b-ink     { background: var(--ink); color: #fff; }
  .b-fog     { background: var(--fog); color: var(--graphite); }
  .b-fogrust { background: var(--fog); color: var(--rust); }
  .b-outline { background: var(--pwhite); color: var(--ink); box-shadow: inset 0 0 0 1px var(--dove); }
  .b-ghost   { background: rgba(23,25,28,.045); color: var(--graphite); font-size: 11.5px; padding: 2px 8px; }
  .b-rust    { background: var(--rust); color: #fff; }
  .dot { width: 5px; height: 5px; border-radius: var(--r-pill); background: currentColor; opacity: .75; }

  /* ============ 8. 工作台专属 ============ */
  .dash-top { display: grid; grid-template-columns: 5fr 4fr 3fr; gap: 18px; }
  .ov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin-top: 18px; }
  .ov-item .k { font-size: 12.5px; color: var(--graphite); }
  .ov-item .v { font-size: 26px; font-weight: 480; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .ov-item .v .unit { font-size: 12px; color: var(--graphite); font-weight: 430; margin-left: 3px; }
  .funnel-rows { display: flex; flex-direction: column; gap: 11px; margin-top: 18px; }
  .f-row { display: flex; align-items: center; gap: 12px; }
  .f-row .fl { width: 58px; font-size: 12.5px; color: var(--graphite); flex: none; text-align: right; }
  .f-bar { height: 10px; border-radius: var(--r-pill); flex: 1; background: var(--fog); overflow: hidden; }
  .f-bar i { display: block; height: 100%; border-radius: var(--r-pill); }
  .f-row .fv { width: 34px; font-size: 13.5px; font-weight: 480; font-variant-numeric: tabular-nums; }
  .alert-num { font-family: var(--font-display); font-size: 52px; line-height: 1; color: var(--rust); margin-top: 16px; }
  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .q-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid rgba(163,166,175,.18); }
  .q-row:last-child { border-bottom: none; }
  .q-row .nm { font-size: 14px; font-weight: 450; }
  .q-row .meta { font-size: 12px; color: var(--graphite); margin-top: 2px; }
  .monitor-row { display: flex; gap: 18px; overflow-x: auto; padding: 4px 2px 14px; }
  .monitor-row::-webkit-scrollbar { height: 6px; }
  .monitor-row::-webkit-scrollbar-thumb { background: rgba(163,166,175,.4); border-radius: 6px; }
  .m-card {
    width: 296px; flex: none; background: var(--pwhite); border-radius: var(--r-card);
    box-shadow: var(--shadow-steep); padding: 20px 22px;
    display: flex; flex-direction: column; transition: transform .2s;
  }
  .m-card:hover { transform: translateY(-3px); }
  .m-no { display: flex; align-items: center; justify-content: space-between; }
  .m-no .no { font-size: 12px; color: var(--graphite); font-weight: 450; }
  .m-name { font-size: 18px; font-weight: 500; margin-top: 12px; letter-spacing: -0.01em; }
  .m-addr { font-size: 12.5px; color: var(--graphite); margin-top: 4px; }
  .m-div { border-top: 1px dashed rgba(163,166,175,.45); margin: 16px 0 14px; }
  .m-sec { font-size: 11.5px; font-weight: 500; color: var(--graphite); letter-spacing: .05em; margin-bottom: 9px; }
  .m-feed { font-size: 13px; color: var(--ash); line-height: 1.55; }
  .m-feed .t { color: var(--dove); font-size: 12px; margin-right: 6px; }
  .mkt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .mkt .k { font-size: 11.5px; color: var(--graphite); }

/* ---- 图表:迷你趋势 ---- */
function Spark({ data, up, w = 64, h = 22 }) {
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((d, i) => `${(i / (data.length - 1)) * w},${h - 2 - ((d - min) / (max - min || 1)) * (h - 6)}`).join(" ");
  const c = up ? "var(--pos)" : "var(--neg)";
  return (
    <svg width={w} height={h} style={{ flex: "none" }}>
      <polyline points={pts} fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}
/* ---- 图表:柱线组合(报表趋势) ---- */
function ComboChart() {
  const W = 980, H = 250, L = 34, R = 44, T = 18, B = 30;
  const iw = W - L - R, ih = H - T - B;
  const vmax = 140, pmax = 460, pmin = 400;
  const n = TREND.volume.length;
  const step = iw / n;
  const bars = TREND.volume.map((v, i) => {
    const h = (v / vmax) * ih;
    return <rect key={i} x={L + i * step + step * 0.28} y={T + ih - h} width={step * 0.44} height={h} rx="4" fill="#4a90e2" opacity="0.55" />;
  });
  const pts = TREND.price.map((p, i) => [L + i * step + step * 0.5, T + ih * (1 - (p - pmin) / (pmax - pmin))]);
  const line = pts.map(p => p.join(",")).join(" ");
  const grid = [0, 0.5, 1].map(t => (
    <g key={t}>
      <line x1={L} x2={W - R} y1={T + ih * t} y2={T + ih * t} stroke="var(--dove)" strokeOpacity="0.3" strokeDasharray={t === 1 ? "0" : "3 4"} />
    </g>
  ));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} role="img">
      {grid}
      {bars}
      <polyline points={line} fill="none" stroke="var(--rust)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill="#fff" stroke="var(--rust)" strokeWidth="1.8" />)}
      {TREND.labels.map((l, i) => (
        <text key={l} className="axis-t" x={L + i * step + step * 0.5} y={H - 8} textAnchor="middle">{l}</text>
      ))}
      <text className="axis-t" x={L - 6} y={T + 4} textAnchor="end">140</text>
      <text className="axis-t" x={L - 6} y={T + ih + 4} textAnchor="end">0</text>
      <text className="axis-t" x={W - R + 8} y={T + 4}>460万</text>
      <text className="axis-t" x={W - R + 8} y={T + ih + 4}>400万</text>
    </svg>
  );
}
/* ---- 图表:柱状(价格分布,Rust) ---- */
function BarChart() {
  const W = 460, H = 210, L = 10, B = 26, T = 12;
  const iw = W - L * 2, ih = H - T - B;
  const max = Math.max(...PRICE_DIST.map(d => d.v));
  const step = iw / PRICE_DIST.length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      {PRICE_DIST.map((d, i) => {
        const h = (d.v / max) * ih;
        return (
          <g key={d.label}>
            <rect x={L + i * step + step * 0.18} y={T + ih - h} width={step * 0.64} height={h} rx="5" fill="var(--rust)" opacity={0.28 + 0.72 * (d.v / max)} />
            <text className="axis-t" x={L + i * step + step * 0.5} y={H - 8} textAnchor="middle">{d.label}</text>
            <text className="axis-t" x={L + i * step + step * 0.5} y={T + ih - h - 7} textAnchor="middle" fill="var(--ash)">{d.v}</text>
          </g>
        );
      })}
    </svg>
  );
}
/* ---- 横向条(户型 / 楼层分布) ---- */
function HBars({ data }) {
  const max = Math.max(...data.map(d => d.v));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "13px" }}>
      {data.map(d => (
        <div className="hbar-row" key={d.label}>
          <span className="hl">{d.label}</span>
          <span className="hb"><i style={{ width: (d.v / max) * 100 + "%" }} /></span>
          <span className="hv">{d.v}</span>
        </div>
      ))}
    </div>
  );
}

function Sidebar({ page, go, collapsed, setCollapsed, open, toggleOpen }) {
  const renderItem = (item) => {
    const active = page === item.id;
    const hasKids = !!item.children;
    const isOpen = open[item.id];
    return (
      <div key={item.id}>
        <button
          className={"nav-item" + (active ? " active" : "") + (isOpen ? " open" : "")}
          onClick={() => (hasKids ? (toggleOpen(item.id), go(item.id)) : go(item.id))}
          title={collapsed ? item.label : null}
        >
          <span className="ic"><Icon n={item.icon} /></span>
          <span className="lbl">{item.label}</span>
          {hasKids && !collapsed ? <span className="chev"><Icon n="chevRight" size={14} /></span> : null}
        </button>
        {hasKids ? (
          <div className={"nav-children" + (isOpen && !collapsed ? " open" : "")}>
            {item.children.map((c) => (
              <button key={c} className={"nav-child" + (active && c === item.children[0] ? " active" : "")}
                onClick={() => go(item.id)}>{c}</button>
            ))}
          </div>
        ) : null}
      </div>
    );
  };
  return (
    <aside className="sidebar">
      <div className="side-logo">
        <span className="mark">P</span>
        <span className="word">Profo</span>
      </div>
      <div className="side-scroll">

            <HBars data={LAYOUT_DIST} />
          </div>
          <div className="card">
            <div className="card-title" style={{ marginBottom: 16 }}>楼层分布</div>
            <HBars data={FLOOR_DIST} />
          </div>
        </div>
      </div>

      {/* 商圈表 */}
      <div className="sec-head">
        <h2 className="sec-title">商圈数据</h2>
        <span style={{ fontSize: 13, color: "var(--graphite)" }}>勾选商圈加入对比</span>
      </div>
      <div className="card tbl-card">
        <table className="tbl">
          <thead>
            <tr>
              <th style={{ width: 40 }}></th>
              <th>商圈</th><th className="num">成交量(套)</th><th className="num">均价(万)</th>
              <th className="num">单价(万/㎡)</th><th className="num">在售(套)</th>
              <th className="num">去化月数</th><th className="num">价格环比</th><th className="num">成交量环比</th>
            </tr>
          </thead>
          <tbody>
            {DISTRICTS.map((d) => {
              const on = picked.includes(d.name);
              return (
                <tr key={d.name}>
                  <td>
                    <button
                      onClick={() => togglePick(d.name)}
                      style={{
                        width: 18, height: 18, borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center",
                        background: on ? "var(--ink)" : "var(--pwhite)", color: "#fff",
                        boxShadow: "inset 0 0 0 1.5px " + (on ? "var(--ink)" : "var(--dove)"),
                      }}
                    >
                      {on ? <Icon n="check" size={12} sw={2.4} /> : null}
                    </button>
                  </td>
                  <td className="cell-main">{d.name}</td>
                  <td className="num" style={{ fontWeight: 480 }}>{d.vol}</td>
                  <td className="num tnum">{d.avg}</td>
                  <td className="num tnum" style={{ color: "var(--ash)" }}>{d.unit}</td>
                  <td className="num tnum" style={{ color: "var(--ash)" }}>{d.onSale}</td>
                  <td className="num tnum" style={{ color: "var(--ash)" }}>{d.absorb}</td>
                  <td className="num">
                    <span style={{ color: d.pq >= 0 ? "var(--pos)" : "var(--neg)", fontWeight: 450 }}>
                      {d.pq >= 0 ? "▲" : "▼"} {Math.abs(d.pq).toFixed(1)}%
                    </span>
                  </td>
                  <td className="num">
                    <span style={{ color: d.vq >= 0 ? "var(--pos)" : "var(--neg)", fontWeight: 450 }}>
                      {d.vq >= 0 ? "▲" : "▼"} {Math.abs(d.vq).toFixed(1)}%
                    </span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================================================================
   占位屏
   ================================================================ */
function ScreenPlaceholder({ id, go }) {
  const t = PAGE_TITLES[id] || "页面";
  return (
    <div className="page" data-screen-label={t + "(占位)"}>
      <div className="placeholder">
        <div className="pic"><Icon n="kanban" size={26} /></div>
        <h2>{t}</h2>
        <p>该模块未包含在本次设计稿迭代范围</p>
        <div className="ph-links">
          {[["dashboard", "工作台"], ["projects", "项目管理"], ["leads", "线索中心"], ["ledger", "资金账本"], ["reports", "数据报表"]].map(([pid, pl]) => (
            <button className="ph-chip" key={pid} onClick={() => go(pid)}>{pl} →</button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ================================================================
   设计说明面板
   ================================================================ */
const NOTES = [
  ["01", "侧边栏改为 Steep 规范:Fog 实底、240px、无描边;激活项白底 12px 圆角 + 微阴影,替代旧毛玻璃 + bg-muted。"],
  ["02", "主色统一为 Ink #17191c,替代旧 #005daa 蓝;Rust #5d2a1a 仅作暖强调(预警、评估预警标签、趋势线)。"],
  ["03", "页头 h1 升为 Signifier(Source Serif 4)44px —— 修正现状 30px 低于规范下限(40px)的问题;副标题 15px Graphite。"],
  ["04", "状态徽章收敛为「单色洗底药丸」:Sky=签约/待看房、Apricot=装修/待评估、Ink 填充=在售/已签约、Fog=已售/已放弃、白底描边=已看房。"],
  ["05", "每屏最多一张 Apricot 暖卡(工作台=待评估预警、项目=在售、线索=已签约、账本=净现金流、报表=成交均价)、最多一个 Ink 填充按钮,次级动作一律 text link。"],
  ["06", "金额规范:万元单位、tabular-nums、红正绿负(中国习惯);亏损项目净现金流绿色显示。"],
  ["07", "图表色彩纪律:只有 Rust 暖与 #4a90e2 蓝两个彩色声音(趋势组合图、价格分布 Rust 柱),分布横条用 Ink。"],
  ["08", "卡片 24px 圆角 + 三层签名阴影;输入 16px、按钮/徽章全胶囊;表格行 hover Fog、发丝线分隔。"],
  ["09", "漏斗条使用 Ink → 蓝 → Apricot → Rust 阶梯,呼应「色彩作标点」的原则;预警卡大数字用 Signifier 52px Rust。"],
  ["10", "信息架构微调:Dashboard 三卡比例 5:4:3;快捷入口/监控项目/线索表保留;科目管理等其余模块为占位屏。"],
];
function NotesPanel({ open, setOpen }) {
  const [show, setShow] = useState(false);
  return (
    <React.Fragment>
      <button className="notes-fab" onClick={() => setShow(!show)} title="设计说明">{show ? "✕" : "注"}</button>
      {show ? (
        <div className="notes-panel">
          <h3>设计说明</h3>
          <p className="sub">Admin 工作台 · Steep 重构 · 相对现状的 10 个关键决策</p>
          {NOTES.map(([no, txt]) => (
            <div className="note-item" key={no}><span className="no">{no}</span><span>{txt}</span></div>
          ))}
        </div>
      ) : null}
    </React.Fragment>
  );
}

/* ================================================================
   App
   ================================================================ */
function App() {
  const [page, setPage] = useState("dashboard");
  const [collapsed, setCollapsed] = useState(false);
  const [open, setOpen] = useState({});
  const [toastMsg, setToastMsg] = useState(null);
  const timer = useRef(null);

  useEffect(() => {
    const h = (e) => {
      setToastMsg(e.detail);
      clearTimeout(timer.current);
      timer.current = setTimeout(() => setToastMsg(null), 2200);
    };
    window.addEventListener("d-toast", h);
    return () => window.removeEventListener("d-toast", h);
  }, []);

  const go = (p) => setPage(p);
  const toggleOpen = (id) => setOpen((o) => ({ ...o, [id]: !o[id] }));

  const screens = {
    dashboard: <ScreenDashboard go={go} />,
    projects: <ScreenProjects />,
    leads: <ScreenLeads />,
    ledger: <ScreenLedger />,
    reports: <ScreenReports />,
  };

  return (
    <div className={"app" + (collapsed ? " collapsed" : "")}>
      <Sidebar page={page} go={go} collapsed={collapsed} setCollapsed={setCollapsed} open={open} toggleOpen={toggleOpen} />
      <main className="main">
        {screens[page] || <ScreenPlaceholder id={page} go={go} />}
      </main>
      <NotesPanel />
      {toastMsg ? <div className="toast">{toastMsg}</div> : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
