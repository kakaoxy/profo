<!--
  ============================================================
  迭代二 · 统一消息中心 + 角色化工作台 · 高保真设计稿
  依据：docs/To-Do/SPEC-iteration2-notifications-workbench.md
  视觉：严格遵循 /DESIGN.md（Steep），复用 docs/design/admin-workspace-hifi.html 的令牌与组件语言
  ============================================================
  覆盖 6 屏（桌面端 1440+）：
    01 /admin                     角色化工作台（视角切换：admin 10 / operator 8 / user 3 个 widget）
    02 侧边栏铃铛 + 消息抽屉       最近 10 条 + 分类 tabs + 全部已读 + 查看全部（桌面 Popover）
    03 /admin/notifications       消息中心整页（筛选 / 分页 / 单条已读 / 全部已读）
    04 /admin/notifications/preferences  分类 × 渠道偏好（system/security 锁定，微信模板缺失置灰）
    05 /admin/settings/workbench  角色默认布局管理（workbench:manage，含预览与 403 态）
    06 规范                        事件字典 12 条 + widget 注册表矩阵 + 组件状态

  相对 SPEC 的设计口径补充（均已在稿内标注 ⚠️）：
    a. 6 栏孤儿卡：registry 里 span=6 的卡若不成对，渲染时自动升为 12 栏，避免 12 栏栅格空洞。
       （admin: growth+finance 成对、audit 升满宽；operator: growth 升满宽）
    b. §4.7 表里 operator 可见 8 个，但同节「默认可见数 admin 10 / operator 7 / user 3」写 7。
       本稿按表渲染 8 个，并在对照表高亮差异。
    c. 消息抽屉不新增侧边栏菜单项（K10），消息中心仅通过铃铛 → 查看全部进入。

  技术形态：单文件自包含 HTML + React 18（CDN，Babel 内联转译）。
  字体：Inter（Sohne 替代）+ Source Serif 4（Signifier 替代），与 frontend 落地方案一致。
  ⚠️ 设计稿交付物，有意单文件不拆分。

  ============================================================
  【数据源约束 · 2026-10-25 反向迭代】
  依据：docs/To-Do/2026-10-25-迭代二-消息中心-角色工作台-SPEC.md「最高约束」
  「现有业务口径数据中没有的，不要硬创建数据，除了转化率这种计算可获得的」。
  本稿所有指标已回退为「已有字段」或「可由现有数据计算」，共 5 处降级：
    1. 待办卡      逾期/今日/本周  → 待办项目/待办总数/P0/最深逾期
    2. 获客卡      到访转化        → 整体转化率（有效新客 ÷ 分享次数）
                   渠道来源        → 按 4 模块（估价/预约/房源单/招募）
    3. 审计卡      高风险          → 敏感访问（导出/银行卡）
                   操作分布四分类  → 按 action 原值聚合
    4. 快捷入口    进行中 N 场     → 删除（活动无起止时间字段）
                   今日 N 项       → 删除 / 改静态文案
    5. 偏好页      6 个入口        → 5 个入口（后端仅 5 个模板 key）
  降级依据逐条见 Screen 06「⚠️ 未覆盖 / 待确认」。
  演示数据仍为贴近业务的样例值，但**含义**已与真实数据源一一对应。
  ============================================================
-->

<style>
  /* ============ 1. Steep tokens（对齐 /DESIGN.md 与 globals.css） ============ */
  :root {
    --ink: #17191c;
    --pwhite: #ffffff;
    --fog: #f7f7f8;
    --ash: #4c4c4c;
    --graphite: #777b86;
    --dove: #a3a6af;
    --slate: #8b8c8d;
    --rust: #5d2a1a;
    --apricot: #fbe1d1;
    --sky: #d3e3fc;
    --blue: #4a90e2;
    --pos: #ef4444;   /* 金额：红=流入/正向（中国习惯） */
    --neg: #10b981;   /* 金额：绿=流出/负向 */
    --font-display: "Source Serif 4", "Songti SC", "Noto Serif SC", serif;
    --font-ui: "Inter", -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    --r-card: 24px; --r-img: 12px; --r-input: 16px; --r-pill: 9999px;
    --shadow-steep: rgba(4,23,43,.05) 0 0 0 1px, rgba(0,0,0,.1) 0 20px 25px -5px, rgba(0,0,0,.1) 0 8px 10px -6px;
    --shadow-steep-sm: rgba(4,23,43,.05) 0 0 0 1px, rgba(0,0,0,.06) 0 10px 20px -8px, rgba(0,0,0,.05) 0 3px 6px -4px;
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    font-family: var(--font-ui);
    font-size: 15px; color: var(--ink);
    letter-spacing: -0.009em;
    background: var(--fog);
    min-width: 1180px;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; letter-spacing: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  .tnum { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ============ 2. 全局骨架 ============ */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
    background: var(--fog); display: flex; flex-direction: column;
    padding: 20px 14px 16px; z-index: 40;
    overflow: hidden; white-space: nowrap;
  }
  .main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; }
  .side-logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
  .side-logo .mark {
    width: 30px; height: 30px; border-radius: 9px; background: var(--ink);
    color: #fff; font-size: 15px; font-weight: 600; letter-spacing: 0;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .side-logo .word { font-size: 16px; font-weight: 500; }
  .side-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; margin: 0 -6px; padding: 0 6px; }
  .side-scroll::-webkit-scrollbar { width: 4px; }
  .side-scroll::-webkit-scrollbar-thumb { background: rgba(163,166,175,.35); border-radius: 4px; }
  .nav-group-label {
    font-size: 12px; font-weight: 500; color: var(--graphite);
    letter-spacing: .06em; padding: 16px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 8px 12px; border-radius: 12px; font-size: 14.5px; font-weight: 450;
    color: var(--ink); transition: background .15s; position: relative;
  }
  .nav-item:hover { background: rgba(23,25,28,.05); }
  .nav-item.active { background: var(--pwhite); box-shadow: var(--shadow-steep-sm); }
  .nav-item .ic { color: var(--graphite); display: flex; flex: none; }
  .nav-item.active .ic { color: var(--ink); }
  .nav-item .chev { margin-left: auto; color: var(--dove); display: flex; }
  .side-foot { padding-top: 12px; border-top: 1px solid rgba(163,166,175,.25); margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
  .side-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; width: 100%; }
  .side-user:hover { background: rgba(23,25,28,.05); }
  .side-user .info { text-align: left; line-height: 1.25; }
  .side-user .info .n { font-size: 13.5px; font-weight: 500; }
  .side-user .info .r { font-size: 11.5px; color: var(--graphite); }
  .avatar {
    width: 30px; height: 30px; border-radius: var(--r-pill); flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500; color: var(--ink);
  }
  .av-1 { background: #d9ead3; } .av-2 { background: var(--sky); } .av-3 { background: var(--apricot); }
  .av-4 { background: #e8e2f4; } .av-5 { background: #f0ece1; } .av-6 { background: #dbe6e9; }
  .collapse-btn {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 8px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 450;
    color: var(--graphite); transition: background .15s, color .15s;
  }
  .collapse-btn:hover { background: rgba(23,25,28,.05); color: var(--ink); }

  /* 消息铃铛（SidebarFooter 内：折叠按钮之下、头像之上） */
  .bell-btn {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 8px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 450;
    color: var(--ash); transition: background .15s, color .15s; position: relative;
  }
  .bell-btn:hover { background: rgba(23,25,28,.05); color: var(--ink); }
  .bell-btn.active { background: var(--pwhite); box-shadow: var(--shadow-steep-sm); color: var(--ink); }
  .bell-btn .ic { color: var(--graphite); display: flex; flex: none; }
  .bell-btn.active .ic { color: var(--ink); }
  .bell-badge {
    margin-left: auto; background: var(--ink); color: #fff; border-radius: var(--r-pill);
    min-width: 20px; height: 20px; padding: 0 6px; font-size: 11.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
  }
  .bell-badge.zero { display: none; }

  /* ============ 3. 页面通用 ============ */
  .page { max-width: 1480px; margin: 0 auto; padding: 34px 44px 96px; animation: pageIn .34s ease both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
  .page-head h1 {
    font-family: var(--font-display); font-weight: 400; font-size: 44px;
    line-height: 1.1; letter-spacing: -0.015em; color: var(--ink);
  }
  .page-head .desc { margin-top: 10px; font-size: 15px; color: var(--graphite); max-width: 720px; }
  .page-head .aside { display: flex; align-items: center; gap: 14px; padding-bottom: 6px; flex: none; }
  .sec-title { font-size: 21px; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 34px 0 16px; }
  .sec-link { font-size: 14px; font-weight: 450; color: var(--ink); display: inline-flex; align-items: center; gap: 4px; }
  .sec-link:hover { color: var(--rust); }
  .card {
    background: var(--pwhite); border-radius: var(--r-card);
    box-shadow: var(--shadow-steep-sm); padding: 22px 24px;
  }
  .card-warm { background: var(--apricot); box-shadow: none; }
  .card-sky  { background: var(--sky); box-shadow: none; }
  .card-title { font-size: 15px; font-weight: 500; color: var(--ink); }
  .cols { display: grid; gap: 18px; }
  .cols-2 { grid-template-columns: 1fr 1fr; }
  .cols-3 { grid-template-columns: 1fr 1fr 1fr; }

  /* ============ 4. 工具栏 / 按钮 / 输入 ============ */
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 22px 0 16px; }
  .tabs { display: flex; gap: 4px; background: var(--pwhite); border-radius: var(--r-pill); padding: 4px; box-shadow: var(--shadow-steep-sm); }
  .tab {
    padding: 6px 14px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 450;
    color: var(--ash); transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--ink); color: #fff; }
  .tab .cnt { font-size: 12px; color: var(--dove); font-weight: 430; font-variant-numeric: tabular-nums; }
  .tab.active .cnt { color: rgba(255,255,255,.65); }
  .select {
    display: flex; align-items: center; gap: 7px; background: var(--pwhite);
    border-radius: var(--r-input); box-shadow: var(--shadow-steep-sm);
    padding: 8px 14px; font-size: 13.5px; font-weight: 450; color: var(--ash);
  }
  .select:hover { color: var(--ink); }
  .select .ic { color: var(--graphite); display: flex; }
  .btn-fill {
    background: var(--ink); color: #fff; border-radius: var(--r-pill);
    padding: 9px 20px; font-size: 14px; font-weight: 450;
    display: inline-flex; align-items: center; gap: 7px; transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 16px -6px rgba(23,25,28,.4);
  }
  .btn-fill:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -8px rgba(23,25,28,.5); }
  .btn-fill.sm { padding: 7px 16px; font-size: 13px; }
  .btn-text {
    font-size: 14px; font-weight: 450; color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 6px;
  }
  .btn-text:hover { color: var(--rust); }
  .btn-text.sm { font-size: 13px; padding: 4px 2px; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 10px; background: var(--pwhite);
    box-shadow: var(--shadow-steep-sm); color: var(--graphite);
    display: inline-flex; align-items: center; justify-content: center; transition: color .15s;
  }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn.plain { box-shadow: none; background: none; }
  .icon-btn.plain:hover { background: var(--fog); }
  .icon-btn:disabled { opacity: .4; cursor: not-allowed; }
  .spacer { flex: 1; }
  .pill-group { display: flex; gap: 3px; background: var(--fog); border-radius: var(--r-pill); padding: 3px; }
  .pill-group button { padding: 5px 13px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 450; color: var(--ash); }
  .pill-group button:hover { color: var(--ink); }
  .pill-group button.on { background: var(--pwhite); color: var(--ink); box-shadow: 0 1px 4px rgba(23,25,28,.1); }
  .help { font-size: 12.5px; color: var(--graphite); }

  /* 开关 */
  .switch {
    width: 40px; height: 23px; border-radius: var(--r-pill); background: rgba(163,166,175,.42);
    position: relative; transition: background .18s; flex: none; display: inline-block;
  }
  .switch i {
    position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: var(--r-pill);
    background: #fff; box-shadow: 0 1px 3px rgba(23,25,28,.28); transition: transform .18s;
  }
  .switch.on { background: var(--ink); }
  .switch.on i { transform: translateX(17px); }
  .switch.dis { opacity: .42; cursor: not-allowed; }

  /* ============ 5. 徽章（单色洗底药丸） ============ */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; border-radius: var(--r-pill);
    font-size: 12.5px; font-weight: 450; padding: 3.5px 11px; line-height: 1.35;
    white-space: nowrap; flex: none;
  }
  .b-sky     { background: var(--sky); color: var(--ink); }
  .b-apricot { background: var(--apricot); color: var(--rust); }
  .b-ink     { background: var(--ink); color: #fff; }
  .b-fog     { background: var(--fog); color: var(--graphite); }
  .b-fogrust { background: var(--fog); color: var(--rust); }
  .b-outline { background: var(--pwhite); color: var(--ink); box-shadow: inset 0 0 0 1px var(--dove); }
  .b-ghost   { background: rgba(23,25,28,.045); color: var(--graphite); font-size: 11.5px; padding: 2px 8px; }
  .b-rust    { background: var(--rust); color: #fff; }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: .86em; letter-spacing: 0; }
  .dot { width: 5px; height: 5px; border-radius: var(--r-pill); background: currentColor; opacity: .75; }

  /* ============ 6. 工作台栅格 + widget ============ */
  .wb-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
  .wb { grid-column: span 12; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .wb.sp3 { grid-column: span 3; }
  .wb.sp6 { grid-column: span 6; }
  .wg { background: var(--pwhite); border-radius: var(--r-card); box-shadow: var(--shadow-steep-sm); padding: 20px 22px; flex: 1; display: flex; flex-direction: column; }
  .wg.warm { background: var(--apricot); box-shadow: none; }
  .wg.warm .wg-title { color: var(--rust); }
  .wg.warm .sec-link { color: var(--rust); }
  .wg.warm .sec-link:hover { color: #3f1c11; }
  .wg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 2px; }
  .wg-title { font-size: 15px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 7px; }
  .wg-sub { font-size: 12px; color: var(--graphite); font-weight: 430; }
  .kpi-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 14px; margin-top: 18px; }
  .kpi-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 18px; }
  .kpi-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
  .wg-split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; margin-top: 18px; }
  .wg-split .kpi-3, .wg-split .mini-list, .wg-split .spark { margin-top: 0; }
  .wg-split.narrow-right { grid-template-columns: 3fr 2fr; }
  .kpi .k { font-size: 12.5px; color: var(--graphite); display: flex; align-items: center; gap: 6px; }
  .kpi .v.lg { font-size: 32px; }
  .kpi .v { font-size: 26px; font-weight: 480; color: var(--ink); margin-top: 5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi .v .unit { font-size: 12px; font-weight: 430; color: var(--graphite); margin-left: 3px; letter-spacing: 0; }
  .kpi .d { font-size: 11.5px; color: var(--graphite); margin-top: 7px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .funnel { display: flex; flex-direction: column; gap: 11px; margin-top: 16px; }
  .f-row { display: flex; align-items: center; gap: 10px; }
  .f-row .fl { width: 56px; font-size: 12.5px; color: var(--graphite); flex: none; text-align: right; }
  .f-bar { height: 9px; border-radius: var(--r-pill); flex: 1; background: var(--fog); overflow: hidden; }
  .f-bar i { display: block; height: 100%; border-radius: var(--r-pill); }
  .f-row .fv { width: 30px; font-size: 13px; font-weight: 480; text-align: right; font-variant-numeric: tabular-nums; }
  .alert-num { font-family: var(--font-display); font-size: 52px; line-height: 1; color: var(--rust); margin-top: 14px; }
  .alert-note { font-size: 13px; color: var(--rust); opacity: .82; margin-top: 10px; line-height: 1.5; }
  .todo-rows { display: flex; flex-direction: column; margin-top: 8px; }
  .todo-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(163,166,175,.18); }
  .todo-row:last-child { border-bottom: none; padding-bottom: 0; }
  .todo-row .nm { font-size: 13.5px; font-weight: 450; }
  .todo-row .tk { font-size: 12.5px; color: var(--graphite); margin-top: 2px; }
  .todo-row .due { margin-left: auto; flex: none; font-size: 11.5px; color: var(--graphite); text-align: right; padding-top: 2px; }
  .todo-row .due.late { color: var(--rust); font-weight: 450; }
  .spark { display: flex; align-items: flex-end; gap: 4px; height: 40px; margin-top: 16px; }
  .spark i { flex: 1; background: var(--sky); border-radius: 4px 4px 2px 2px; display: block; }
  .spark i.hot { background: var(--rust); }
  .spark-x { display: flex; gap: 4px; margin-top: 7px; }
  .spark-x span { flex: 1; text-align: center; font-size: 10.5px; color: var(--dove); }
  .mini-list { display: flex; flex-direction: column; margin-top: 8px; }
  .mini-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(163,166,175,.18); }
  .mini-row:last-child { border-bottom: none; }
  .mini-row .nm { font-size: 13.5px; font-weight: 450; display: block; }
  .mini-row .meta { font-size: 11.5px; color: var(--graphite); margin-top: 2px; display: block; }

/* 12 栏栅格自动升格：span=6 的卡若落单则升满宽（⚠️ 设计稿补充口径 a） */
function resolveSpans(keys) {
  const out = [];
  let pend6 = null;
  keys.forEach((k) => {
    const sp = WIDGETS[k].span;
    if (sp === 6) {
      if (pend6) { out.push({ key: pend6, span: 6, promoted: false }); out.push({ key: k, span: 6, promoted: false }); pend6 = null; }
      else pend6 = k;
    } else {
      if (pend6) { out.push({ key: pend6, span: 12, promoted: true }); pend6 = null; }
      out.push({ key: k, span: sp, promoted: false });
    }
  });
  if (pend6) out.push({ key: pend6, span: 12, promoted: true });
  return out;
}

function RoleSwitch({ role, setRole }) {

    <div className="role-switch">

      <span className="dv-chip">VIEW · {role}</span>
    </div>
  );
}

function Customizer({ layouts, setLayouts, role, onClose }) {
  const list = layouts[role];
  const move = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    const next = list.slice();
    const tmp = next[i];
    next[i] = next[j];
    next[j] = tmp;
    setLayouts({ ...layouts, [role]: next });
  };
  const toggle = (i) => {
    const next = list.slice();
    next[i] = { key: next[i].key, enabled: !next[i].enabled };
    setLayouts({ ...layouts, [role]: next });
  };
  return (
    <aside className="cz-panel" role="dialog" aria-label="定制工作台">
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10 }}>
        <div>
          <h3>定制工作台</h3>
          <p className="sub">显示 / 隐藏 + 上下移动。栅格宽度由 widget 注册表决定，不随布局变化。</p>
        </div>
        <button className="icon-btn plain" onClick={onClose} aria-label="关闭"><Icon n="x" size={15} /></button>
      </div>
      <div className="cz-list">
        {list.map((w, i) => (
          <div className={"cz-row" + (w.enabled ? "" : " dim")} key={w.key}>
            <span className="cz-grip"><Icon n="gripV" size={13} /></span>
            <span className="nm">{WIDGETS[w.key].label}</span>
            <span className="sp">{WIDGETS[w.key].span === 12 ? "满宽" : WIDGETS[w.key].span + " 栏"}</span>
            <button className="cz-mini" onClick={() => move(i, -1)} disabled={i === 0} aria-label="上移"><Icon n="chevUp" size={13} /></button>
            <button className="cz-mini" onClick={() => move(i, 1)} disabled={i === list.length - 1} aria-label="下移"><Icon n="chevDown" size={13} /></button>
            <Switch on={w.enabled} onChange={() => toggle(i)} label={"显示 " + WIDGETS[w.key].label} />
          </div>
        ))}
      </div>
      <div className="cz-foot">
        <button className="btn-text sm" onClick={() => { setLayouts({ ...layouts, [role]: ROLE_LAYOUTS[role].map((k) => ({ key: k, enabled: true })) }); toast("已恢复「" + ROLE_META[role].name + "」默认布局"); }}>
          <Icon n="reset" size={13} /> 重置

        <button className="btn-fill sm" onClick={() => { toast("已保存到 user_preferences · workbench.layout"); onClose(); }}>保存布局</button>
      </div>
    </aside>
  );
}

/* ================================================================
   Screen 04 · 消息偏好  /admin/notifications/preferences
   ================================================================ */
function PreferencesScreen({ go }) {
  const [prefs, setPrefs] = useState(() => {
    const o = {};
    PREF_ROWS.forEach((r) => {
      o[r.cat] = { in_app: true, wechat: r.wechatOnly ? true : r.cat === "project" ? false : true };
    });
    return o;
  });
  const [wechatOk, setWechatOk] = useState(true);
  const toggle = (cat, ch) => {
    const row = PREF_ROWS.find((r) => r.cat === cat);
    if (row.locked && ch === "in_app") { toast("系统与安全通知不可关闭站内信（400）"); return; }
    if (!wechatOk && ch === "wechat") return;
    setPrefs({ ...prefs, [cat]: { ...prefs[cat], [ch]: !prefs[cat][ch] } });
  };
  return (
    <div className="page" data-screen-label="04 消息偏好">
      <PageHeader
        title="消息偏好"
        desc="按「分类 × 渠道」两级开关。默认全开，与现状行为保持一致（K5）。"
        aside={
          <React.Fragment>
            <button className="btn-text" onClick={() => go("notifications")}><Icon n="chevLeft" size={13} /> 返回消息中心</button>
            <button className="btn-fill" onClick={() => toast("PUT /notifications/preferences → 200")}>保存偏好</button>
          </React.Fragment>
        }
      />

      <div className="banner warn" style={{ maxWidth: 1180 }}>
        <span className="ic"><Icon n="alert" size={17} /></span>
        <span>
          <span className="t">微信模板缺失：5 个订阅入口中 1 个未配置</span>
          <span className="d" style={{ display: "block" }}>
            「新客户线索」模板未配置（status=skipped / error_code=TEMPLATE_MISSING），对应微信开关已置灰且不可打开（K18）。
            请先在 设置 → 订阅消息模板 补齐后再回来开启。
          </span>
        </span>
        <span className="spacer"></span>
        <button className="btn-text sm" style={{ whiteSpace: "nowrap", flex: "none" }} onClick={() => setWechatOk(!wechatOk)}>
          {wechatOk ? "演示：模拟未绑定微信" : "演示：恢复已绑定"}
        </button>
      </div>

      {!wechatOk ? (
        <div className="banner" style={{ maxWidth: 1180 }}>
          <span className="ic" style={{ background: "var(--fog)", color: "var(--graphite)" }}><Icon n="mail" size={17} /></span>
          <span>
            <span className="t">当前账号未绑定微信</span>
            <span className="d" style={{ display: "block" }}>微信渠道整列不可用（wechat_available=false）。请先在小程序端完成绑定。</span>
          </span>
        </div>
      ) : null}

      <div className="card pref-card" style={{ maxWidth: 1180 }}>
        <table className="pref-tbl">
          <thead>
            <tr>
              <th>分类</th>
              <th className="c">站内信</th>
              <th className="c">微信</th>
            </tr>
          </thead>
          <tbody>
            {PREF_ROWS.map((r) => (
              <tr key={r.cat}>
                <td>
                  <div className="cat">
                    <span className="ic"><Icon n={CAT_ICON[r.cat]} size={15} /></span>
                    {r.label}
                    {r.locked ? <Badge cls="b-fog">不可关闭</Badge> : null}
                  </div>
                  <div className="why">{r.why}</div>
                </td>
                <td className="c">
                  <span className="in">
                    {r.locked ? <span className="lock" title="后端强制忽略关闭请求"><Icon n="lock" size={13} /></span> : null}
                    <Switch on={r.locked ? true : prefs[r.cat].in_app} dis={r.locked || r.wechatOnly}
                      onChange={() => toggle(r.cat, "in_app")} label={r.label + " 站内信"} />
                  </span>
                </td>
                <td className="c">
                  <span className="in">
                    <Switch on={prefs[r.cat].wechat} dis={!wechatOk || r.cat === "growth"}
                      onChange={() => toggle(r.cat, "wechat")} label={r.label + " 微信"} />
                    {r.cat === "growth" ? (
                      <span className="lock" title="模板未配置（TEMPLATE_MISSING），不可打开"><Icon n="lock" size={12} /></span>
                    ) : null}
                  </span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="cols cols-2" style={{ marginTop: 18, maxWidth: 1180 }}>
        <div className="card" style={{ padding: "18px 20px" }}>
          <div className="card-title">关闭后会发生什么</div>
          <div className="help" style={{ marginTop: 8, lineHeight: 1.72 }}>
            关闭某分类的站内信后，事件仍会触发、微信仍按原逻辑发送，但<b style={{ fontWeight: 480, color: "var(--ink)" }}>不产生新的收件记录</b>；
            已产生的历史消息不受影响。
          </div>
        </div>
        <div className="card" style={{ padding: "18px 20px" }}>
          <div className="card-title">C 端事件不在本页</div>
          <div className="help" style={{ marginTop: 8, lineHeight: 1.72 }}>
            营销发布、营销调价、评估价变更仅落投递审计日志，不建站内信，因此不出现在偏好设置中（K6）。
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================================================================
   Screen 05 · 角色默认布局管理  /admin/settings/workbench
   ================================================================ */
function AdminLayoutScreen() {
  const [role, setRole] = useState("admin");
  const [order, setOrder] = useState(ROLE_LAYOUTS.admin.slice());
  const [enabled, setEnabled] = useState(() => {
    const o = {};
    Object.keys(WIDGETS).forEach((k) => { o[k] = ROLE_LAYOUTS.admin.indexOf(k) >= 0; });
    return o;
  });
  const [denied, setDenied] = useState(false);
  const isUserRole = role === "user";

  const move = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= order.length) return;
    const next = order.slice();
    const t = next[i]; next[i] = next[j]; next[j] = t;
    setOrder(next);
  };
  const toggle = (k) => setEnabled({ ...enabled, [k]: !enabled[k] });
  const visibleForPreview = order.filter((k) => enabled[k]);
  const preview = resolveSpans(visibleForPreview);

  return (
    <div className="page" data-screen-label="05 工作台布局管理">
      <PageHeader
        title="工作台布局管理"
        desc="配置三种角色的默认工作台布局。个人覆盖优先于角色默认，但任何层级都不能授予权限（K11 / K15）。"
        aside={
          <React.Fragment>
            <span className="role-switch">
              <span className="lbl">预览角色</span>
              <div className="pill-group" style={{ background: "var(--pwhite)", boxShadow: "var(--shadow-steep-sm)" }}>
                {["admin", "operator", "user"].map((r) => (
                  <button key={r} className={role === r ? "on" : ""} onClick={() => setRole(r)}>{ROLE_META[r].name}</button>
                ))}
              </div>
            </span>
            <button className="btn-fill" onClick={() => toast("PUT /admin/workbench/role-layouts → 已写入 operation_logs")}>
              <Icon n="check" size={14} /> 保存为角色默认
            </button>
          </React.Fragment>
        }
      />

      {denied ? <ForbiddenCard onBack={() => setDenied(false)} /> : null}
      {!denied ? (
        <React.Fragment>
          <div className="lay-grid">
            {/* 左：可分配 widget 列表 */}
            <div className="card" style={{ padding: "8px 10px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 8px 10px" }}>
                <span className="card-title">{ROLE_META[role].name}默认布局</span>
                <Badge cls="b-fog">{visibleForPreview.length} / {order.length}</Badge>
                <span className="spacer"></span>
                <span className="help">拖拽排序（本期只做上移/下移）</span>
              </div>
              {order.map((k, i) => {
                const w = WIDGETS[k];
                const on = enabled[k];
                return (
                  <div className={"lay-row" + (on ? "" : " dim")} key={k}>
                    <span className="ord tnum">{String((i + 1) * 10).padStart(2, "0")}</span>
                    <span className="cz-grip"><Icon n="gripV" size={13} /></span>
                    <span style={{ flex: 1, minWidth: 0 }}>
                      <span className="nm" style={{ display: "block" }}>{w.label}</span>
                      <span className="meta">
                        <Icon n="key" size={11} /> {w.perm}
                        <span style={{ color: "var(--dove)" }}>·</span> {w.span === 12 ? "满宽" : w.span + " 栏"}
                      </span>
                    </span>
                    <span className="ctrls">
                      <button className="cz-mini" onClick={() => move(i, -1)} disabled={i === 0} aria-label="上移"><Icon n="chevUp" size={13} /></button>
                      <button className="cz-mini" onClick={() => move(i, 1)} disabled={i === order.length - 1} aria-label="下移"><Icon n="chevDown" size={13} /></button>
                      <Switch on={on} onChange={() => toggle(k)} label={"启用 " + w.label} />
                    </span>
                  </div>
                );
              })}
              <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 8px 10px", borderTop: "1px solid rgba(163,166,175,.25)", marginTop: 6 }}>
                <button className="btn-text sm" onClick={() => { setOrder(ROLE_LAYOUTS.admin.slice()); toast("已恢复 admin 默认布局"); }}>
                  <Icon n="reset" size={13} /> 重置为默认
                </button>
                <span className="spacer"></span>
                <button className="btn-text sm" onClick={() => setDenied(true)} style={{ color: "var(--graphite)" }}>
                  演示：无 workbench:manage 访问
                </button>
              </div>
            </div>

            {/* 右：预览 + 规则 */}
            <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
              <div className="card" style={{ padding: "20px 20px 18px" }}>
                <div className="wg-head" style={{ marginBottom: 14 }}>
                  <span className="card-title">实时预览</span>
                  <span className="help">12 栏栅格</span>
                </div>
                <div className="preview">
                  {preview.map(({ key, span }) => (
                    <div key={key} className={"pv" + (key === "alert_card" ? " warm" : "")} style={{ gridColumn: "span " + span }}>
                      {WIDGETS[key].label}
                    </div>
                  ))}
                  {preview.length === 0 ? (
                    <div className="pv off" style={{ gridColumn: "span 12" }}>未启用任何卡片</div>
                  ) : null}
                </div>
                <div className="help" style={{ marginTop: 12, lineHeight: 1.65 }}>
                  {role === "user" ? "业务员默认只有 3 个 widget：快捷入口 + 我负责的项目 + 我的待办。" : null}
                  {role === "operator" ? "获客总览在本角色落单，自动升为满宽；资金与审计对运营不可见。" : null}
                  {role === "admin" ? "资金概览与获客总览成对；审计概览落单升满宽。" : null}
                </div>
              </div>

              <div className="card" style={{ padding: "20px" }}>
                <div className="card-title">布局来源优先级</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 12 }}>
                  {[
                    { n: "1", t: "个人覆盖", d: "user_preferences · workbench.layout", on: false },
                    { n: "2", t: "角色默认", d: "system_configs · workbench_role_layouts", on: true },
                    { n: "3", t: "代码兜底", d: "WORKBENCH_ROLE_DEFAULTS", on: false },
                  ].map((s) => (
                    <div key={s.n} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span className="badge" style={{ background: s.on ? "var(--ink)" : "var(--fog)", color: s.on ? "#fff" : "var(--graphite)", minWidth: 22, justifyContent: "center", padding: "2px 8px" }}>{s.n}</span>
                      <span style={{ flex: 1 }}>
                        <span style={{ fontSize: 13.5, fontWeight: 450, display: "block" }}>{s.t}</span>
                        <span className="help mono" style={{ fontSize: 11.5 }}>{s.d}</span>
                      </span>
                    </div>
                  ))}
                </div>
                <div className="help" style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid rgba(163,166,175,.22)", lineHeight: 1.7 }}>
                  三级都必须过权限过滤；布局中出现无权限或未注册的 widget 时，后端剔除并 logger.warning，不报错（K15 / K16）。
                </div>
              </div>
            </div>
          </div>
        </React.Fragment>
      ) : null}
    </div>
  );
}

function ForbiddenCard({ onBack }) {
  return (
    <div className="card" style={{ maxWidth: 720, margin: "40px auto" }}>
      <div className="forbidden">
        <div className="empty" style={{ padding: 0 }}>
          <div className="pic" style={{ background: "var(--apricot)", color: "var(--rust)" }}><Icon n="lock" size={22} /></div>
          <div className="t">没有访问权限</div>
          <div className="d">访问工作台布局管理需要 workbench:manage 权限（仅管理员）。<br />当前账号无此权限，后端返回 403。</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, marginTop: 22 }}>
          <button className="btn-fill sm" onClick={onBack}>返回预览</button>
          <button className="btn-text sm" onClick={() => toast("设计稿演示：路由守卫 hasPathPermission 命中 workbench:manage")}>查看权限映射</button>
        </div>
      </div>
    </div>
  );
}

          </div>
        </div>
      </div>

      {/* ---- 补充口径 ---- */}
      <div className="spec-sec">
        <div className="spec-h"><h2>相对 SPEC 的补充与冲突</h2><span className="n">Fail Loud</span></div>
        <div className="cols cols-2">
          <div className="card" style={{ padding: "20px 22px" }}>
            <div className="card-title" style={{ marginBottom: 12 }}>本稿新增的设计决策</div>
            {[
              "6 栏孤儿卡自动升满宽：admin 的 audit_summary、operator 的 growth_overview 落单时占 12 栏，避免栅格空洞（渲染期计算，不改布局 JSON 的 key/order/enabled）。",
              "消息行右侧常驻微信投递状态点（绿/灰/Rust），把 K18 的 TEMPLATE_MISSING 从日志搬到用户可见处。",
              "抽屉分类 tabs 只渲染有消息的分类，避免空 tab。",
              "偏好页顶部横幅直接指出「5 个入口中 1 个模板缺失」，并把补模板的入口做成跳转。",
              "工作台页面头部显示「当前生效 N / 总数 · 来源」，让 K11 的三级 fallback 对用户可见。",
            ].map((t, i) => (
              <div className="note-item" key={i}><span className="no">{String(i + 1).padStart(2, "0")}</span><span>{t}</span></div>
            ))}
          </div>
          <div className="card" style={{ padding: "20px 22px" }}>
            <div className="card-title" style={{ marginBottom: 12 }}>⚠️ 未覆盖 / 待确认</div>
            {[
              "【数据源约束】本稿所有指标均限定为「现有业务口径已有字段」或「可由现有数据计算」，不新造数据。已按下表 5 处降级，取代原稿的虚构指标。",
              "待办卡：原「逾期/今日/本周」改为「待办项目/待办总数/P0/最深逾期」。原因：规则 R1–R9 的触发条件本身即「已过期」，仅 R10 委托期临近有未来日期，今日/本周两桶结构性恒为 0（todo_board_rules.py:365/395/424/471/502）。",
              "获客卡：原「到访转化」改为「整体转化率」（有效新客 ÷ 分享次数）。原因：业务无「到访」概念（全仓 grep=0），且 high_intent 在估价映射「已看房」、在预约/招募是「意向高」，4 模块语义不一致。渠道分布改为按 4 模块（估价/预约/房源单/招募），与 /overview/source-breakdown 一致。",
              "审计卡：原「高风险 3」改为「敏感访问」（导出/银行卡）。原因：operation_logs 无 risk_level 列（该字段只在 permissions 表）。操作分布由四分类改为按 action 原值聚合——审计只记录写操作与敏感读，普通查询不落库（routers/leads/core.py 的 log_action 为 0 处），「查询 912 条」无数据来源。",
              "快捷入口：删除「进行中 2 场」（recruit_campaigns 只有 enabled/disabled 开关，无起止时间字段）与「今日 N 项」（同待办卡原因）；「6 个入口」改「5 个」（后端仅 5 个模板 key）。",
              "operator 可见 widget：SPEC 表为 8 个，同节文字写「operator 7」。本稿按表 8 个渲染，需产品确认。",
              "事件 #6/#7/#8 本期不接触发点，仅登记 EventSpec——因此 UI 上没有「项目状态变更」「待办到期」「分享被查看」的真实消息样例。",
              "移动端未覆盖（本次仅桌面 1440+）：SPEC §12-4 的 header 铃铛落位与 Sheet 抽屉仍需 T2.8 确认。",
              "消息中心未新增侧边栏菜单项（K10）：只能经铃铛 → 查看全部进入，可发现性依赖角标。",
              "audit_summary 跳转目标必须是 /admin/audit-logs（SPEC §12-3），实现时核对一次。",
            ].map((t, i) => (
              <div className="note-item warn" key={i}><span className="no">⚠️</span><span>{t}</span></div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================================================================
   Screen bar（设计稿控件，非产品 UI）
   ================================================================ */
const SCREENS = [
  { id: "dashboard", n: "01", label: "角色工作台" },
  { id: "drawer", n: "02", label: "消息抽屉" },
  { id: "notifications", n: "03", label: "消息中心" },
  { id: "preferences", n: "04", label: "消息偏好" },
  { id: "layout", n: "05", label: "工作台布局管理" },
  { id: "spec", n: "06", label: "规范" },
];

/* ================================================================
   设计说明面板
   ================================================================ */
const NOTES = [
  ["01", "视觉严格遵循 /DESIGN.md：Fog 侧栏 240px 无描边、24px 圆角卡 + 三层签名阴影、Ink #17191c 唯一填充按钮、Rust 只作暖强调、状态一律单色洗底药丸。"],
  ["02", "页头 h1 用 Signifier 44px（Source Serif 4），副标题 15px Graphite；正文 Sohne 替代 Inter，字距 -0.009em。"],
  ["03", "铃铛落在 SidebarFooter 内、折叠按钮之下、头像之上；折叠态只留图标（本稿桌面展开态）。角标 Ink 实底，>99 显示 99+，0 时不渲染。"],
  ["04", "工作台用 12 栏栅格，span 由注册表决定；每张卡独立 Suspense，禁止顶层串行 await（C9 / A11）。"],
  ["05", "视角切换器是设计稿控件：admin 10 / operator 8 / user 3，切换即换布局并换侧边栏菜单可见性。"],
  ["06", "定制器只做「显示/隐藏 + 上移下移 + 重置」，不做拖拽自由布局（Out of Scope），并显示来源=个人覆盖。"],
  ["07", "消息中心与抽屉共用同一套消息行组件；未读=实心底+圆点，已读降权为 430 字重 + Ash 色。"],
  ["08", "偏好页把 K5/K18 变成可见规则：system/security 加锁图标 + 不可关闭徽章；模板缺失的微信开关置灰并给补链。"],
  ["09", "布局管理页含实时 12 栏预览与「来源优先级」说明，让 K11/K15/K16 对管理员可解释。"],
  ["10", "规范屏把 12 条事件字典与 12 个 widget 矩阵摆成可核对表，并把本稿对 SPEC 的补充与冲突单列（Fail Loud）。"],
];
function NotesPanel() {
  const [show, setShow] = useState(false);
  return (
    <React.Fragment>
      <button className="notes-fab" onClick={() => setShow(!show)} title="设计说明">{show ? "✕" : "注"}</button>
      {show ? (
        <div className="notes-panel">
          <h3>设计说明</h3>
          <p className="sub">迭代二 · 统一消息中心 + 角色化工作台 · 相对 SPEC 的 10 个设计决策</p>
          {NOTES.map(([no, txt]) => (
            <div className="note-item" key={no}><span className="no">{no}</span><span>{txt}</span></div>
          ))}
        </div>
      ) : null}
    </React.Fragment>
  );
}

/* ================================================================
   App
   ================================================================ */
function App() {
  const [route, setRoute] = useState("dashboard");
  const [role, setRole] = useState("admin");
  const [czOpen, setCzOpen] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const timer = useRef(null);

  const [layouts, setLayouts] = useState(() => {
    const o = {};
    Object.keys(ROLE_LAYOUTS).forEach((r) => {
      o[r] = ROLE_LAYOUTS[r].map((k) => ({ key: k, enabled: true }));
    });
    return o;
  });

  useEffect(() => {
    const h = (e) => {
      setToastMsg(e.detail);
      clearTimeout(timer.current);
      timer.current = setTimeout(() => setToastMsg(null), 2400);
    };
    window.addEventListener("d-toast", h);
    return () => window.removeEventListener("d-toast", h);
  }, []);

  /* 侧边栏导航：仅本稿覆盖的路由可达，其余给说明 toast */
  const onNavigate = (id) => {
    if (id === "dashboard") { setRoute("dashboard"); return; }
    if (id === "settings") {
      if (role === "admin") setRoute("layout");
      else toast("设计稿演示：运营账号无 workbench:manage");
      return;
    }
    if (id === "audit" && role === "admin") { toast("设计稿演示：/admin/audit-logs 不在本次设计范围"); return; }
    toast("设计稿演示：「" + (ROLE_META[role].name) + "」视角 · 该模块不在本次设计范围");
  };

  const toggleBell = () => setRoute(route === "drawer" ? "dashboard" : "drawer");

  const screens = {
    dashboard: (
      <WorkbenchScreen
        role={role} setRole={setRole} layouts={layouts} setLayouts={setLayouts}
        czOpen={czOpen} setCzOpen={setCzOpen} go={onNavigate}
      />
    ),
    drawer: (
      <DrawerScreen
        role={role} setRole={setRole} layouts={layouts} setLayouts={setLayouts}
        go={() => setRoute("notifications")} onClose={() => setRoute("dashboard")}
      />
    ),
    notifications: <NotificationsScreen go={(id) => setRoute(id === "preferences" ? "preferences" : "dashboard")} />,
    preferences: <PreferencesScreen go={() => setRoute("notifications")} />,
    layout: <AdminLayoutScreen />,
    spec: <SpecScreen />,
  };

  return (
    <div className="app">
      <Sidebar
        route={route === "drawer" ? "dashboard" : route === "layout" ? "settings" : route}
        go={() => {}}
        role={role}
        bellOpen={route === "drawer"}
        toggleBell={toggleBell}
        onNavigate={onNavigate}
      />
      <main className="main">{screens[route] || screens.dashboard}</main>

      {czOpen && route === "dashboard" ? (
        <Customizer layouts={layouts} setLayouts={setLayouts} role={role} onClose={() => setCzOpen(false)} />
      ) : null}

      <NotesPanel />

      <div className="scr-bar" role="navigation" aria-label="设计稿屏幕导航">
        <span className="lbl">设计稿 · 6 屏</span>
        {SCREENS.map((s) => (
          <button key={s.id} className={route === s.id ? "on" : ""} onClick={() => { setRoute(s.id); setCzOpen(false); }}>
            {s.n} {s.label}
          </button>
        ))}
      </div>

      {toastMsg ? <div className="toast">{toastMsg}</div> : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
