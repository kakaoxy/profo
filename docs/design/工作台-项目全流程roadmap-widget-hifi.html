<!--
  ============================================================
  工作台新 Widget · 项目全流程 Roadmap · 高保真设计稿
  ============================================================
  覆盖 3 屏：
    01 /admin                 工作台内嵌（新 widget 位于 KPI 行之后，span 12）
    02 组件特写               默认 / 全部 / 筛选 / 缩放 / 悬停 / 状态矩阵
    03 规范                   数据映射、注册表、交互、状态、可访问性、待确认

  数据口径（与现有业务字段完全一致，不新造字段）：
    签约 = project_contracts.signing_date             → ProjectResponse.signing_date
    交房 = project_contracts.planned_handover_date    → ProjectResponse.planned_handover_date
           （项目详情页「关键日期」在 sold 视图即展示为「交房」；HandoverDialog
            确认交房时会回写该字段，因此它也是实际交房日）
    上架 = project_sales.listing_date                 → ProjectResponse.listing_date
    成交 = project_sales.sold_date                    → ProjectResponse.sold_date
    当前阶段 = ProjectStatus（signing / renovating / selling / sold）

  视觉：严格遵循 /DESIGN.md（Steep），复用 docs/design/迭代二-消息中心-角色工作台-hifi.html
        的令牌、侧栏与 widget 语言。四阶段颜色全部取自既有色板：
        签约 Sky Wash / 交房 Apricot Wash / 上架 Ink / 成交 Rust，不新增色值。

  演示基准日：2026-10-30（稿内「今天」虚线固定在此日，真实实现取系统当天）。

  技术形态：单文件自包含 HTML + React 18（CDN，Babel 内联转译）。
  ⚠️ 设计稿交付物，有意单文件不拆分。
  ============================================================
-->

<style>
  /* ============ 1. Steep tokens（对齐 /DESIGN.md 与 globals.css） ============ */
  :root {
    --ink: #17191c;
    --pwhite: #ffffff;
    --fog: #f7f7f8;
    --ash: #4c4c4c;
    --graphite: #777b86;
    --dove: #a3a6af;
    --slate: #8b8c8d;
    --rust: #5d2a1a;
    --apricot: #fbe1d1;
    --sky: #d3e3fc;
    --blue: #4a90e2;
    --pos: #ef4444;
    --neg: #10b981;
    --font-display: "Source Serif 4", "Songti SC", "Noto Serif SC", serif;
    --font-ui: "Inter", -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    --r-card: 24px; --r-img: 12px; --r-input: 16px; --r-pill: 9999px;
    --shadow-steep: rgba(4,23,43,.05) 0 0 0 1px, rgba(0,0,0,.1) 0 20px 25px -5px, rgba(0,0,0,.1) 0 8px 10px -6px;
    --shadow-steep-sm: rgba(4,23,43,.05) 0 0 0 1px, rgba(0,0,0,.06) 0 10px 20px -8px, rgba(0,0,0,.05) 0 3px 6px -4px;
    --sidebar-w: 240px;
    /* 阶段色（全部来自既有色板） */
    --st-sign: #d3e3fc;
    --st-handover: #fbe1d1;
    --st-listing: #17191c;
    --st-sold: #5d2a1a;
    --st-sign-deep: #8fb3e8;
    --st-handover-deep: #e6a877;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    font-family: var(--font-ui);
    font-size: 15px; color: var(--ink);
    letter-spacing: -0.009em;
    background: var(--fog);
    min-width: 1180px;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; letter-spacing: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  .tnum { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ============ 2. 全局骨架 ============ */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
    background: var(--fog); display: flex; flex-direction: column;
    padding: 20px 14px 16px; z-index: 40;
    overflow: hidden; white-space: nowrap;
  }
  .main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; }
  .side-logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
  .side-logo .mark {
    width: 30px; height: 30px; border-radius: 9px; background: var(--ink);
    color: #fff; font-size: 15px; font-weight: 600; letter-spacing: 0;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .side-logo .word { font-size: 16px; font-weight: 500; }
  .side-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; margin: 0 -6px; padding: 0 6px; }
  .side-scroll::-webkit-scrollbar { width: 4px; }
  .side-scroll::-webkit-scrollbar-thumb { background: rgba(163,166,175,.35); border-radius: 4px; }
  .nav-group-label {
    font-size: 12px; font-weight: 500; color: var(--graphite);
    letter-spacing: .06em; padding: 16px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 8px 12px; border-radius: 12px; font-size: 14.5px; font-weight: 450;
    color: var(--ink); transition: background .15s; position: relative;
  }
  .nav-item:hover { background: rgba(23,25,28,.05); }
  .nav-item.active { background: var(--pwhite); box-shadow: var(--shadow-steep-sm); }
  .nav-item .ic { color: var(--graphite); display: flex; flex: none; }
  .nav-item.active .ic { color: var(--ink); }
  .side-foot { padding-top: 12px; border-top: 1px solid rgba(163,166,175,.25); margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
  .side-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; width: 100%; }
  .side-user:hover { background: rgba(23,25,28,.05); }
  .side-user .info { text-align: left; line-height: 1.25; }
  .side-user .info .n { font-size: 13.5px; font-weight: 500; }
  .side-user .info .r { font-size: 11.5px; color: var(--graphite); }
  .avatar {
    width: 30px; height: 30px; border-radius: var(--r-pill); flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500; color: var(--ink);
  }
  .av-2 { background: var(--sky); }
  .bell-btn {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 8px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 450;
    color: var(--ash); transition: background .15s, color .15s; position: relative;
  }
  .bell-btn:hover { background: rgba(23,25,28,.05); color: var(--ink); }
  .bell-btn .ic { color: var(--graphite); display: flex; flex: none; }
  .bell-badge {
    margin-left: auto; background: var(--ink); color: #fff; border-radius: var(--r-pill);
    min-width: 20px; height: 20px; padding: 0 6px; font-size: 11.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
  }
  .collapse-btn {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 8px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 450;
    color: var(--graphite); transition: background .15s, color .15s;
  }
  .collapse-btn:hover { background: rgba(23,25,28,.05); color: var(--ink); }

  /* ============ 3. 页面通用 ============ */
  .page { max-width: 1480px; margin: 0 auto; padding: 34px 44px 118px; animation: pageIn .34s ease both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
  .page-head h1 {
    font-family: var(--font-display); font-weight: 400; font-size: 44px;
    line-height: 1.1; letter-spacing: -0.015em; color: var(--ink);
  }
  .page-head .desc { margin-top: 10px; font-size: 15px; color: var(--graphite); max-width: 760px; line-height: 1.55; }
  .page-head .aside { display: flex; align-items: center; gap: 14px; padding-bottom: 6px; flex: none; }
  .sec-title { font-size: 21px; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 34px 0 16px; }
  .sec-link { font-size: 14px; font-weight: 450; color: var(--ink); display: inline-flex; align-items: center; gap: 4px; }
  .sec-link:hover { color: var(--rust); }
  .help { font-size: 12.5px; color: var(--graphite); }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: .86em; letter-spacing: 0; }
  .dv-chip {
    font-size: 10.5px; letter-spacing: .08em; color: var(--graphite); background: #fff;
    border: 1px solid rgba(163,166,175,.4); padding: 3px 8px; border-radius: 999px; text-transform: uppercase;
  }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 12.5px; color: var(--graphite); flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }

  .btn-fill {
    background: var(--ink); color: #fff; border-radius: var(--r-pill);
    padding: 9px 20px; font-size: 14px; font-weight: 450;
    transition: transform .16s, box-shadow .16s;
  }
  .btn-fill:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -8px rgba(23,25,28,.5); }
  .btn-text { font-size: 14px; font-weight: 450; color: var(--ink); display: inline-flex; align-items: center; gap: 5px; padding: 4px 2px; }
  .btn-text:hover { color: var(--rust); }
  .btn-text.sm { font-size: 12.5px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 10px; background: #fff;
    box-shadow: var(--shadow-steep-sm); display: inline-flex; align-items: center; justify-content: center; color: var(--graphite);
  }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn.plain { box-shadow: none; background: none; }
  .icon-btn.plain:hover { background: var(--fog); }

  /* ============ 4. 工作台栅格 + widget ============ */
  .wb-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
  .wb { grid-column: span 12; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .wb.sp3 { grid-column: span 3; }
  .wb.sp6 { grid-column: span 6; }
  .wg { background: var(--pwhite); border-radius: var(--r-card); box-shadow: var(--shadow-steep-sm); padding: 20px 22px; flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .wg.warm { background: var(--apricot); box-shadow: none; }
  .wg.warm .wg-title { color: var(--rust); }
  .wg.warm .sec-link { color: var(--rust); }
  .wg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 2px; }
  .wg-title { font-size: 15px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 7px; }
  .wg-sub { font-size: 12px; color: var(--graphite); font-weight: 430; }
  .kpi-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 14px; margin-top: 18px; }
  .kpi-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
  .kpi-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 18px; }
  .wg-split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; margin-top: 18px; }
  .wg-split .kpi-3, .wg-split .mini-list, .wg-split .spark { margin-top: 0; }
  .wg-split.narrow-right { grid-template-columns: 3fr 2fr; }
  .kpi .k { font-size: 12.5px; color: var(--graphite); display: flex; align-items: center; gap: 6px; }
  .kpi .v { font-size: 26px; font-weight: 480; color: var(--ink); margin-top: 5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi .v.lg { font-size: 32px; }
  .kpi .v .unit { font-size: 12px; font-weight: 430; color: var(--graphite); margin-left: 3px; letter-spacing: 0; }
  .kpi .d { font-size: 11.5px; color: var(--graphite); margin-top: 7px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .funnel { display: flex; flex-direction: column; gap: 11px; margin-top: 16px; }
  .f-row { display: flex; align-items: center; gap: 10px; }
  .f-row .fl { width: 56px; font-size: 12.5px; color: var(--graphite); flex: none; text-align: right; }
  .f-bar { height: 9px; border-radius: var(--r-pill); flex: 1; background: var(--fog); overflow: hidden; }
  .f-bar i { display: block; height: 100%; border-radius: var(--r-pill); }
  .f-row .fv { width: 30px; font-size: 13px; font-weight: 480; text-align: right; font-variant-numeric: tabular-nums; }
  .alert-num { font-family: var(--font-display); font-size: 52px; line-height: 1; color: var(--rust); margin-top: 14px; }
  .alert-note { font-size: 13px; color: var(--rust); opacity: .82; margin-top: 10px; line-height: 1.5; }
  .todo-rows { display: flex; flex-direction: column; margin-top: 8px; }
  .todo-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(163,166,175,.18); }
  .todo-row:last-child { border-bottom: none; padding-bottom: 0; }
  .todo-row .nm { font-size: 13.5px; font-weight: 450; }
  .todo-row .due { margin-left: auto; flex: none; font-size: 11.5px; color: var(--graphite); text-align: right; padding-top: 2px; }
  .todo-row .due.late { color: var(--rust); font-weight: 450; }
  .spark { display: flex; align-items: flex-end; gap: 4px; height: 40px; margin-top: 16px; }
  .spark i { flex: 1; background: var(--sky); border-radius: 4px 4px 2px 2px; display: block; }
  .spark i.hot { background: var(--rust); }
  .spark-x { display: flex; gap: 4px; margin-top: 7px; }
  .spark-x span { flex: 1; text-align: center; font-size: 10.5px; color: var(--dove); }
  .mini-list { display: flex; flex-direction: column; margin-top: 8px; }
  .mini-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(163,166,175,.18); }
  .mini-row:last-child { border-bottom: none; }
  .mini-row .nm { font-size: 13.5px; font-weight: 450; display: block; }
  .mini-row .meta { font-size: 11.5px; color: var(--graphite); margin-top: 2px; display: block; }
  .mini-row .rt { margin-left: auto; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ash); }
  .money-pos { color: var(--pos); }
  .money-neg { color: var(--neg); }
  .monitor-row { display: flex; gap: 14px; overflow-x: auto; padding: 14px 2px 4px; }
  .monitor-row::-webkit-scrollbar { height: 6px; }
  .monitor-row::-webkit-scrollbar-thumb { background: rgba(163,166,175,.4); border-radius: 6px; }
  .m-card { width: 254px; flex: none; background: var(--fog); border-radius: 18px; padding: 16px 18px; }
  .m-card .m-no { display: flex; align-items: center; justify-content: space-between; }
  .m-card .no { font-size: 11.5px; color: var(--graphite); }
  .m-card .m-name { font-size: 16px; font-weight: 500; margin-top: 10px; letter-spacing: -0.01em; }
  .m-card .m-addr { font-size: 12px; color: var(--graphite); margin-top: 3px; }
  .m-card .m-div { border-top: 1px dashed rgba(163,166,175,.5); margin: 12px 0 10px; }
  .m-card .m-feed { font-size: 12.5px; color: var(--ash); line-height: 1.55; }
  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; margin-top: 6px; }
  .q-row { display: flex; align-items: center; gap: 11px; padding: 10px 2px; border-bottom: 1px solid rgba(163,166,175,.18); }
  .q-row .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--fog); color: var(--ash); display: flex; align-items: center; justify-content: center; flex: none; }
  .q-row:hover .ic { background: var(--ink); color: #fff; }
  .q-row .nm { font-size: 13.5px; font-weight: 450; display: block; }
  .q-row .meta { font-size: 11.5px; color: var(--graphite); margin-top: 2px; display: block; }
  .q-row .go { margin-left: auto; color: var(--dove); display: flex; }
  .tbl-card { padding: 6px 8px; overflow: hidden; }
  table.tbl { width: 100%; border-collapse: collapse; }
  .tbl th {
    text-align: left; font-size: 12.5px; font-weight: 500; color: var(--graphite);
    letter-spacing: .02em; padding: 14px 14px 10px; border-bottom: 1px solid rgba(163,166,175,.35);
    white-space: nowrap;
  }
  .tbl td {
    font-size: 13.5px; color: var(--ink); padding: 12px 14px;
    border-bottom: 1px solid rgba(163,166,175,.18); vertical-align: middle;
  }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr:hover td { background: rgba(247,247,248,.7); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; border-radius: var(--r-pill);
    font-size: 12.5px; font-weight: 450; padding: 3.5px 11px; line-height: 1.35;
    white-space: nowrap; flex: none;
  }
  .b-sky { background: var(--sky); color: var(--ink); }
  .b-apricot { background: var(--apricot); color: var(--rust); }
  .b-ink { background: var(--ink); color: #fff; }
  .b-fog { background: var(--fog); color: var(--graphite); }
  .b-outline { background: var(--pwhite); color: var(--ink); box-shadow: inset 0 0 0 1px var(--dove); }
  .b-ghost { background: rgba(23,25,28,.045); color: var(--graphite); font-size: 11.5px; padding: 2px 8px; }
  .empty { text-align: center; padding: 44px 0 40px; }
  .empty .pic { width: 52px; height: 52px; border-radius: 16px; background: var(--fog); color: var(--dove); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .empty .t { font-size: 14px; font-weight: 480; }
  .empty .d { font-size: 12.5px; color: var(--graphite); margin-top: 6px; }

  /* ============ 5. Roadmap widget ============ */
  .rm-new {
    font-size: 10.5px; font-weight: 500; letter-spacing: .04em; color: var(--rust);
    background: var(--apricot); border-radius: var(--r-pill); padding: 2px 7px;
  }
  .rm-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0 8px; }
  .rm-tools .spacer { flex: 1; }
  .rm-legend { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .rm-chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: var(--r-pill);
    background: var(--fog); font-size: 12px; color: var(--ash);
    box-shadow: inset 0 0 0 1px transparent; transition: background .14s, box-shadow .14s, color .14s;
  }
  .rm-chip:hover { background: #fff; box-shadow: var(--shadow-steep-sm); color: var(--ink); }
  .rm-chip.on { background: #fff; box-shadow: var(--shadow-steep-sm); color: var(--ink); font-weight: 480; }
  .rm-chip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .rm-chip[data-stage="sign"] .sw { background: var(--st-sign); box-shadow: inset 0 0 0 1px rgba(23,25,28,.08); }
  .rm-chip[data-stage="handover"] .sw { background: var(--st-handover); box-shadow: inset 0 0 0 1px rgba(93,42,26,.12); }
  .rm-chip[data-stage="listing"] .sw { background: var(--st-listing); }
  .rm-chip[data-stage="sold"] .sw { background: var(--st-sold); border-radius: 50%; }
  .rm-chip .c { color: var(--dove); font-variant-numeric: tabular-nums; }
  .rm-view { display: inline-flex; background: var(--fog); border-radius: var(--r-pill); padding: 3px; flex: none; }
  .rm-view button { padding: 5px 11px; border-radius: var(--r-pill); font-size: 12px; color: var(--graphite); white-space: nowrap; }
  .rm-view button:hover { color: var(--ink); }
  .rm-view button.on { background: #fff; color: var(--ink); font-weight: 480; box-shadow: var(--shadow-steep-sm); }
  .rm-zoom { display: inline-flex; align-items: center; gap: 4px; background: var(--fog); border-radius: var(--r-pill); padding: 3px 4px 3px 3px; flex: none; }
  .rm-zoom button { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; color: var(--graphite); }
  .rm-zoom button:hover { background: #fff; color: var(--ink); }
  .rm-zoom input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 68px; height: 3px; border-radius: 3px;
    background: rgba(163,166,175,.42); outline: none; cursor: pointer;

  calendar: <><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></>,
};
function Icon({ n, size = 17, sw = 1.7, style, className }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={style} className={className} aria-hidden="true">

}

/* ================================================================
   日期工具 / 阶段定义
   ================================================================ */
const DAY = 86400000;
const TODAY = "2026-10-30";
const BASE_PPD = 2.6;
const LEFT_COL = 208;
const STAGE_ORDER = ["sign", "handover", "listing", "sold"];
const STAGE = {
  sign: { label: "签约", full: "签约中", color: "var(--st-sign)", deep: "var(--st-sign-deep)", bar: "sign" },
  handover: { label: "交房", full: "交房中", color: "var(--st-handover)", deep: "var(--st-handover-deep)", bar: "handover" },
  listing: { label: "上架", full: "在售", color: "var(--st-listing)", deep: "var(--st-listing)", bar: "listing" },
  sold: { label: "成交", full: "已成交", color: "var(--st-sold)", deep: "var(--st-sold)", bar: "sold" },
};
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function parseDay(s) {
  const [y, m, d] = s.split("-").map(Number);
  return Date.UTC(y, m - 1, d);
}
function dayToStr(t) {
  const d = new Date(t);
  return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
}
function addDays(s, n) { return dayToStr(parseDay(s) + n * DAY); }
function daysBetween(a, b) { return Math.round((parseDay(b) - parseDay(a)) / DAY); }
function fmtDot(s) { return s ? s.replace(/-/g, ".") : "—"; }
function minDate(list) { return list.slice().sort((a, b) => parseDay(a) - parseDay(b))[0]; }
function maxDate(list) { return list.slice().sort((a, b) => parseDay(b) - parseDay(a))[0]; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function stageOf(p) {
  if (p.sold) return "sold";
  if (p.list) return "listing";
  if (p.hand && p.hand <= TODAY) return "handover";
  return "sign";
}
function statusText(p) {
  const s = stageOf(p);
  if (s === "sign") return "签约中 · " + daysBetween(p.sign, TODAY) + " 天";
  if (s === "handover") return "交房中 · " + daysBetween(p.hand, TODAY) + " 天";
  if (s === "listing") return "在售 · " + daysBetween(p.list, TODAY) + " 天";
  return "已成交 · 全程 " + daysBetween(p.sign, p.sold) + " 天";
}
function segmentsOf(p) {
  const segs = [];
  const push = (stage, start, end) => {
    if (!start || !end) return;
    if (daysBetween(start, end) <= 0) return;
    segs.push({ stage, start, end });
  };
  const end1 = p.hand || p.list || p.sold || TODAY;
  push("sign", p.sign, end1);
  if (p.hand) push("handover", p.hand, p.list || p.sold || TODAY);
  if (p.list) push("listing", p.list, p.sold || TODAY);
  return segs;
}

/* ================================================================
   Roadmap Widget
   ================================================================ */
function RoadmapTip({ p, x, y }) {
  const s = stageOf(p);
  const H = 198;
  const left = Math.min(window.innerWidth - 320, Math.max(12, x + 14));
  let top = y + 18;
  if (top + H > window.innerHeight - 12) top = y - H - 14;
  top = Math.min(window.innerHeight - H - 12, Math.max(12, top));
  const delta = (a, b) => (a && b ? daysBetween(a, b) + " 天" : "—");
  const rows = [
    { k: "sign", label: "签约", d: p.sign, g: delta(p.sign, p.hand || p.list || p.sold) },
    { k: "handover", label: "交房", d: p.hand, g: delta(p.hand, p.list || p.sold) },
    { k: "listing", label: "上架", d: p.list, g: delta(p.list, p.sold) },
    { k: "sold", label: "成交", d: p.sold, g: p.sold ? "全程 " + daysBetween(p.sign, p.sold) + " 天" : "—" },
  ];
  return (
    <div className="rm-tip" role="tooltip" style={{ left, top }}>
      <div className="t-head">
        <div>
          <div className="t-name">{p.name} {p.bld}</div>
          <div className="t-bld">负责人 {p.mgr} · 点击查看项目详情</div>
        </div>

          style={{ fontSize: 11, padding: "2.5px 9px" }}>{STAGE[s].label}</span>
      </div>
      <div className="t-dates">
        {rows.map((r) => (
          <React.Fragment key={r.k}>
            <span className="l"><i className="d" style={{ background: STAGE[r.k].color, boxShadow: r.k === "sign" ? "inset 0 0 0 1px rgba(23,25,28,.08)" : "none" }}></i>{r.label}</span>
            <span className="v">{fmtDot(r.d)}</span>
            <span className="g">{r.g}</span>
          </React.Fragment>
        ))}
      </div>
      <div className="t-foot">
        <span>签约价 <b>{p.signPrice} 万</b></span>

      </div>
    </div>
  );
}

function RoadmapWidget({ annotate, initialView }) {
  const [view, setView] = React.useState(initialView || "recent");
  const [filter, setFilter] = React.useState(null);
  const [zoom, setZoom] = React.useState(1);
  const [tip, setTip] = React.useState(null);
  const scrollRef = React.useRef(null);
  const prevPpd = React.useRef(BASE_PPD);
  const ppd = BASE_PPD * zoom;

  const baseRows = view === "recent" ? PROJECTS.slice(0, 10) : PROJECTS;
  const counts = {};
  STAGE_ORDER.forEach((k) => { counts[k] = baseRows.filter((p) => stageOf(p) === k).length; });
  const rows = filter ? baseRows.filter((p) => stageOf(p) === filter) : baseRows;

  const domain = React.useMemo(() => {
    if (!baseRows.length) return { start: addDays(TODAY, -30), end: addDays(TODAY, 30) };
    const starts = baseRows.map((p) => p.sign).filter(Boolean);
    const ends = baseRows.map((p) => p.sold || p.hand || p.list || TODAY);
    ends.push(TODAY);
    return { start: addDays(minDate(starts), -14), end: addDays(maxDate(ends), 21) };
  }, [view]);

  const totalDays = Math.max(1, daysBetween(domain.start, domain.end));
  const plotW = Math.round(totalDays * ppd) + 24;
  const lastEnd = maxDate(baseRows.map((p) => p.sold || p.hand || p.list || TODAY).concat(TODAY));
  const lastX = daysBetween(domain.start, lastEnd) * ppd;
  const xOf = (d) => daysBetween(domain.start, d) * ppd;
  const todayX = xOf(TODAY);

  /* 月份刻度：按缩放级别决定标签密度 */
  const ticks = React.useMemo(() => {
    const out = [];
    const end = parseDay(domain.end);
    let y = new Date(parseDay(domain.start)).getUTCFullYear();
    let m = new Date(parseDay(domain.start)).getUTCMonth();
    let t = Date.UTC(y, m, 1);
    if (t < parseDay(domain.start)) {
      m += 1;
      if (m > 11) { m = 0; y += 1; }
      t = Date.UTC(y, m, 1);
    }
    const step = ppd >= 2.2 ? 1 : ppd >= 1.15 ? 3 : 6;
    while (t <= end) {
      out.push({ t, y, m, show: m % step === 0 });
      m += 1;
      if (m > 11) { m = 0; y += 1; }
      t = Date.UTC(y, m, 1);
    }
    return out;
  }, [domain.start, domain.end, ppd]);

  const years = React.useMemo(() => {
    const seen = {};
    const ys = [];
    ticks.forEach((t) => {
      if (!seen[t.y]) {
        seen[t.y] = true;
        ys.push({ t: t.t, y: t.y });
      }
    });
    if (!ys.length) {
      ys.push({ t: parseDay(domain.start), y: new Date(parseDay(domain.start)).getUTCFullYear() });
    }
    return ys;
  }, [ticks, domain.start]);

  /* 初始对齐：最新内容能完整看到就从左侧起，否则滚到最右（最新） */
  React.useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const id = requestAnimationFrame(() => {
      const viewport = el.clientWidth - LEFT_COL;
      el.scrollLeft = lastX > viewport - 12 ? el.scrollWidth : 0;
    });
    return () => cancelAnimationFrame(id);
  }, [view]);

  /* 缩放保持中心日期 */
  React.useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const viewport = Math.max(120, el.clientWidth - LEFT_COL);
    const centerDays = (el.scrollLeft + viewport / 2) / prevPpd.current;
    el.scrollLeft = Math.max(0, centerDays * ppd - viewport / 2);
    prevPpd.current = ppd;
  }, [ppd]);

  const bumpZoom = (d) => setZoom((z) => clamp(Math.round((z + d) * 100) / 100, 0.35, 3));
  const fitZoom = () => {
    const el = scrollRef.current;
    if (!el) return;
    const avail = Math.max(160, el.clientWidth - LEFT_COL - 12);
    const z = clamp((avail / totalDays) / BASE_PPD, 0.35, 3);
    setZoom(z);
    requestAnimationFrame(() => { if (scrollRef.current) scrollRef.current.scrollLeft = 0; });
  };

  const onRowEnter = (e, p) => setTip({ p, x: e.clientX, y: e.clientY });
  const onRowMove = (e, p) => setTip({ p, x: e.clientX, y: e.clientY });

  const anno = (n) => annotate ? <span className="anno">{n}</span> : null;

  return (
    <section className="wg" aria-label="项目全流程 roadmap">
      <div className="wg-head">
        <span className="wg-title">
          项目全流程
          {annotate ? <span className="anno">1</span> : <span className="rm-new">新增</span>}
          <span className="wg-sub">签约 → 交房 → 上架 → 成交</span>
          <span className="badge b-ghost" style={{ marginLeft: 2 }}>{baseRows.length} 个项目</span>
        </span>
        <button className="sec-link" onClick={() => toast("设计稿演示：跳转 /admin/projects")}>
          项目列表 <Icon n="arrowRight" size={12} />
        </button>
      </div>

      <div className="rm-tools">
        {annotate ? <span className="anno" style={{ marginRight: -4 }}>3</span> : null}
        <div className="rm-legend" role="group" aria-label="阶段筛选">
          {STAGE_ORDER.map((k) => (
            <button
              key={k}
              className={"rm-chip" + (filter === k ? " on" : "")}
              data-stage={k}
              aria-pressed={filter === k}
              onClick={() => setFilter(filter === k ? null : k)}
              title={"只看当前处于「" + STAGE[k].label + "」的项目"}
            >
              <i className="sw"></i>{STAGE[k].label}<span className="c">{counts[k]}</span>
            </button>
          ))}
        </div>
        <span className="spacer"></span>
        {annotate ? <span className="anno" style={{ marginRight: -4 }}>2</span> : null}
        <div className="rm-view" role="group" aria-label="显示范围">
          <button className={view === "recent" ? "on" : ""} onClick={() => setView("recent")} aria-pressed={view === "recent"}>最新 10</button>
          <button className={view === "all" ? "on" : ""} onClick={() => setView("all")} aria-pressed={view === "all"}>全部 {PROJECTS.length}</button>
        </div>
        {annotate ? <span className="anno" style={{ marginLeft: -4, marginRight: -4 }}>4</span> : null}
        <div className="rm-zoom" role="group" aria-label="时间轴缩放">
          <button onClick={() => bumpZoom(-0.1)} aria-label="缩小时间轴"><Icon n="minus" size={14} /></button>
          <input
            type="range" min="35" max="300" step="5" value={Math.round(zoom * 100)}
            onChange={(e) => setZoom(Number(e.target.value) / 100)}
            aria-label={"时间轴缩放 " + Math.round(zoom * 100) + "%"}
          />
          <button onClick={() => bumpZoom(0.1)} aria-label="放大时间轴"><Icon n="plus" size={14} /></button>
          <span className="pct">{Math.round(zoom * 100)}%</span>
          <button className="fit" onClick={fitZoom}>适应</button>
        </div>
      </div>

      <div
        className="rm-scroll"
        ref={scrollRef}
        tabIndex={0}
        role="region"
        aria-label={"项目生命周期时间轴，共 " + rows.length + " 个项目；可横向滚动，方向键平移"}
        onScroll={() => { if (tip) setTip(null); }}
        onKeyDown={(e) => {
          if (e.key === "ArrowRight") { e.currentTarget.scrollLeft += 80; }
          if (e.key === "ArrowLeft") { e.currentTarget.scrollLeft -= 80; }
        }}
      >
        <div className="rm-inner" style={{ minWidth: LEFT_COL + plotW }}>
          <div className="rm-axis">
            <div className="rm-corner">
              <span>项目 / 当前阶段</span>
              <span style={{ color: "var(--dove)" }}>今天 {fmtDot(TODAY).slice(5)}</span>
            </div>
            <div className="rm-axis-track" style={{ width: plotW }}>
              {years.map((y, i) => (
                <span key={"y" + i} className="rm-year" style={{ left: Math.max(2, xOf(dayToStr(y.t)) + 3) }}>{y.y}</span>
              ))}
              {ticks.filter((t) => t.show).map((t, i) => (
                <span key={"m" + i} className="rm-month" style={{ left: Math.max(2, xOf(dayToStr(t.t)) + 2) }}>{t.m + 1}月</span>
              ))}
              <span className="rm-today-tick" style={{ left: todayX }}></span>
            </div>
          </div>

          <div className="rm-body">
            <div className="rm-grid" style={{ left: LEFT_COL, width: plotW }} aria-hidden="true">
              {ticks.map((t, i) => (
                <span key={"g" + i} className={"rm-gl" + (t.m === 0 ? " year" : "")} style={{ left: xOf(dayToStr(t.t)) }}></span>
              ))}
              <span className="rm-today-line" style={{ left: todayX }}></span>
            </div>

            {rows.map((p, rowIndex) => {
              const s = stageOf(p);
              const segs = segmentsOf(p);
              return (
                <div
                  key={p.id}
                  className="rm-row"
                  role="button"
                  tabIndex={0}
                  aria-label={p.name + " " + p.bld + "，当前" + STAGE[s].label + "；签约 " + fmtDot(p.sign) + "，交房 " + fmtDot(p.hand) + "，上架 " + fmtDot(p.list) + "，成交 " + fmtDot(p.sold)}
                  onMouseEnter={(e) => onRowEnter(e, p)}
                  onMouseMove={(e) => onRowMove(e, p)}
                  onMouseLeave={() => setTip(null)}
                  onFocus={(e) => {
                    const r = e.currentTarget.getBoundingClientRect();
                    setTip({ p, x: r.left + 240, y: r.top + 18 });
                  }}
                  onBlur={() => setTip(null)}
                  onClick={() => toast("设计稿演示：跳转 /admin/projects/" + p.id)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toast("设计稿演示：跳转 /admin/projects/" + p.id); }
                  }}
                >
                  <div className="rm-label">
                    <div className="rm-name-line">
                      <span className="rm-name">{p.name}</span>
                      <span className="rm-bld">{p.bld}</span>
                      {annotate && rowIndex === 0 ? <span className="anno" style={{ marginLeft: "auto" }}>5</span> : null}
                    </div>
                    <div className="rm-meta" data-stage={s}>
                      <i className="d"></i>
                      <span>{statusText(p)}</span>
                    </div>
                  </div>
                  <div className="rm-track" style={{ width: plotW }}>
                    {segs.map((seg, i) => {
                      const color = STAGE[seg.stage];
                      const a = xOf(seg.start);
                      const b = xOf(seg.end);
                      const hasFuture = seg.end > TODAY;
                      const solidEnd = hasFuture ? TODAY : seg.end;
                      const nodes = [];
                      if (seg.start <= TODAY && solidEnd > seg.start) {
                        const w = Math.max(2, xOf(solidEnd) - a - 2);
                        const live = hasFuture || (s !== "sold" && seg.end >= TODAY);
                        nodes.push(
                          <span
                            key={seg.stage + "s" + i}
                            className={"rm-seg " + color.bar + (live ? " live" : "")}
                            style={{ left: a, width: w }}
                          ></span>
                        );
                      }
                      if (hasFuture) {
                        const startFuture = seg.start > TODAY ? seg.start : TODAY;
                        const left = xOf(startFuture) + 2;
                        const w = Math.max(2, b - left - 2);
                        nodes.push(
                          <span key={seg.stage + "f" + i} className={"rm-seg future " + color.bar} style={{ left, width: w }}></span>
                        );
                      }
                      return <React.Fragment key={seg.stage + i}>{nodes}</React.Fragment>;
                    })}
                    {p.sold ? <span className="rm-sold" style={{ left: xOf(p.sold) - 5 }} title={"成交 " + fmtDot(p.sold)}></span> : null}
                    {annotate && rowIndex === 0 ? <span className="anno abs" style={{ left: Math.min(plotW - 24, Math.max(10, xOf(p.sign) - 22)), top: 2 }}>6</span> : null}
                  </div>
                </div>
              );
            })}

            {rows.length === 0 ? (

const SCREENS = [
  { id: "workbench", n: "01", label: "工作台" },
  { id: "closeup", n: "02", label: "组件特写" },
  { id: "spec", n: "03", label: "规范" },
];

function App() {
  const [route, setRoute] = React.useState("workbench");
  const [toastMsg, setToastMsg] = React.useState(null);
  const timer = React.useRef(null);

  React.useEffect(() => {
    const h = (e) => {
      setToastMsg(e.detail);
      clearTimeout(timer.current);
      timer.current = setTimeout(() => setToastMsg(null), 2400);
    };
    window.addEventListener("d-toast", h);
    return () => window.removeEventListener("d-toast", h);
  }, []);

  const go = (id) => {
    if (id === "dashboard") { setRoute("workbench"); return; }
    toast("设计稿演示：该模块不在本次设计范围");
  };

  return (
    <div className="app">
      <Sidebar route="dashboard" go={go} docRoute={route} setDocRoute={setRoute} />
      <main className="main">
        {route === "workbench" ? <WorkbenchScreen /> : route === "closeup" ? <CloseupScreen /> : <SpecScreen />}
      </main>

      <NotesPanel />
      {toastMsg ? <div className="toast" role="status">{toastMsg}</div> : null}
    </div>
  );
}

function toast(msg) {
  window.dispatchEvent(new CustomEvent("d-toast", { detail: msg }));
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
