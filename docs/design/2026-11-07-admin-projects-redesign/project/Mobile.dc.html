<div class="screen">
  <div class="content">
    <header class="app-head">
      <div><div class="crumb">经营中心 / Projects</div><h1>项目管理</h1></div>
      <div class="head-actions">
        <a class="head-btn ink" href="Create.dc.html" aria-label="新建项目"><svg class="ic"><use href="#i-plus"></use></svg></a>
        <button class="avatar" type="button" aria-label="账户菜单：唐欣帆">唐</button>
      </div>
    </header>

    <section class="kpi" aria-label="资产概览">
      <div class="kpi-item"><span>在管资产</span><b>{{activeCount}}<small>套</small></b></div>
      <div class="kpi-item"><span>累计签约</span><b>7,420<small>万</small></b></div>
      <div class="kpi-item"><span>10 月回款</span><b class="rust">763<small>万</small></b></div>
    </section>

    <div class="search-row">
      <label class="search" for="m-search"><svg class="ic"><use href="#i-search"></use></svg><input id="m-search" type="search" placeholder="搜索小区、地址或合同编号" value="{{query}}" onInput="{{onSearch}}" /></label>
      <button class="filter-btn {{filterDot}}" type="button" onClick="{{openSheet}}" aria-label="筛选项目"><svg class="ic"><use href="#i-filter"></use></svg></button>
    </div>

    <div class="chips" aria-label="阶段筛选">
      <sc-for list="{{stageChips}}" as="c" hint-placeholder-count="6">
        <button class="chip {{c.onClass}}" type="button" onClick="{{c.onClick}}">{{c.label}}<b>{{c.count}}</b></button>
      </sc-for>
    </div>

    <div class="list-head"><h2>{{listTitle}}<span>{{listCount}}</span></h2><button class="sort" type="button" onClick="{{cycleSort}}">{{sortLabel}}<svg class="ic"><use href="#i-chevron-down"></use></svg></button></div>

    <sc-if value="{{hasRows}}">
      <div class="cards">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <a class="m-card" href="Detail.dc.html" aria-label="查看 {{r.title}} 项目详情">
            <div class="mc-top">
              <span class="m-mono {{r.monoClass}}">{{r.initial}}</span>
              <span class="mc-title"><b>{{r.title}}</b><span>{{r.meta}}</span></span>
              <span class="m-status {{r.statusClass}}">{{r.statusLabel}}</span>
            </div>
            <div class="mc-stats">
              <div class="mc-stat"><span>签约价</span><b>¥{{r.signing}}<small>万</small></b></div>
              <div class="mc-stat"><span>{{r.priceLabel}}</span><b>¥{{r.price}}<small>万</small></b></div>
              <div class="mc-stat"><span>预计收益</span><b class="rust">{{r.cash}}</b></div>
              <span class="mc-owner">{{r.ownerInitial}}</span>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noRows}}">
      <div class="empty"><div class="empty-icon"><svg class="ic"><use href="#i-search"></use></svg></div><h3>没有匹配的项目</h3><p>换个关键词，或调整筛选条件。</p></div>
    </sc-if>
  </div>

  <nav class="tabbar" aria-label="移动端主导航">
    <button class="tab" type="button"><svg class="ic"><use href="#i-home"></use></svg>工作台</button>
    <button class="tab" type="button"><svg class="ic"><use href="#i-building"></use></svg>房源</button>
    <button class="tab on" type="button" aria-current="page"><svg class="ic"><use href="#i-folder"></use></svg>项目</button>
    <button class="tab" type="button"><svg class="ic"><use href="#i-users"></use></svg>我的</button>
  </nav>

  <sc-if value="{{sheetOpen}}">
    <div class="scrim" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet">
        <div class="sheet-grab"></div>
        <div class="sheet-head"><h3 id="sheet-title">筛选项目</h3><button class="sheet-close" type="button" onClick="{{closeSheet}}" aria-label="关闭筛选"><svg class="ic"><use href="#i-x"></use></svg></button></div>
        <div class="sheet-group"><span class="sheet-label">业务形式</span><div class="sheet-pills">
          <button class="sheet-pill {{bizAll}}" type="button" onClick="{{setBizAll}}">全部</button>
          <button class="sheet-pill {{bizAgent}}" type="button" onClick="{{setBizAgent}}">代理美化</button>
          <button class="sheet-pill {{bizWholesale}}" type="button" onClick="{{setBizWholesale}}">收购美化</button>
        </div></div>
        <div class="sheet-group"><span class="sheet-label">归档状态</span><div class="sheet-pills">
          <button class="sheet-pill {{arcAll}}" type="button" onClick="{{setArcAll}}">全部</button>
          <button class="sheet-pill {{arcActive}}" type="button" onClick="{{setArcActive}}">未归档</button>
          <button class="sheet-pill {{arcArchived}}" type="button" onClick="{{setArcArchived}}">已归档</button>
        </div></div>
        <div class="sheet-actions"><button class="sheet-reset" type="button" onClick="{{resetSheet}}">重置</button><button class="sheet-apply" type="button" onClick="{{applySheet}}">查看 {{filteredCount}} 个项目</button></div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{toast}}"><div class="toast"><svg class="ic"><use href="#i-check"></use></svg>{{toast}}</div></sc-if>
</div>
</x-dc>

      if (s.stage !== "all" && p.status !== s.stage) return false;
      if (s.biz !== "all" && p.business !== s.biz) return false;
      if (s.archive === "active" && p.archived) return false;
      if (s.archive === "archived" && !p.archived) return false;
      if (s.query) {
        const q = s.query.toLowerCase();
        if ((p.title + " " + p.meta).toLowerCase().indexOf(q) < 0) return false;
      }
      return true;
    });
    if (s.sort === "price") list = list.slice().sort((a, b) => parseFloat(b.signing) - parseFloat(a.signing));
    const stageDefs = [
      { id: "all", label: "全部" }, { id: "signing", label: "签约" }, { id: "renovating", label: "装修" }, { id: "selling", label: "在售" }, { id: "sold", label: "已售" }, { id: "ended", label: "下架" }
    ];
    const stageChips = stageDefs.map((x) => ({
      label: x.label,
      count: x.id === "all" ? ALL.length : ALL.filter((p) => p.status === x.id).length,
      onClass: s.stage === x.id ? "on" : "",
      onClick: () => this.setState({ stage: x.id })
    }));
    const activeCount = ALL.filter((p) => ["signing", "renovating", "selling"].indexOf(p.status) >= 0).length;
    const labels = { signing: "签约", renovating: "装修", selling: "在售", sold: "已售", ended: "已下架" };
    return {
      activeCount: activeCount,
      stageChips: stageChips,
      rows: list.slice(0, 6),
      hasRows: list.length > 0,
      noRows: list.length === 0,
      listTitle: s.stage === "all" ? "全部项目" : labels[s.stage] + "项目",
      listCount: list.length + " 个",
      query: s.query,
      onSearch: (e) => this.setState({ query: e.target.value }),
      sortLabel: s.sort === "recent" ? "最近更新" : "签约金额",
      cycleSort: () => this.setState({ sort: s.sort === "recent" ? "price" : "recent" }),
      filterDot: (s.biz !== "all" || s.archive !== "all") ? "has-dot" : "",
      sheetOpen: s.sheetOpen,
      openSheet: () => this.setState({ sheetOpen: true }),
      closeSheet: () => this.setState({ sheetOpen: false }),
      bizAll: s.biz === "all" ? "on" : "",
      bizAgent: s.biz === "agent" ? "on" : "",
      bizWholesale: s.biz === "wholesale" ? "on" : "",
      setBizAll: () => this.setState({ biz: "all" }),
      setBizAgent: () => this.setState({ biz: "agent" }),
      setBizWholesale: () => this.setState({ biz: "wholesale" }),
      arcAll: s.archive === "all" ? "on" : "",
      arcActive: s.archive === "active" ? "on" : "",
      arcArchived: s.archive === "archived" ? "on" : "",
      setArcAll: () => this.setState({ archive: "all" }),
      setArcActive: () => this.setState({ archive: "active" }),
      setArcArchived: () => this.setState({ archive: "archived" }),
      resetSheet: () => this.setState({ biz: "all", archive: "all" }),
      applySheet: () => { this.setState({ sheetOpen: false }); this.notify("已应用筛选（演示）"); },
      filteredCount: list.length,
      toast: s.toast
    };
  }
}
</script>
</body>
