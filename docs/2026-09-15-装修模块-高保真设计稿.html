<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>购房模拟器 · 装修模块 高保真设计稿 v4 · 一个坑 + 上划节奏</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="装修模块设计稿 v4">
<!--
  购房模拟器 · 装修模块 高保真可点击设计稿 v4
  ─────────────────────────────────────────────────────────────
  视觉真源：miniapp/app.wxss（Steep 令牌）+ docs/DESIGN.md

  v4 的策略转向（对应 2026-09-16 反馈）：
    ① 不再「全面表达装修的坑」——不现实。只深耕一个最大的坑：签合同。
    ② 其他阶段压成「上划卡」：3 秒一屏，一句现场 + 一个天数 + 一句提醒，
       目的是让用户感受到「装修确实复杂、确实要花很多时间」，而不是背坑位清单。
    ③ 文字大幅减量：长段说明、每阶段 4-5 项验收清单、双选项问答全部删掉。
    ④ 合同清单不再预先标价——合同价看着低、好签，正是这个坑本身；
       没提的项，等到那一步才单独找你加钱（增项单到站）。
    ⑤ 半包 = 已经做过功课的人：不演坑，改为「验收/功课时间表」——
       什么时候验水电、什么时候验瓦工、什么时候该拍照留底。

  二轮回修（对应 2026-09-16 二轮反馈）：
    ⑥ 删掉「家的生长」剖面图（原 .bp / bpSvg / bpCard / layer 图层数据）：
       评审看不出它在表达什么——逐层点亮的视觉成本换不到信息量。
    ⑦ 主材节点从「油漆之后」前移到「拆除之后」：柜子、门窗、瓷砖、定制柜
       的生产 / 配送 / 加工都要排队，拆除完就得下单，否则卡在安装等货。
       其余阶段顺延一位，各阶段工期与计划总天数不变。

  v5 回修（对应 2026-09-16 三轮：行业评审 + 全量修问题）：
    ⑧ 合同清单换血：删「灯具安装 / 电器安装」两个小钱项，换成
       「付款节点」「逾期违约金」，新增第四组「四 · 工期与付款」。
       两条 doPrice 恒为 0——写清条款不花钱，不写的代价是钱和工期。总数仍 13 项。
    ⑨ 半包不再是「无坑模式」：半包主材自购，坑从「被增项」变成
       「被主材和工期坑」——补 3 笔主材类雷（等货超期 / 复尺尺寸错 / 辅材被换）。
    ⑩ 半包下 door / win / cab / cust / tile 标 halfOwn：主材自购，
       只列清单、不计入装修公司合同价（pill 显示「已列自购清单」）。
    ⑪ 数据校准：铲墙 8000→10000、断桥铝 8㎡→10㎡、橱柜地柜 3.2m→2.4m、
       全案设计 400→250 元/㎡（24000→15000）、半包主材另计 3-6 万→8-15 万、
       档位卡补「含 / 不含」边界。
    ⑫ 机制修复：pricebar 不再把「13 项全写清」染成危险红（改为 ok 绿）；
       合同屏不再剧透结局；stress 步长 5→6，全崩路径才到得了 😱；
       daysText 补渲染（等货 30-45 天 / 通风 30-180 天 / 质保 1-5 年此前全丢）；
       合同屏新增「写清不能省的 N 项」一键路径，缓解 13 项决策负担。

  决策点仍 3 处（预算档位 / 设计师档位 / 13 项合同清单），其余是上划卡片。
  本文件自包含单文件（无 CDN / 无构建），file:// 直接打开即可评审。

  ⚠️ 移植到微信小程序的已知替换（评审稿里的写法在小程序不可用 / 降级）：
    · font-variant-numeric:tabular-nums —— 微信不支持，HUD 的「钱 / 天」数字会跳动，
      改用等宽字体或给数字容器固定宽度
    · details / summary（.cal-fold）—— 小程序无此标签，需自实现折叠
    · scrollIntoView({behavior:'smooth'}) —— 改用 scroll-into-view 属性
    · wheel 事件（上划卡）—— 小程序无鼠标滚轮，只保留 touchstart / touchend
    · text-wrap:pretty —— 不支持，降级无害
-->
<style>
/* ════════════════════════════════════════════════════════════════
   令牌层 · 与 miniapp/app.wxss 逐项对齐（rpx ÷ 2 = px，375px 设计宽）
   ════════════════════════════════════════════════════════════════ */
:root{
  --ink:#17191c; --pure-white:#ffffff; --fog:#f7f7f8;
  --ash:#4c4c4c; --graphite:#777b86; --dove:#a3a6af; --slate:#8b8c8d;
  --rust:#5d2a1a; --apricot-wash:#fbe1d1; --sky-wash:#d3e3fc; --mint:#d1f2e8;
  --shadow-sm:0 4px 16px rgba(23,25,28,.06);
  --shadow-md:0 8px 28px rgba(23,25,28,.10);
  --hairline:#ece7de;         /* 页面 .hud/.steps 分隔线 */
  --hairline-soft:#eeeff1;    /* .brow 分隔线 */
  --ok:#176b4d;               /* 流程条 done 绿 / 日历完成绿（沿用既有） */
  --danger:#b7410e;           /* HUD .num.low / .num.debt 警示橙（沿用既有） */
  --sky-ink:#2a5ca0;          /* .chip-sky 文字色（沿用既有） */
  --font:-apple-system,BlinkMacSystemFont,Roboto,"Noto Sans SC","Source Han Sans SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:#111214;
  font-family:var(--font);
  font-size:14px; line-height:1.4; color:var(--ink);
  display:grid; place-items:center;
}

/* ── 设备外框（≥700px 时居中成手机；窄屏全屏铺满） ── */
#app{
  position:relative; width:100vw; height:100vh;
  display:flex; flex-direction:column;
  background:var(--fog); overflow:hidden;
}
@media (min-width:700px){
  #app{width:390px;height:844px;border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
}

/* ════════════════════════════════════════════════════════════════
   装修状态带（guard）· 替代交易模式的 HUD + 12 项流程条
   一行阶段定位 + 一条 12 段进度线 + 钱条 + 工期条
   ════════════════════════════════════════════════════════════════ */
.guard{
  flex:none; background:var(--pure-white); border-bottom:1px solid var(--hairline);
  padding:10px 16px 12px; z-index:6;
}
.g-top{display:flex;align-items:center;gap:8px;font-size:12px}
.g-badge{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;
  background:var(--fog);border-radius:999px;font-size:12px;font-weight:500;color:var(--ash);
}
.g-dot{width:6px;height:6px;border-radius:50%;background:var(--rust)}
.g-cur{color:var(--ink);font-weight:500}
.g-cur b{font-variant-numeric:tabular-nums}
.g-sp{flex:1}
.g-day{color:var(--graphite);font-variant-numeric:tabular-nums}
.g-day b{color:var(--ink);font-weight:500}
.g-face{font-size:14px;line-height:1}

/* 12 段进度线：已完成 ink / 当前 rust / 未到 hairline（4px：3px 在真机上太细，看不清） */
.g-line{display:flex;gap:2px;margin-top:9px}
.g-seg{flex:1;height:4px;border-radius:999px;background:var(--hairline);transition:background .3s}
.g-seg.done{background:var(--ink)}
.g-seg.cur{background:var(--rust);box-shadow:0 0 0 2px var(--apricot-wash)}
.g-seg.future{background:var(--hairline)}

/* 钱条 / 工期条 */
.g-meters{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.gm{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--graphite)}
.gm-k{flex:none;width:12px;color:var(--dove);font-weight:500}
.gm-bar{
  flex:1;height:7px;border-radius:999px;background:var(--fog);
  display:flex;overflow:hidden;position:relative;
}
.gm-bar i{display:block;height:100%;transition:width .55s cubic-bezier(.22,1,.36,1)}
.gm-base{background:var(--ink)}
.gm-over{background:var(--danger)}
.gm-study{background:var(--sky-ink);opacity:.72}
.gm-rework{background:var(--danger)}
.gm-v{flex:none;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.gm-v em{font-style:normal;color:var(--dove);font-weight:400;margin-left:4px}
/* 被啃动的高亮脉冲（爆雷结算时触发） */
.gm-bar.hit{animation:barHit .9s ease}
@keyframes barHit{
  0%{box-shadow:0 0 0 0 rgba(183,65,14,0)}
  30%{box-shadow:0 0 0 3px rgba(183,65,14,.28)}
  100%{box-shadow:0 0 0 0 rgba(183,65,14,0)}
}

/* ════════════════════════════════════════════════════════════════
   舞台区
   ════════════════════════════════════════════════════════════════ */
.stage{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stage::-webkit-scrollbar{width:0;height:0}
.sc{padding:20px 18px 40px;animation:arrive .42s cubic-bezier(.22,1,.36,1)}
@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* 排版（typo.wxss 对齐） */
.eyebrow{display:inline-flex;align-items:center;font-size:12px;font-weight:500;color:var(--rust);letter-spacing:.04em}
.hd{font-weight:500;font-size:25px;line-height:1.22;letter-spacing:-.015em;color:var(--ink);margin:6px 0 0;white-space:pre-line;text-wrap:pretty}
.hd-hero{display:block;font-size:38px;line-height:1.2;margin-bottom:4px}
.sub{margin:6px 0 0;font-size:14px;color:var(--ash);line-height:1.65;text-wrap:pretty}

/* 卡片 */
.card{background:var(--pure-white);border-radius:24px;box-shadow:var(--shadow-sm);padding:18px;margin-top:14px}
.card-warm{background:var(--apricot-wash)}
.card-sky{background:var(--sky-wash)}
.b-title{font-size:13px;font-weight:500;color:var(--ink);line-height:1.5}
.b-desc{font-size:12.5px;color:var(--ash);margin-top:5px;line-height:1.7;white-space:pre-line;text-wrap:pretty}

/* 提示条 */
.ok-note{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;line-height:1.6;color:var(--ash);background:var(--fog);border-radius:14px;padding:10px 14px;margin-top:12px;text-wrap:pretty}
.ok-note .ok-b{color:var(--ink);font-weight:500;flex:none}

/* 对话气泡 */
.chat{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.bubble{display:flex;gap:9px;max-width:94%}
.bubble.me{align-self:flex-end;flex-direction:row-reverse}
.ava{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--ink)}
.ava-warm{background:var(--apricot-wash)}
.ava-sky{background:var(--sky-wash)}
.ball-wrap{min-width:0}
.who{font-size:11px;color:var(--graphite);margin-bottom:3px}
.ball{background:var(--pure-white);border-radius:16px 16px 16px 6px;padding:11px 14px;box-shadow:var(--shadow-sm);font-size:14px;color:var(--ink);line-height:1.65;white-space:pre-line;text-wrap:pretty}
.bubble.me .ball{background:var(--ink);color:#fff;border-radius:16px 16px 6px 16px}

/* 账单行 */
.card-rows{padding:10px 18px}
.brow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline-soft);font-size:13.5px}
.brow:last-child{border-bottom:0}
.brow .k{color:var(--ash);flex:1}
.brow .v{font-weight:500;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.brow.total{border-top:1px solid var(--hairline);border-bottom:0;padding-top:13px}
.brow.total .v{font-size:16px}
.brow .v.over{color:var(--danger)}

/* KPI */
.kpi{display:flex;gap:10px;margin-top:10px}
.kc{flex:1;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:13px 15px}
.kl{font-size:12px;color:var(--graphite)}
.kv{margin-top:5px;font-size:20px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.015em;line-height:1.1}
.kv.over{color:var(--danger)}
.ku{font-size:11px;font-weight:400;color:var(--graphite)}

/* 徽章 */
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-warm{background:var(--apricot-wash);color:var(--rust)}
.badge-sky{background:var(--sky-wash);color:var(--sky-ink)}
.badge-fog{background:var(--fog);color:var(--ash)}
.badge-hair{background:transparent;border:1px solid var(--dove);color:var(--graphite)}
.badge-mint{background:var(--mint);color:var(--ok)}

/* 内部工具类 */
.num{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--hairline);margin:14px 0}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:22px}
.sect-t{font-size:13px;font-weight:500;color:var(--ink)}
.sect-x{font-size:11px;color:var(--dove);font-variant-numeric:tabular-nums}

/* ════════════════════════════════════════════════════════════════
   陈设一 · 现场卡（说话人 + 现场状况 + 客观证据物件）
   ════════════════════════════════════════════════════════════════ */
.site{margin-top:14px}
.site-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.site-role{font-size:11px;font-weight:500;color:var(--graphite)}
/* 证据物件卡：只陈列客观物件，不做任何解读（信息迷雾不可剧透） */
.doc{
  display:flex;gap:10px;align-items:flex-start;margin-top:9px;
  background:var(--fog);border:1px dashed var(--dove);border-radius:16px;padding:11px 13px;
}
.doc-ic{flex:none;font-size:17px;line-height:1.25}
.doc-b{min-width:0}
.doc-t{font-size:12px;font-weight:500;color:var(--ink)}
.doc-d{font-size:11.5px;color:var(--graphite);line-height:1.55;margin-top:2px;text-wrap:pretty}
.doc-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink);background:var(--pure-white);border-radius:6px;padding:1px 5px}

/* ════════════════════════════════════════════════════════════════
   陈设二 · 智慧选项卡（把 days / cost / learned 从文案里提出来）
   快选：中性灰徽章（不标风险，保住迷雾）
   功课：Sky 徽章 + 「换真实信息」
   ════════════════════════════════════════════════════════════════ */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{
  display:block;width:100%;text-align:left;background:var(--pure-white);
  border:1px solid var(--hairline);border-radius:20px;padding:13px 16px;min-height:48px;
  font-family:inherit;color:inherit;cursor:pointer;transition:border-color .16s,box-shadow .16s,transform .16s;
}
.opt:active{border-color:var(--dove);box-shadow:var(--shadow-sm);transform:scale(.988)}
.opt-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.opt-t{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.45;text-wrap:pretty}
.opt-d{font-size:12.5px;color:var(--graphite);margin-top:3px;line-height:1.55;text-wrap:pretty}
.opt.picked{border-color:var(--ink);background:var(--fog)}
.opt.picked::after{content:"已选";float:right;font-size:11px;color:var(--graphite)}
.opt[disabled]{opacity:.45;cursor:default}

/* ════════════════════════════════════════════════════════════════
   陈设三 · 爆雷条（进入阶段时结算已埋下的雷 · 情绪高点）
   ════════════════════════════════════════════════════════════════ */
.burst{
  margin-top:14px;background:var(--apricot-wash);border:2px solid var(--danger);
  border-radius:20px;padding:14px 16px;animation:burstIn .5s cubic-bezier(.22,1,.36,1);
}
@keyframes burstIn{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
.burst-t{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--danger)}
.burst-src{font-size:10.5px;font-weight:500;color:var(--rust);background:rgba(255,255,255,.6);border-radius:8px;padding:2px 7px;margin-left:auto}
.burst-d{font-size:13px;color:var(--rust);line-height:1.65;margin-top:7px;text-wrap:pretty}
.burst-nums{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.bn{flex:1;min-width:72px;background:rgba(255,255,255,.72);border-radius:14px;padding:8px 10px}
.bn-k{font-size:10.5px;color:var(--graphite)}
.bn-v{font-size:15px;font-weight:600;color:var(--danger);font-variant-numeric:tabular-nums;margin-top:2px}

/* ════════════════════════════════════════════════════════════════
   陈设四 · 证据链钱包（做功课的可见回报 · 质保期兑现）
   ════════════════════════════════════════════════════════════════ */
.wallet{margin-top:16px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:13px 15px}
.w-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.w-t{font-size:12px;font-weight:500;color:var(--ink)}
.w-n{font-size:11px;color:var(--dove);margin-left:auto;font-variant-numeric:tabular-nums}
.w-grid{display:flex;gap:6px}
.w-slot{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:1px dashed var(--dove);border-radius:12px;padding:8px 2px;background:transparent;
  transition:all .3s;
}
.w-slot .wi{font-size:15px;line-height:1.2;opacity:.28;filter:grayscale(1)}
.w-slot .wn{font-size:11px;color:var(--dove);white-space:nowrap}
.w-slot.on{border:1px solid var(--ink);background:var(--fog)}
.w-slot.on .wi{opacity:1;filter:none}
.w-slot.on .wn{color:var(--ink);font-weight:500}
.w-slot.just{animation:slotIn .55s cubic-bezier(.22,1,.36,1)}
@keyframes slotIn{0%{transform:scale(.82);box-shadow:0 0 0 0 rgba(23,25,28,.22)}60%{transform:scale(1.06)}100%{transform:scale(1);box-shadow:0 0 0 8px rgba(23,25,28,0)}}

/* ════════════════════════════════════════════════════════════════
   按钮 / CTA
   ════════════════════════════════════════════════════════════════ */
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;
  min-height:48px;padding:0 18px;border-radius:999px;border:0;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:500;transition:transform .16s,opacity .16s;
}
.btn:active{transform:scale(.98)}
.btn-ink{background:var(--ink);color:#fff}
.btn-out{background:transparent;color:var(--ink);border:1px solid var(--dove)}
.btn-rust{background:var(--rust);color:#fff}
.btn-disabled{background:var(--fog);color:var(--dove);cursor:default}

/* ════════════════════════════════════════════════════════════════
   预算决策屏 · 单价 × 面积 心算 + 四档卡（半包 / 全包三档）
   ════════════════════════════════════════════════════════════════ */
.calc{
  margin-top:14px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);
  padding:14px 16px;display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap;
}
.calc .k{color:var(--graphite)}
.calc .v{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.calc .op{color:var(--dove)}
.calc .eq{color:var(--dove)}
.calc .r{font-size:19px;font-weight:500;color:var(--rust);font-variant-numeric:tabular-nums;letter-spacing:-.015em}

.grade{
  display:block;width:100%;text-align:left;background:var(--pure-white);
  border:1px solid var(--hairline);border-radius:20px;padding:14px 16px;margin-top:10px;
  font-family:inherit;color:inherit;cursor:pointer;transition:border-color .16s,box-shadow .16s;
}
.grade:active{transform:scale(.99)}
.grade.on{border:2px solid var(--ink);box-shadow:var(--shadow-sm);padding:13px 15px}
.gr-hd{display:flex;align-items:baseline;gap:8px}
.gr-n{font-size:14.5px;font-weight:500;color:var(--ink)}
.gr-p{margin-left:auto;font-size:17px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.gr-u{font-size:11px;color:var(--dove);font-variant-numeric:tabular-nums}
.gr-d{font-size:12.5px;color:var(--graphite);margin-top:4px;line-height:1.55;text-wrap:pretty}
.gr-bar{display:flex;height:5px;border-radius:999px;overflow:hidden;margin-top:10px;background:var(--fog)}
.gr-bar i{display:block;height:100%}
.gr-note{font-size:11px;color:var(--dove);margin-top:6px;font-variant-numeric:tabular-nums}

/* 分账预估（横条 + 图例） */
.split{margin-top:14px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:14px 16px}
.split-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--fog)}
.split-bar i{display:block;height:100%;border-right:2px solid var(--pure-white)}
.split-bar i:last-child{border-right:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:11px}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--graphite)}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}
.lg b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;margin-left:2px}

/* ════════════════════════════════════════════════════════════════
   施工进度弹层（替代交易模式的「模拟日历」在装修段的复用）
   分段工期：基础 / 功课（主动） / 返工（被动）
   ════════════════════════════════════════════════════════════════ */
.overlay{
  position:absolute;inset:0;background:rgba(23,25,28,.42);display:flex;
  align-items:flex-end;justify-content:center;z-index:20;padding:16px;
  animation:fadein .2s ease;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-height:90%;overflow-y:auto;background:var(--pure-white);
  border-radius:24px;padding:20px 20px 18px;animation:rise .28s cubic-bezier(.22,1,.36,1);
}
.sheet::-webkit-scrollbar{width:0}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-tag{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:500;color:var(--rust)}
.sheet-title{margin:8px 0 5px;font-size:17px;font-weight:500;color:var(--ink)}
.sheet-desc{font-size:13.5px;color:var(--ash);line-height:1.7;margin-bottom:7px;text-wrap:pretty}
.sheet-actions{display:flex;gap:10px;margin-top:16px}

.gap-title{display:flex;align-items:flex-end;gap:8px;margin:8px 0 3px}
.gap-arr{font-size:15px;color:var(--ink);line-height:1.4}
.gap-gap{margin-left:auto;font-size:13px;color:var(--ink);flex:none}
.gap-n{font-size:28px;font-weight:600;color:var(--rust);font-variant-numeric:tabular-nums;line-height:1.1}
.gap-phase{font-size:13px;color:var(--graphite);margin-bottom:10px}

.seg-card{background:var(--fog);border-radius:18px;padding:13px 15px}
.seg-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0}
.seg-row .sr-k{color:var(--graphite);flex:1}
.seg-row .sr-v{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.seg-swatch{width:9px;height:9px;border-radius:3px;flex:none}
.seg-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--hairline);margin-top:10px}
.seg-bar i{display:block;height:100%;transition:width .5s ease}
.seg-total{display:flex;justify-content:space-between;font-size:12px;color:var(--ink);margin-top:8px;font-variant-numeric:tabular-nums;font-weight:500}

/* 日历折叠区（保留交易模块已建立的"真实日期"沉浸感） */
.cal-fold{margin-top:12px;border:1px solid var(--hairline);border-radius:16px;overflow:hidden}
.cal-fold>summary{padding:11px 14px;font-size:12.5px;color:var(--graphite);cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px}
.cal-fold>summary::-webkit-details-marker{display:none}
.cal-fold>summary::after{content:"▾";margin-left:auto;color:var(--dove)}
.cal-fold[open]>summary::after{content:"▴"}
.cal-body{padding:0 12px 12px}
.cal-week{display:flex}
.cal-wk{flex:1;text-align:center;font-size:11px;color:var(--dove);padding-bottom:5px}
.cal-grid{display:flex;flex-wrap:wrap}
.cal-cell{width:calc(100% / 7);height:33px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.cal-cell.past{color:#c9c2b4}
.cal-cell.cur{background:var(--rust);color:#fff;font-weight:600;border-radius:8px;box-shadow:0 3px 8px rgba(93,42,26,.22)}
.cal-range{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;font-size:11.5px;color:var(--graphite);font-variant-numeric:tabular-nums}
.cal-arrow{color:var(--rust);font-weight:600}
.cal-note{margin-top:10px;font-size:12.5px;color:var(--ash);line-height:1.65;background:var(--fog);border-radius:14px;padding:10px 13px;text-wrap:pretty}
.cal-note b{color:var(--ink);font-weight:600}
.cal-risk{margin-top:8px;font-size:12.5px;color:var(--danger);line-height:1.65;background:var(--apricot-wash);border:1px solid #e8b79b;border-radius:14px;padding:10px 13px;text-wrap:pretty}
.cal-risk b{font-weight:600}

/* ════════════════════════════════════════════════════════════════
   完工总账屏 · 超支瀑布 / 时间账 / 证据结算 / 记事时间轴
   ════════════════════════════════════════════════════════════════ */
.wf{margin-top:12px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:14px 16px}
.wf-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.wf-k{flex:none;width:34px;color:var(--graphite)}
.wf-track{flex:1;height:9px;background:var(--fog);border-radius:999px;overflow:hidden}
.wf-fill{display:block;height:100%;background:var(--danger);border-radius:999px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.wf-v{flex:none;width:56px;text-align:right;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.wf-sum{margin-top:10px;padding-top:10px;border-top:1px solid var(--hairline-soft);font-size:12.5px;color:var(--ash);line-height:1.6;text-wrap:pretty}
.wf-sum b{color:var(--ink);font-weight:500}

/* 时间账（计划 vs 实际，分段着色） */
.tl{margin-top:12px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:14px 16px}
.tl-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12.5px}
.tl-k{flex:none;width:30px;color:var(--graphite)}
.tl-bar{flex:1;display:flex;height:11px;border-radius:999px;overflow:hidden;background:var(--fog)}
.tl-bar i{display:block;height:100%}
.tl-v{flex:none;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.tl-legend{display:flex;flex-wrap:wrap;gap:6px 13px;margin-top:3px}
.tl-line{margin-top:11px;padding-top:11px;border-top:1px solid var(--hairline-soft);font-size:13px;color:var(--ink);line-height:1.65;text-wrap:pretty}
.tl-line b{color:var(--rust);font-weight:600}

/* 结算卡（证据链兑现） */
.payoff{margin-top:12px;background:var(--sky-wash);border-radius:20px;padding:14px 16px}
.payoff-t{font-size:13px;font-weight:500;color:var(--sky-ink)}
.payoff-d{font-size:12.5px;color:var(--ash);line-height:1.65;margin-top:5px;text-wrap:pretty}
.payoff-d b{color:var(--ink);font-weight:600}
.payoff-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* 记事时间轴 */
.log{margin-top:12px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:14px 16px}
.log-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--hairline-soft)}
.log-item:last-child{border-bottom:0}
.log-rail{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
.log-node{width:7px;height:7px;border-radius:50%;background:var(--ink);flex:none}
.log-node.hit{background:var(--danger);box-shadow:0 0 0 3px var(--apricot-wash)}
.log-stage{font-size:11px;color:var(--dove);text-align:center;line-height:1.2}
.log-b{flex:1;min-width:0}
.log-t{font-size:12.5px;color:var(--ink);line-height:1.6;text-wrap:pretty}
.log-t.hit{color:var(--danger);font-weight:500}
.log-x{font-size:11px;color:var(--graphite);margin-top:2px;font-variant-numeric:tabular-nums}

/* 13 阶段打卡 */
.chk-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chk-wrap .badge{height:24px}

/* ════════════════════════════════════════════════════════════════
   评审工具条（不属于设计稿，评审用；可折叠）
   ════════════════════════════════════════════════════════════════ */
.rv{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-family:var(--font)}
.rv-toggle{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border:0;cursor:pointer;
  background:var(--pure-white);color:var(--ink);border-radius:999px;box-shadow:var(--shadow-md);
  font-family:inherit;font-size:13px;font-weight:500;
}
.rv-panel{
  width:264px;max-height:76vh;overflow-y:auto;background:var(--pure-white);border-radius:20px;
  box-shadow:0 16px 48px rgba(0,0,0,.28);padding:16px;display:none;
}
.rv-panel.on{display:block;animation:rise .24s cubic-bezier(.22,1,.36,1)}
.rv-h{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:12px}
.rv-grp{margin-bottom:14px}
.rv-l{font-size:10.5px;color:var(--dove);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.rv-btns{display:flex;flex-direction:column;gap:5px}
.rv-btns button{
  width:100%;text-align:left;padding:8px 11px;border:1px solid var(--hairline);background:var(--pure-white);
  border-radius:10px;font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer;
}
.rv-btns button:active{background:var(--fog)}
.rv-jump{display:flex;flex-wrap:wrap;gap:3px}
.rv-jump button{
  width:calc(100% / 5 - 3px);padding:6px 0;border:1px solid var(--hairline);background:var(--pure-white);
  border-radius:8px;font-family:inherit;font-size:10.5px;color:var(--graphite);cursor:pointer;font-variant-numeric:tabular-nums;
}
.rv-jump button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rv-chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink);padding:5px 0;cursor:pointer}
.rv-chk input{accent-color:var(--rust);width:14px;height:14px}
.rv-hint{font-size:10.5px;color:var(--dove);line-height:1.5;margin-top:4px}

/* ── 标注模式：圈出本轮新增 / 变更的元素 ── */
body.annotate [data-new]{position:relative;outline:1.5px dashed var(--rust);outline-offset:3px;border-radius:6px}
body.annotate [data-new]::after{
  content:"新";position:absolute;top:-9px;right:-4px;background:var(--rust);color:#fff;
  font-size:9px;font-weight:600;line-height:1;padding:2px 5px;border-radius:6px;z-index:3;
}
body.annotate [data-chg]{position:relative;outline:1.5px dashed var(--sky-ink);outline-offset:3px;border-radius:6px}
body.annotate [data-chg]::after{
  content:"改";position:absolute;top:-9px;right:-4px;background:var(--sky-ink);color:#fff;
  font-size:9px;font-weight:600;line-height:1;padding:2px 5px;border-radius:6px;z-index:3;
}
/* ── 设计说明气泡 ── */
.note-i{
  display:none;margin-top:7px;background:#fffbeb;border:1px solid #f3e2b3;border-radius:12px;
  padding:9px 12px;font-size:11.5px;color:#6b5427;line-height:1.6;text-wrap:pretty;
}
body.notes .note-i{display:block}
.note-i b{color:#4a3a18;font-weight:600}
/* ════════════════════════════════════════════════════════════════
   v3 新增组件 · 合同清单 / 工地验收清单 / 增项单 / 学习对照表
   ════════════════════════════════════════════════════════════════ */

/* ─ 进度与状态胶囊 ── */
.prog{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--graphite)}
.prog-bar{flex:1;height:6px;border-radius:999px;background:var(--fog);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .4s cubic-bezier(.22,1,.36,1)}
.prog-v{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:500}
.pill-todo{background:var(--apricot-wash);color:var(--rust)}
.pill-do{background:var(--ink);color:#fff}
.pill-no{background:var(--fog);color:var(--graphite);border:1px solid var(--dove)}
.pill-ok{background:var(--mint);color:var(--ok)}
.pill-warn{background:var(--sky-wash);color:var(--sky-ink)}

/* ── 合同清单 ── */
.cl-sec{margin-top:18px}
.cl-sec-h{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.cl-sec-t{font-size:13px;font-weight:500;color:var(--ink)}
.cl-sec-x{font-size:11px;color:var(--dove);font-variant-numeric:tabular-nums;margin-left:auto}
.cl-row{padding:12px 0;border-bottom:1px solid var(--hairline-soft)}
.cl-row:last-child{border-bottom:0}
.cl-top{display:flex;align-items:center;gap:7px}
.cl-n{font-size:13.5px;font-weight:500;color:var(--ink)}
.cl-price{font-size:11px;color:var(--graphite);margin-left:auto;font-variant-numeric:tabular-nums}
.cl-why{font-size:11.5px;color:var(--graphite);line-height:1.6;margin-top:4px;text-wrap:pretty}
.cl-write{font-size:11.5px;color:var(--ash);line-height:1.6;margin-top:5px;background:var(--fog);border-radius:10px;padding:7px 10px;text-wrap:pretty}
.cl-write b{color:var(--ink);font-weight:500}
.cl-acts{display:flex;gap:7px;margin-top:9px}
.cl-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;min-height:36px;
  border-radius:999px;border:1px solid var(--hairline);background:var(--pure-white);
  font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer;transition:all .15s;padding:0 10px;
}
.cl-btn:active{transform:scale(.98)}
.cl-btn.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.cl-btn.on-no{background:var(--fog);border-color:var(--dove);color:var(--ink);font-weight:500}
.cl-foot{margin-top:14px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:12px 16px}
.cl-say{margin-top:12px;font-size:12.5px;line-height:1.65;border-radius:14px;padding:10px 14px;text-wrap:pretty}
.cl-say.warn{background:var(--apricot-wash);color:var(--rust);border:1px solid #e8b79b}
.cl-say.calm{background:var(--fog);color:var(--ash)}
.cl-quick{margin-top:7px;font-size:11px;color:var(--graphite);line-height:1.55;text-wrap:pretty}

/* ── 工地验收清单 ── */
.ck-card{margin-top:14px;background:var(--pure-white);border-radius:22px;box-shadow:var(--shadow-sm);padding:14px 16px}
.ck-hd{display:flex;align-items:baseline;gap:8px}
.ck-t{font-size:12.5px;font-weight:500;color:var(--ink)}
.ck-x{font-size:11px;color:var(--dove);margin-left:auto;font-variant-numeric:tabular-nums}
.ck-row{padding:11px 0;border-bottom:1px solid var(--hairline-soft)}
.ck-row:last-child{border-bottom:0}
.ck-top{display:flex;align-items:flex-start;gap:8px}
.ck-name{flex:1;font-size:13px;font-weight:500;color:var(--ink);line-height:1.45}
.ck-how{font-size:11.5px;color:var(--graphite);line-height:1.6;margin-top:3px;text-wrap:pretty}
.ck-go{
  flex:none;height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--dove);background:var(--pure-white);
  font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer;transition:all .15s;
}
.ck-go:active{transform:scale(.97)}
.ck-go.done{border-style:dashed;color:var(--dove);cursor:default}
.ck-find{margin-top:9px;border-radius:14px;padding:11px 13px;font-size:12.5px;line-height:1.65;text-wrap:pretty;animation:arrive .3s cubic-bezier(.22,1,.36,1)}
.ck-find.bad{background:var(--apricot-wash);border:1px solid #e8b79b;color:var(--rust)}
.ck-find.good{background:var(--mint);color:var(--ok)}
.ck-find b{font-weight:600}
.ck-fix{display:flex;gap:7px;margin-top:10px}
.ck-fix .cl-btn{font-size:11.5px;min-height:34px}
.ck-res{margin-top:8px;font-size:11.5px;font-weight:500}

/* ── 增项单（爆雷条的账目化） ── */
.adj{margin-top:9px;background:rgba(255,255,255,.78);border:1px dashed var(--danger);border-radius:14px;padding:10px 12px}
.adj-hd{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--rust);font-weight:500}
.adj-no{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--graphite);font-weight:400}
.adj-line{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink);padding:3px 0;font-variant-numeric:tabular-nums}
.adj-line span:last-child{font-weight:500;white-space:nowrap}
.adj-sum{display:flex;justify-content:space-between;gap:10px;margin-top:5px;padding-top:6px;border-top:1px solid rgba(183,65,14,.28);font-size:12.5px;color:var(--danger);font-weight:600;font-variant-numeric:tabular-nums}
.adj-hint{margin-top:6px;font-size:11px;color:var(--rust);line-height:1.55;text-wrap:pretty}

/* ─ 学习对照表（哪一步没做 → 哪一笔爆了） ── */
.lrn{margin-top:12px;background:var(--pure-white);border-radius:20px;box-shadow:var(--shadow-sm);padding:14px 16px}
.lrn-row{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--hairline-soft)}
.lrn-row:last-child{border-bottom:0}
.lrn-l{flex:1;min-width:0;font-size:12px;color:var(--ash);line-height:1.6;text-wrap:pretty}
.lrn-l b{color:var(--ink);font-weight:500}
.lrn-r{flex:none;width:88px;text-align:right;font-size:12.5px;font-weight:600;color:var(--danger);font-variant-numeric:tabular-nums}
.lrn-hint{font-size:11px;color:var(--graphite);margin-top:3px;line-height:1.55;text-wrap:pretty}

/* ── 档位卡补充（半包 / 全包分组） ─ */
.opt-tag{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:500;background:var(--fog);color:var(--ash)}
.opt-tag.hot{background:var(--apricot-wash);color:var(--rust)}
.opt-tag.cool{background:var(--sky-wash);color:var(--sky-ink)}

/* ── 覆盖与微调（v3） ── */
.log-rail{width:52px}
.log-stage{font-size:11px;white-space:nowrap;letter-spacing:-.02em}

/* ── 情绪/状态小卡（今日活儿） ── */
.todo-line{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ash);margin-top:12px}
.todo-line i{width:6px;height:6px;border-radius:50%;background:var(--rust);flex:none}
/* ═══════════════════════════════════════════════════════════════
   v4 新增 · 上划卡（3 秒一屏）/ 合同价条 / 总账工期条
   ═══════════════════════════════════════════════════════════════ */
.swipe{
  margin-top:14px;background:var(--pure-white);border-radius:26px;box-shadow:var(--shadow-sm);
  padding:17px 16px 14px;animation:arrive .34s cubic-bezier(.22,1,.36,1);
}
.sw-day{font-size:12px;color:var(--graphite);font-variant-numeric:tabular-nums}

/* ══════════════════════════════════════════════════════════════════════════
   引擎 · 装修模块 v4
   钱的三个数：合同价（预算 + 设计费 + 写进合同的项）/ 增项单 / 结账价
   ═══════════════════════════════════════════════════════════════════════════ */
const wan = v => (v / 10000).toFixed(2).replace(/\.?0+$/, '');
const yuan = v => '¥' + Math.round(v).toLocaleString('en-US');
const PLAN_BASE = STAGES.filter(s => s.k !== 'Warr').reduce((a, s) => a + s.days, 0);
const PLAN_TOTAL = PLAN_BASE + 1;
const ANCHOR = new Date(2027, 4, 10);   /* 评审用固定开工锚点（油漆恰好落在梅雨） */
function dateOf(day) { const d = new Date(ANCHOR.getTime()); d.setDate(d.getDate() + (day - 1)); return d; }
function md(day) { const d = dateOf(day); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function faceOf(v) { return v < 25 ? '😌' : v < 50 ? '😐' : v < 75 ? '😰' : '😱'; }

let S = null, SILENT = false, FAST_ON = true;
function render() { if (SILENT) return; doRender(); }
function newState() {
  return {
    screen: 'budget', pkg: null, budget: 0, tier: null, designFee: 0, con: {},
    stageIdx: 0, day: 1, doneDay: 0, moved: 0,
    extra: 0, bills: [], mines: [], burst: [], log: [], byStage: {}, stress: 8,
  };
}
const stageDef = () => STAGES[S.stageIdx - 1];
/* 阶段累计（旧名 st() 与 trySwipe 里的局部 const st 同名遮蔽，改名避开） */
function stageStat(k) { if (!S.byStage[k]) S.byStage[k] = { burstCost: 0 }; return S.byStage[k]; }
const T = () => DESIGN_TIERS.find(t => t.k === S.tier) || null;

/* ── 钱 ── */
const isHalf = () => !!(S.pkg && S.pkg.k === 'half');
/* 半包下「主材自购」的项只列清单、不进装修公司合同价（it.halfOwn） */
function contractAdd() {
  const half = isHalf();
  return CONTRACT.reduce((a, it) => {
    if (S.con[it.k] !== 'do') return a;
    return a + (half && it.halfOwn ? 0 : it.doPrice);
  }, 0);
}
function contractPrice() { return S.budget + S.designFee + contractAdd(); }
function paidTotal() { return contractPrice() + S.extra; }
function decidedCount() { return CONTRACT.filter(it => S.con[it.k]).length; }
function writtenList() { return CONTRACT.filter(it => S.con[it.k] === 'do').map(it => it.name); }
const riskLeft = () => CONTRACT.filter(it => it.noKind === 'risk' && !S.con[it.k]);

/* ── 增项单（合同没提的项，装到那一步才来） ── */
function pushMine(m, how, scope) {
  S.mines.push({ at: m.at, lines: m.lines, days: m.days || 0, text: m.text, hint: m.hint, scope: scope || null, src: (how ? how + ' · ' : '') + m.src });
}
function settleMines(def) {
  const hits = S.mines.filter(m => m.at === def.k);
  if (!hits.length) return [];
  S.mines = S.mines.filter(m => m.at !== def.k);
  return hits.map(m => {
    const cost = m.lines.reduce((a, l) => a + l[1], 0);
    S.extra += cost; S.day += m.days; S.stress += 6;   /* 步长 6：13 张全踩 = 86，才够得到 😱（阈值 75） */
    stageStat(def.k).burstCost += cost;
    const bill = { no: '#' + String(S.bills.length + 1).padStart(2, '0'), stage: def.name, day: S.day, lines: m.lines, cost, days: m.days, text: m.text, src: m.src, hint: m.hint, scope: m.scope };
    S.bills.push(bill);
    S.log.push({ stage: def.name, text: m.text, cost, days: m.days, hit: true });
    return bill;
  });
}

/* ══════════════════ 决策（只有 3 处） ═════════════════ */
function startRenov() {
  if (!S.pkg) return;
  S.screen = 'stage'; S.day = 1;
  S.log.push({ stage: '预算', text: '定了 ' + S.pkg.name + '：约 ' + wan(S.budget) + ' 万', cost: S.budget, days: 0 });
  arrive(1);
}
function selectTier(k) {
  if (S.tier) return;
  const t = DESIGN_TIERS.find(x => x.k === k);
  S.tier = t.k; S.designFee = t.price;
  S.log.push({ stage: '设计', text: '定了 ' + t.name + (t.price ? '（' + yuan(t.price) + '）' : '（免费）'), cost: t.price, days: 0 });
  focusOn('#tier-' + k, 'nearest');
  render();
}
function decide(k, v) {
  const it = CONTRACT.find(x => x.k === k);
  if (!it) return;
  S.con[k] = v;
  if (v === 'no' && it.noKind === 'risk' && it.noMine) pushMine(it.noMine, '你选了「' + (it.noLabel || '不做') + '」', it.k);
  focusOn('#cl-' + k, 'nearest');
  render();
}
function fillContract(mode) {
  CONTRACT.forEach(it => {
    if (mode === 'quick') return;                        /* 一路没提：合同价最低，最好签 */
    decide(it.k, 'do');                                  /* 写清路径：13 项全部写进合同 */
  });
  /* 半包：13 项写清只保证「不被装修公司加价」，主材自购的坑另算 */
  if (mode === 'half') HALF_MINES.forEach(m => pushMine(m, '半包 · 自购主材'));
}
/* 一键写清「不能省」的项（noKind === 'risk'）：13 项里的高风险子集 */
function writeRiskItems() {
  const left = riskLeft();
  if (!left.length) return;
  left.forEach(it => { S.con[it.k] = 'do'; });
  focusOn('#cl-' + left[0].k, 'nearest');
  render();
}
function settleContract() {
  const omit = CONTRACT.filter(it => !S.con[it.k]);
  omit.forEach(it => pushMine(it.omit, '', it.k));
  S.log.push({
    stage: '签合同', cost: 0, days: 0,
    text: omit.length ? omit.length + ' 项边界没提（合同价因此看着更低）——装到那一步才来加钱' : '13 项全部有结论：写进合同的按价走，不做的不再产生费用',
  });
}

/* ══════════════════ 推进（上划 / CTA） ═════════════════ */
function arrive(idx) {
  const def = STAGES[idx - 1];
  S.stageIdx = idx; S.moved = 0;
  if (def.k === 'Warr') S.doneDay = S.day;
  S.burst = settleMines(def);
  if (def.k === 'Warr') S.day += 365;
}
function advance(silentStep) {
  const def = stageDef();
  if (!def) return;
  if (def.pickTier && !S.tier) return;                   /* 设计档位必须先选 */
  if (def.contract) settleContract();
  if (def.k === 'Warr') { S.screen = 'done'; S.stageIdx = STAGES.length + 1; render(); return; }
  const from = S.day;
  S.day += def.days;
  S.moved = def.days;
  arrive(S.stageIdx + 1);
  if (silentStep) return;
  render();
}
function runThrough(mode) {
  SILENT = true;
  S = newState();
  const pk = mode === 'half' ? 'half' : 'f25';   /* quick / careful 同档位，只比「合同写没写清」 */
  S.pkg = PKGS.find(p => p.k === pk); S.budget = DEMO.area * S.pkg.perSq;
  S.screen = 'stage';
  arrive(1);
  let guard = 0;
  while (S.screen !== 'done' && guard++ < 40) {
    const def = stageDef();
    if (def.pickTier && !S.tier) selectTier(mode === 'quick' ? 'free' : 'd100');
    if (def.contract) fillContract(mode);
    advance(true);
  }
  S.screen = 'done';
  SILENT = false; render();
}
function seedToStage(n, pkgK) {
  SILENT = true;
  S = newState();
  const p = PKGS.find(x => x.k === pkgK) || PKGS[2];
  S.pkg = p; S.budget = DEMO.area * p.perSq;
  S.screen = 'stage';
  arrive(1);
  for (let j = 1; j < n; j++) {
    const def = STAGES[j - 1];
    if (def.pickTier && !S.tier) selectTier('d100');
    if (def.contract) fillContract('careful');
    advance(true);
  }
  SILENT = false; render();
}/* ══════════════════════════════════════════════════════════════════════════
   渲染 · 装修模块 v4
   ══════════════════════════════════════════════════════════════════════════ */

function focusOn(sel, block) { FOCUS_SEL = sel; FOCUS_BLOCK = block || 'center'; }
const viewKey = () => S.screen + '|' + S.stageIdx;

    el.innerHTML = `

      <div class="g-line">${STAGES.map(() => '<span class="g-seg future"></span>').join('')}</div>
      <div class="g-meters">
        <div class="gm"><span class="gm-k">钱</span><div class="gm-bar"><i class="gm-base" style="width:0%"></i></div><span class="gm-v">未定预算</span></div>
        <div class="gm"><span class="gm-k">工</span><div class="gm-bar"><i class="gm-base" style="width:0%"></i></div><span class="gm-v">计划 ${PLAN_TOTAL} 天</span></div>
      </div>`;
    return;
  }
  const plan = contractPrice(), paid = paidTotal(), extra = S.extra;
  const den = Math.max(plan, paid, 1);
  const done = S.screen === 'done';
  const idx = done ? STAGES.length : S.stageIdx;
  const def = STAGES[idx - 1];
  const shownDay = done || def.k === 'Warr' ? (S.doneDay || S.day) : S.day;
  const tw = Math.max(PLAN_TOTAL, shownDay);
  el.innerHTML = `
    <div class="g-top">
      <span class="g-badge"><i class="g-dot"></i>装修</span>
      <span class="g-cur">${done ? '完工 · 已入住' : def.name + ' <b>' + idx + '</b>/' + STAGES.length}</span>
      <span class="g-sp"></span>
      <span class="g-day">第 <b>${shownDay}</b> 天${done ? ' · ' + md(shownDay) + ' 入住' : ''}</span>
      <span class="g-face">${faceOf(S.stress)}</span>
    </div>
    <div class="g-line">${STAGES.map((s, i) => `<span class="g-seg ${done || i < idx - 1 ? 'done' : i === idx - 1 ? 'cur' : 'future'}"></span>`).join('')}</div>
    <div class="g-meters">
      <div class="gm"><span class="gm-k">钱</span>
        <div class="gm-bar" id="barMoney"><i class="gm-base" style="width:${plan / den * 100}%"></i><i class="gm-over" style="width:${extra / den * 100}%"></i></div>
        <span class="gm-v">¥${wan(paid)} 万<em> / 合同 ${wan(plan)} 万</em></span></div>
      <div class="gm"><span class="gm-k">工</span>
        <div class="gm-bar" id="barTime"><i class="gm-base" style="width:${Math.min(PLAN_TOTAL, shownDay) / tw * 100}%"></i></div>
        <span class="gm-v">${shownDay}<em> / 计划 ${PLAN_TOTAL} 天</em></span></div>
    </div>
    ${extra ? `<div class="gm" style="margin-top:1px"><span class="gm-k"></span><span style="font-size:11px;color:var(--danger)">${isHalf()
      ? '自购踩坑 ' + S.bills.length + ' 笔'
      : '增项 ' + S.bills.length + ' 张'} · ${yuan(extra)}（${isHalf() ? '合同外的账' : '合同里没写的'}）</span></div>` : ''}`;
}

/* ── 预算屏 ── */
function screenBudget() {
  const sel = S.pkg;
  return `
  <div data-screen-label="01 装修预算">
    <div class="eyebrow">装修准备</div>
    <div class="hd"><span class="hd-hero">🏗️</span>定装修预算</div>
    <div class="sub">${DEMO.city} · ${DEMO.name} · ${DEMO.areaText} · 老房翻新 · 半包 1000 / 全包 1500 元/㎡ 起</div>
    <div class="calc" style="margin-top:12px">
      <span class="v num">${DEMO.area}</span><span class="k">㎡</span><span class="op">×</span>
      <span class="v num">${sel ? sel.perSq : '—'}</span><span class="k">元/㎡</span><span class="eq">=</span>
      <span class="r num">${sel ? wan(S.budget) + ' 万' : '待定'}</span>
    </div>
    ${PKGS.map(pkgCard).join('')}

}
function pkgCard(p) {

      <span class="gr-p">${wan(DEMO.area * p.perSq)} 万</span></div>

}

/* ── 阶段屏（三种形态） ── */
function screenStage() {

  if (def.pickTier) return screenTier(def);
  return screenCard(def);
}
function dayLine(def) {
  return `<div class="sw-day">装修 ${def.idx} / ${STAGES.length} · 第 ${S.day} 天 · ${md(S.day)}${S.moved ? ' · 本阶段 +' + S.moved + ' 天' : ''}</div>`;
}
function railBlock() {
  const idx = Math.min(S.stageIdx, STAGES.length);
  return `<div class="rail">${STAGES.map((s, i) => `<i class="${i < idx - 1 ? 'done' : i === idx - 1 ? 'cur' : ''}"></i>`).join('')}</div>`;
}
function tip(def) {
  const half = isHalf();
  return `<div class="sw-key${half ? ' sky' : ''}"><b>${half ? '验收 / 主材时间表：' : '最容易踩的点：'}</b>${half ? def.help : def.key}</div>`;
}

        <div class="sw-cell"><div class="sw-k">谁在做</div><div class="sw-v" style="font-size:13.5px;line-height:1.3">${def.who}</div></div>

}

/* 设计师档位 */
function screenTier(def) {

/* 合同清单（唯一的深坑：不预先标价） */
function screenContract(def) {
  const half = isHalf();
  const done = decidedCount(), left = CONTRACT.length - done;
  const written = writtenList(), risks = riskLeft();
  const riskAdd = risks.reduce((a, it) => a + (half && it.halfOwn ? 0 : it.doPrice), 0);
  const secs = [];
  CONTRACT.forEach(it => { if (secs.indexOf(it.sec) < 0) secs.push(it.sec); });
  return `
  <div data-screen-label="02 签合同">
    ${dayLine(def)}
    <div class="pricebar${left ? '' : ' ok'}">
      <div class="pb-k">合同价（还没签）${half ? ' · 不含自购主材' : ''}</div>
      <div class="pb-v">¥${wan(contractPrice())} 万</div>
      <div class="pb-n">${written.length
      ? '已写进去 ' + written.length + ' 项：' + written.slice(0, 3).join('、') + (written.length > 3 ? ' 等' : '')
      : '看起来不贵——因为下面 ' + CONTRACT.length + ' 项，<b>一项都没写进去</b>。'}</div>
    </div>
    ${half ? `<div class="ok-note"><span class="ok-b">账外：</span>门窗、柜子、瓷砖、灯具自购约 8-15 万，不进这份合同价。</div>` : ''}
    <div class="prog"><span>已定</span><div class="prog-bar"><i style="width:${done / CONTRACT.length * 100}%"></i></div><span class="prog-v">${done} / ${CONTRACT.length}</span></div>
    ${risks.length ? `
    <div class="btn-row" style="margin-top:12px"><button class="btn btn-out" data-act="writeRisk">先写清不能省的 ${risks.length} 项</button></div>
    <div class="cl-quick">这 ${risks.length} 项是「边界最容易扯皮」的：${risks.map(it => it.name).join('、')}。写进去合同价 +${wan(riskAdd)} 万；其余 ${left - risks.length} 项可以自己判断。</div>` : ''}
    ${secs.map(s => `<div class="cl-sec"><div class="cl-sec-h"><span class="cl-sec-t">${s}</span><span class="cl-sec-x">${CONTRACT.filter(x => x.sec === s).length} 项</span></div>
      ${CONTRACT.filter(x => x.sec === s).map(it => clRow(it, half)).join('')}</div>`).join('')}
    <div class="cl-say ${left ? 'warn' : 'calm'}">${left
      ? '还有 <b>' + left + ' 项</b>没提：合同价只算已经定下的部分。'
      : CONTRACT.length + ' 项都有结论：写进合同的按价走，明确不做的不会再产生费用。'}</div>
    <div class="btn-row"><button class="btn btn-ink" data-act="next">${left ? '按这份清单签约（还有 ' + left + ' 项没提）' : '按这份清单签约 · 开工'}</button></div>
    <div class="btn-row" style="margin-top:8px"><button class="btn btn-out" data-act="fastSign">先签，以后再说（合同价最低）</button></div>
    <div class="note-i"><b>设计说明：</b>这一屏不预先标价——「合同价看着低、好签」正是这个坑本身。没提的项，等装到那一步才以增项单的形式出现。上面那句提示只讲价格怎么算，<b>不给结论</b>：坑要用户自己踩出来。</div>
  </div>`;
}
function clRow(it, half) {
  const v = S.con[it.k];
  const own = half && it.halfOwn;                     /* 半包：主材自购，只列清单不计合同价 */
  const writeTxt = half && it.halfWrite ? it.halfWrite : it.write;
  const noLabel = half && it.halfNoLabel ? it.halfNoLabel : (it.noLabel || '明确不做');
  const noNote = half && it.halfNoNote ? it.halfNoNote : it.noNote;
  const doLabel = own ? '列入自购清单' : '写进合同';
  return `
  <div class="cl-row" id="cl-${it.k}">
    <div class="cl-top">
      <span class="cl-n">${it.name}</span>
      ${v === 'do'
      ? (own ? '<span class="pill pill-warn">已列自购清单</span>'
        : `<span class="pill pill-do">已写进合同 ${it.doPrice ? yuan(it.doPrice) : ''}</span>`)
      : v === 'no' ? `<span class="pill ${it.noKind === 'risk' ? 'pill-todo' : 'pill-no'}">${noLabel}</span>`
        : '<span class="pill pill-todo">没提</span>'}
    </div>
    <div class="cl-why">${it.why}</div>
    ${v === 'do' ? `<div class="cl-write"><b>写清：</b>${writeTxt}</div>` : ''}
    ${v === 'no' ? `<div class="cl-write">${noNote}</div>` : ''}
    <div class="cl-acts">
      <button class="cl-btn${v === 'do' ? ' on' : ''}" data-cl="${it.k}:do">${doLabel}</button>
      <button class="cl-btn${v === 'no' ? ' on-no' : ''}" data-cl="${it.k}:no">${noLabel}</button>
    </div>
  </div>`;
}

/* ── 增项单（合同没写的，装到这一步才来） ── */
function burstBlock() {
  const tc = S.burst.reduce((a, b) => a + b.cost, 0);
  const td = S.burst.reduce((a, b) => a + b.days, 0);
  const many = S.burst.length > 1;
  const big = S.burst.slice().sort((a, b) => b.cost - a.cost)[0];
  return `<div class="burst" style="margin-top:12px">
    <div class="burst-t">🧾 增项单 ${S.burst.length} 张<span class="burst-src">合同里没写的 · 比合同价贵 30% 以上</span></div>
    ${S.burst.map((b, i) => many
    ? (i < 2 ? `<div class="adj" style="padding:8px 11px"><div class="adj-line"><span>${b.lines.map(l => l[0]).join(' + ')}</span><span>${yuan(b.cost)}</span></div></div>` : '')
    : `<div class="adj">
        <div class="adj-hd">${b.no} · ${b.stage} 阶段<span class="adj-no">第 ${b.day} 天</span></div>
        ${b.lines.map(l => `<div class="adj-line"><span>${l[0]}</span><span>${yuan(l[1])}</span></div>`).join('')}
        <div class="adj-sum"><span>小计</span><span>${yuan(b.cost)}${b.days ? ' · +' + b.days + ' 天' : ''}</span></div>
      </div>`).join('')}
    ${many && S.burst.length > 2 ? `<div class="adj-line" style="padding:4px 11px 0"><span>其余 ${S.burst.length - 2} 笔：${S.burst.slice(2).map(b => b.lines[0][0]).join('、')}</span><span>${yuan(S.burst.slice(2).reduce((a, b) => a + b.cost, 0))}</span></div>` : ''}
    <div class="adj-hint" style="margin-top:7px">${big.hint}</div>
    <div class="adj-hint" style="margin-top:3px;font-weight:600">本次 ${yuan(tc)}${td ? ' · 返工 +' + td + ' 天' : ''} · 累计 ${S.bills.length} 张</div>
  </div>`;
}

/* ── 完工总账 ── */
function screenDone() {
  const half = isHalf();
  const plan = contractPrice(), paid = paidTotal(), extra = S.extra;
  const pct = plan ? (extra / plan * 100) : 0;
  const ifAll = S.budget + S.designFee + CONTRACT.reduce((a, it) => a + it.doPrice, 0);
  const rankBills = S.bills.slice().sort((a, b) => b.cost - a.cost);
  const topBills = rankBills.slice(0, 3), restBills = rankBills.slice(3);
  const gmax = Math.max(...STAGES.map(s => s.days));
  const workers = 9;
  const srcLabel = half ? '自己买主材踩的' : '合同里没写的';
  const whyLine = !extra
    ? `一分没多花：${CONTRACT.length} 项合同清单全部写清 / 明确不做，装到哪一步都不用再掏钱。`
    : half
      ? `多出来的 <b>${yuan(extra)}</b> 不是装修公司加价——是你自己买主材踩的 ${S.bills.length} 笔。<br>半包的坑不在合同上，在你跑建材市场的那几周。`
      : `多出来的 <b>${yuan(extra)}</b>（+${pct.toFixed(0)}%）全是合同里没写的：${S.bills.length} 张增项单，装到那一步才来。<br>把 ${CONTRACT.length} 项都写进合同：约 <b>¥${wan(ifAll)} 万</b>，比现在少 <b>${yuan(Math.max(0, paid - ifAll))}</b>。`;
  return `
  <div data-screen-label="${STAGES.length + 1} 装修完成">
    <div class="hd"><span class="hd-hero">🏡</span>装修完成</div>
    <div class="sub">${DEMO.name} · ${DEMO.areaText} · 第 ${S.doneDay} 天（${md(S.doneDay)}）入住</div>

    <div class="pricebar${extra ? ' bad' : ''}" style="margin-top:14px">
      <div class="pb-k">签合同时的价 → 结账时的价</div>
      <div class="pb-v">¥${wan(plan)} 万 → ¥${wan(paid)} 万</div>
      <div class="pb-n">${whyLine}</div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="b-title">装修到底有多复杂</div>
      <div class="b-desc">${STAGES.length} 个阶段 · ${workers} 个工种 / 供应商 · 计划 ${PLAN_TOTAL} 天，实际 ${S.doneDay} 天。</div>
      <div class="gantt">${STAGES.filter(s => s.k !== 'Warr').map(s => `<i class="${S.byStage[s.k] && S.byStage[s.k].burstCost ? 'hot' : ''}" style="height:${16 + s.days / gmax * 22}px"></i>`).join('')}</div>
      <div class="gantt-x"><span>设计</span><span>主材</span><span>木瓦</span><span>安装</span><span>通风</span></div>
    </div>

    ${S.bills.length ? `
    <div class="lrn">
      <div class="sect" style="margin-top:0"><div class="sect-t">${srcLabel} ${S.bills.length} 笔</div><div class="sect-x">${yuan(extra)}</div></div>
      ${topBills.map(b => `<div class="lrn-row"><div class="lrn-l"><b>${b.stage}阶段</b> · ${b.text}</div><div class="lrn-r">${yuan(b.cost)}</div></div>`).join('')}
      ${restBills.length ? `<div class="lrn-row"><div class="lrn-l">其余 ${restBills.length} 笔（${restBills.map(b => b.stage).join('、')}）</div><div class="lrn-r">${yuan(restBills.reduce((a, b) => a + b.cost, 0))}</div></div>` : ''}
      <details class="cal-fold" style="margin-top:10px"><summary>▸ 下次怎么避免 · ${S.bills.length} 条真实做法</summary>
        <div class="cal-body">${S.bills.map(b => `<div class="cal-note" style="margin-top:8px"><b>${b.src}</b><br>${b.hint}</div>`).join('')}</div>
      </details>
    </div>` : `
    <div class="card card-sky" style="margin-top:12px"><div class="b-title">0 张增项单</div>
      <div class="b-desc">合同清单 ${CONTRACT.length} 项逐项有结论，装到哪一步都没有「再掏钱」。</div></div>`}

    ${half ? `<div class="ok-note"><span class="ok-b">账外：</span>门窗、柜子、瓷砖、灯具自购约 8-15 万，不在上面这份账里。</div>` : ''}
    <div class="ok-note"><span class="ok-b">你带走了：</span>${half
      ? '主材清单（自己买、自己比）· 验收时间表 · 一套自己量的尺寸' + (extra ? ' · 主材的教训' : '')
      : (S.tier && S.tier !== 'free' ? '施工图 / 点位图 / 柜体图 · ' : '') + (extra ? '增项单的教训' : '合同清单 ' + CONTRACT.length + ' 项')}</div>
    <div class="ok-note"><span class="ok-b">复盘：</span>装修的麻烦不在干活，在签合同那 10 分钟——写清楚了，后面 100 天都省心。（工期为模拟口径：基础 ${PLAN_BASE} 天 + 增项返工）</div>
    <div class="btn-row"><button class="btn btn-ink" data-act="reset">重来一次 · 换一条路</button></div>
  </div>`;
}

/* ══════════════════ 主渲染 ══════════════════ */
function doRender() {
  const stageEl = document.getElementById('stage');
  const key = viewKey(), changed = key !== VIEW_KEY;
  const keep = changed ? 0 : stageEl.scrollTop;
  VIEW_KEY = key;
  if (changed) FOCUS_SEL = null;
  renderGuard();
  const sc = document.getElementById('sc');
  sc.innerHTML = S.screen === 'budget' ? screenBudget() : (S.screen === 'done' ? screenDone() : screenStage());
  stageEl.scrollTop = keep;
  if (FOCUS_SEL) {
    const el = document.querySelector(FOCUS_SEL);
    if (el && typeof el.scrollIntoView === 'function') el.scrollIntoView({ behavior: 'smooth', block: FOCUS_BLOCK });
    FOCUS_SEL = null;
  }
  renderJump();
  if (S.burst.length) {
    ['barMoney', 'barTime'].forEach(id => { const el = document.getElementById(id); if (el) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 950); } });
  }
}
function renderJump() {
  const el = document.getElementById('rvJump');
  if (!el) return;
  const items = [{ i: 0, t: '预算' }].concat(STAGES.map(s => ({ i: s.idx, t: s.name.slice(0, 2) }))).concat([{ i: 99, t: '总账' }]);
  el.innerHTML = items.map(x => `<button data-jump="${x.i}" class="${(x.i === S.stageIdx && S.screen !== 'done') || (x.i === 99 && S.screen === 'done') ? 'on' : ''}">${x.t}</button>`).join('');
}

/* ══════════════════ 上划 ══════════════════ */
let lastSwipe = 0;
function trySwipe() {
  if (!FAST_ON || S.screen !== 'stage') return;
  const def = stageDef();
  if (!def || def.contract || def.pickTier) return;         /* 决策屏不跳过 */
  const stEl = document.getElementById('stage');
  if (stEl.scrollTop + stEl.clientHeight < stEl.scrollHeight - 16) return;   /* 还有内容没看完 */
  const now = Date.now();
  if (now - lastSwipe < 420) return;
  lastSwipe = now;
  advance();
}
function bindSwipe() {
  const stEl = document.getElementById('stage');
  let y0 = null;
  stEl.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  stEl.addEventListener('touchend', e => {
    if (y0 == null) return;
    if (y0 - e.changedTouches[0].clientY > 46) trySwipe();
    y0 = null;
  }, { passive: true });
  /* wheel 只是评审稿桌面预览用；小程序没有滚轮，移植时删掉这条 */
  stEl.addEventListener('wheel', e => { if (e.deltaY > 22) trySwipe(); }, { passive: true });
}

/* ══════════════════ 事件绑定 ══════════════════ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-pkg],[data-tier],[data-cl],[data-act],[data-jump],[data-demo]');
  if (!t) return;
  if (t.dataset.pkg) { S.pkg = PKGS.find(p => p.k === t.dataset.pkg); S.budget = DEMO.area * S.pkg.perSq; focusOn('#pkg-' + S.pkg.k, 'nearest'); render(); return; }
  if (t.dataset.tier) { selectTier(t.dataset.tier); return; }
  if (t.dataset.cl) { const a = t.dataset.cl.split(':'); decide(a[0], a[1]); return; }
  if (t.dataset.jump !== undefined) {
    const i = +t.dataset.jump;
    location.hash = i === 0 ? 's=budget' : i === 99 ? 's=done&path=careful' : 's=' + i;
    return;
  }
  if (t.dataset.demo) {
    if (t.dataset.demo === 'reset') { location.hash = 's=budget'; applyHash(); }
    else { location.hash = 's=done&path=' + t.dataset.demo; applyHash(); }
    return;
  }
  switch (t.dataset.act) {
    case 'start': clearHash(); startRenov(); render(); break;
    case 'next': if (stageDef().pickTier && !S.tier) return; clearHash(); advance(); break;
    case 'fastSign': clearHash(); advance(); break;
    case 'writeRisk': clearHash(); writeRiskItems(); break;
    case 'reset': location.hash = 's=budget'; applyHash(); break;
  }
});
function clearHash() { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } }
const rvToggle = document.getElementById('rvToggle'), rvPanel = document.getElementById('rvPanel');
rvToggle.addEventListener('click', () => { rvPanel.classList.toggle('on'); });
document.getElementById('ckFast').addEventListener('change', e => { FAST_ON = e.target.checked; });
document.getElementById('ckNote').addEventListener('change', e => document.body.classList.toggle('notes', e.target.checked));

/* ── Hash 深链（评审用）
     #s=budget / #s=1 … #s=12 / #s=done&path=quick|careful|half ── */
function applyHash() {
  const h = location.hash.replace(/^#/, ''), q = {};
  h.split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) q[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); });
  if (q.path === 'quick' || q.path === 'careful' || q.path === 'half') { runThrough(q.path); return; }
  if (q.s === 'done') { runThrough(q.path || 'quick'); return; }
  if (q.s === 'budget' || q.s === undefined) { S = newState(); render(); return; }
  const n = parseInt(q.s, 10);
  if (n >= 1 && n <= 12) { seedToStage(n, q.pkg); return; }
  S = newState(); render();
}
window.addEventListener('hashchange', applyHash);
bindSwipe();
S = newState();
applyHash();
</script>
