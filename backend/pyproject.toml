[project]
name = "profo-real-estate-backend"
version = "0.1.0"
description = "Profo 房产数据中心后端服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "python-dateutil>=2.8.2",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "filetype>=1.2.0",
    "Pillow>=10.0.0",
    "slowapi>=0.1.9",
    "psycopg[binary]>=3.1",
    "httpx>=0.25.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.15.14",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "pytest-xdist>=3.5.0",
]

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "D203",
    "D213",
    # 以下规则与项目风格冲突，全局忽略
    "D102",   # 公开方法缺 docstring（field_serializer 等无需注释）
    "D104",   # 公开包缺 docstring
    "D107",   # __init__ 缺 docstring
    "FBT001", # 布尔类型位置参数（FastAPI Query 需要）
    "FBT002", # 布尔默认位置参数（FastAPI Query 需要）
    "PLR0913", # 函数参数过多（FastAPI 端点天然多参数）
    "TRY301", # try 内 raise（校验模式常见）
    "C901",   # 复杂度（统计聚合方法天然复杂）
    "PLR0912", # 分支过多
    "PLR0915", # 语句过多
    "COM812",  # 与 ruff format 冲突，由 formatter 处理尾逗号
    # TC001/TC002/TC003: 将仅类型注解用的 import 移入 TYPE_CHECKING 块
    # 与 Pydantic + from __future__ import annotations 冲突（model_rebuild 运行时需要类型可用）
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "D100", "D101", "D102", "D103", "D104", "PLR2004", "ARG001", "PLC0415"]
# routers: slowapi @limiter.limit 要求 request 参数；FastAPI 依赖注入要求 current_user
"routers/**/*.py" = ["ARG001"]
# 迁移脚本: 循环变量转换、复杂度
"scripts/*.py" = ["PLW2901"]
# 统计聚合方法: try-except 在循环内（跳过坏文件）
"services/projects/finance/ledger.py" = ["PERF203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-branch"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/migrations/*",
    "init_admin.py",
    "init_db.py",
    "conftest.py",
]
source = ["."]

[tool.coverage.report]
fail_under = 82
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.fastapi]
entrypoint = "main:app"
