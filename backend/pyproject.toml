[project]
name = "profo-real-estate-backend"
version = "0.1.0"
description = "Profo 房产数据中心后端服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "python-dateutil>=2.8.2",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "pwdlib[argon2,bcrypt]>=0.2.0",
    "filetype>=1.2.0",
    "Pillow>=10.0.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "oss2>=2.18.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.25.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.15.14",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "pytest-xdist>=3.5.0",
]

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.uv]
# 安全约束：idna 3.13 存在 CVE-2026-45409（encode DoS），强制 >=3.15
constraint-dependencies = ["idna>=3.15"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "D203",
    "D213",
    # 中文 docstring 首行以"。"结尾，D400/D415 只识别 ASCII [.!?]，全局忽略
    "D400",
    "D415",
    # 以下规则与项目风格冲突，全局忽略
    "D102",   # 公开方法缺 docstring（field_serializer 等无需注释）
    "D104",   # 公开包缺 docstring
    "D107",   # __init__ 缺 docstring
    "FBT001", # 布尔类型位置参数（FastAPI Query 需要）
    "FBT002", # 布尔默认位置参数（FastAPI Query 需要）
    "PLR0913", # 函数参数过多（FastAPI 端点天然多参数）
    "TRY301", # try 内 raise（校验模式常见）
    "C901",   # 复杂度（统计聚合方法天然复杂）
    "PLR0912", # 分支过多
    "PLR0915", # 语句过多
    "COM812",  # 与 ruff format 冲突，由 formatter 处理尾逗号
    # TC001/TC002/TC003: 将仅类型注解用的 import 移入 TYPE_CHECKING 块
    # 与 Pydantic + from __future__ import annotations 冲突（model_rebuild 运行时需要类型可用）
    "TC001",
    "TC002",
    "TC003",
    # CPY001: ruff 0.16 新增 flake8-copyright 规则，要求文件顶部版权声明
    # 项目从未要求版权声明，全量补充 254 个文件无业务价值
    "CPY001",
    # PLR0917: 位置参数过多（PLR0913 的细分）
    # 与已 ignore 的 PLR0913 同理：FastAPI 端点 / 查询服务天然多参数
    "PLR0917",
    # 以下规则为 ruff 0.16 升级后从 noqa 收敛为全局 ignore（项目固有模式）:
    # ANN401: Pydantic field_validator 与 JSON 序列化/反序列化必须用 Any（类型系统固有限制）
    "ANN401",
    # PLC0415: 延迟导入避免循环依赖 / 延迟加载重模块（oss2/settings），项目大量使用此模式
    "PLC0415",
    # A002: 业务术语 filter/range/id 遮蔽内置函数，重命名会降低可读性（ReportsFilter 简写为 filter）
    "A002",
    # PLW0603: 单例模式用 global 持有缓存实例（Redis/OSS/Fernet），Python 单例的常见实现
    "PLW0603",
    # PLR0911: 返回语句过多，与已 ignore 的 PLR0912(分支)/PLR0915(语句)同类，统计聚合/校验方法天然多返回
    "PLR0911",
    # BLE001: 全局错误处理/反序列化/线程池任务需要捕获 Exception，项目在 API 边界统一处理
    "BLE001",
    # T201: settings 加载失败时 logger 尚未初始化，必须用 print 输出到 stderr（Fail Loud 原则）
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D100", "D101", "D102", "D103", "D104", "PLR2004", "ARG001", "ARG002", "ARG005", "SLF001", "PLC0415", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204"]
# routers: slowapi @limiter.limit 要求 request 参数；FastAPI 依赖注入要求 current_user
"routers/**/*.py" = ["ARG001"]
# reports 子模块: spec 显式要求声明 response_model（与 return 注解冗余）；
# valid_community_id 依赖在依赖层消费 {community_id} 路径参数（FAST003 静态分析无法识别）
"routers/reports/**/*.py" = ["FAST001", "FAST003"]
# 迁移脚本: 循环变量转换、复杂度
"scripts/*.py" = ["PLW2901"]
# 迁移脚本: 使用字符串构建 SQL（表名/列名为常量，无用户输入，无注入风险）
"migrations/*.py" = ["S608"]
# 统计聚合方法: try-except 在循环内（跳过坏文件）
"services/projects/finance/ledger.py" = ["PERF203"]
# 文件解析器: 循环内 try-except 尝试多种编码/格式（解析逻辑必需）
"services/market/batch_importer.py" = ["PERF203"]
"services/market/csv_parser.py" = ["PERF203", "S110"]
"services/market/json_batch_importer.py" = ["PERF203"]
"services/utils/date_parser.py" = ["PERF203"]
"services/recruit/attribution.py" = ["PERF203"]
# 授权价通知: 多 openid 逐个发送，单个失败不阻断后续（订阅消息非关键路径）
"services/leads/notify.py" = ["PERF203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-branch"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/migrations/*",
    "init_admin.py",
    "init_db.py",
    "conftest.py",
]
source = ["."]

[tool.coverage.report]
fail_under = 82
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.fastapi]
entrypoint = "main:app"
