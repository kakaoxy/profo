# Profo Docker 开发环境 Nginx 配置（HTTP only）
# 由 docker-compose 的 nginx 服务挂载到 /etc/nginx/conf.d/default.conf:ro
# 反代到 compose 内的 backend:8000 / frontend:3000
#
# 说明：使用变量 + resolver 让 nginx 在请求时解析主机名，
# 这样 `nginx -t` 在无 Docker DNS 的环境也能通过语法检查；
# 运行时由 Docker 内置 DNS (127.0.0.11) 解析 backend/frontend。

server {
    listen 80;
    # ⚠️ 生产环境必须将 server_name 改为具体域名（如 profo.example.com）
    # 开发环境使用 _ 接受所有 Host（仅限本地调试）
    # 生产环境示例：
    # server_name profo.example.com;
    # if ($host !~ ^(profo\.example\.com|admin\.profo\.example\.com)$ ) {
    #     return 444;
    # }
    server_name _;

    client_max_body_size 100M;

    # Docker 内置 DNS（请求时解析 backend/frontend 主机名）
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend "backend";
    set $frontend "frontend";

    access_log /var/log/nginx/profo.access.log;
    error_log /var/log/nginx/profo.error.log;

    # === 后端 API ===
    location /api/ {
        proxy_pass http://$backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # === 上传文件直服（uploads volume 挂载在 /app/uploads）===
    location /static/uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # === 后端 bundled 静态资源（StaticFiles）===
    location /static/ {
        proxy_pass http://$backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === 健康检查 ===
    location /health {
        proxy_pass http://$backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # === Next.js 构建产物静态资源（长缓存）===
    location /_next/static/ {
        proxy_pass http://$frontend:3000;
        proxy_http_version 1.1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # === 前端 SSR（含 websocket 升级）===
    location / {
        proxy_pass http://$frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
