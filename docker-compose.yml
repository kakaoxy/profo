services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    # 生产环境内存调优（1.6G 服务器）
    # shared_buffers 128MB + work_mem 4MB，控制在 256MB 以内
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    mem_limit: 32m
    # 启用密码认证：防止未授权访问/缓存投毒（M2 安全加固）
    # 密码经环境变量传入，compose 不展开 ${REDIS_PASSWORD} 至 .Config.Cmd（避免 docker inspect 泄漏）；
    # 空值时 test -n 失败拒绝启动，防止 --requirepass "" 静默关闭认证
    # 注意：compose 字符串 command 会被按空格拆分为 exec 形式数组（不走 shell），
    # 因此 &&/||/$VAR 均失效；必须显式 sh -c 让 shell 展开 $$REDIS_PASSWORD
    # （$$ 在 compose 中转义为 $，再由容器内 sh 从环境变量展开）
    #
    # 内存淘汰策略：容器 mem_limit=32m，预留约 8MB 给 Redis 进程本身，
    # 设置 --maxmemory 24m 使 --maxmemory-policy volatile-lru 在该阈值触发淘汰
    # （否则 policy 为空操作：Redis 持续吃内存直至被 cgroup OOM-killed）
    command:
      - sh
      - -c
      - 'test -n "$$REDIS_PASSWORD" && redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 24m --maxmemory-policy volatile-lru || { echo "[FATAL] REDIS_PASSWORD 未设置，拒绝启动（空值会静默关闭认证）" >&2; exit 1; }'
    environment:
      # 供启动脚本读取密码
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 供 healthcheck 的 redis-cli 自动鉴权（exec 形式 CMD 不展开 $VAR）
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: profo-backend:prod
    build: ./backend
    # 跨平台构建：本地 Mac (arm64) 必须构建 amd64 镜像，否则服务器 (x86_64) 跑不起来
    platform: linux/amd64
    env_file: .env
    environment:
      # 显式覆盖 .env 中的 DATABASE_URL，保证使用 compose 内 db 服务主机名
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # 显式覆盖 .env 中的 REDIS_URL，注入密码保证与 redis 服务的 requirepass 一致
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # bind mount 让 Docker 容器与本地 dev 模式共享同一份上传文件
      - ./uploads:/app/static/uploads
    ports:
      # 仅暴露到宿主 127.0.0.1，由宿主 nginx 反代，不直接暴露公网
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m

  frontend:
    image: profo-frontend:prod
    build:
      context: ./frontend
      args:
        # 构建时注入 SERVER_API_URL，让 next.config.ts 的 rewrites 在 build 阶段拿到正确值
        # 这样 frontend 容器内 SSR 代理会直连 backend 容器，而非 127.0.0.1 自指向
        SERVER_API_URL: http://backend:8000
        # 构建时注入生产域名（可选）
        # Next.js 自动允许同源 Host，nginx 正确传递 Host 时此变量非必需
        # 仅当 nginx 不传递 Host（如 CDN/二级反代）时才需配置
        PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:-}
    # 跨平台构建：本地 Mac (arm64) 必须构建 amd64 镜像，否则服务器 (x86_64) 跑不起来
    platform: linux/amd64
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 仅暴露到宿主 127.0.0.1，由宿主 nginx 反代，不直接暴露公网
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Server Action / Server Component 在容器内运行，需直连 backend 容器
      # 不设此项时默认 http://127.0.0.1:8000（指向 frontend 自己，导致登录"网络错误"）
      SERVER_API_URL: http://backend:8000
    restart: unless-stopped
    mem_limit: 256m

volumes:
  pgdata:
  redisdata:
