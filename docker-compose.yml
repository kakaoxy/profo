services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    # 生产环境内存调优（1.6G 服务器）
    # shared_buffers 128MB + work_mem 4MB，控制在 256MB 以内
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 384m

  backend:
    image: profo-backend:prod
    build: ./backend
    # 跨平台构建：本地 Mac (arm64) 必须构建 amd64 镜像，否则服务器 (x86_64) 跑不起来
    platform: linux/amd64
    env_file: .env
    environment:
      # 显式覆盖 .env 中的 DATABASE_URL，保证使用 compose 内 db 服务主机名
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # bind mount 让 Docker 容器与本地 dev 模式共享同一份上传文件
      - ./uploads:/app/static/uploads
    ports:
      # 仅暴露到宿主 127.0.0.1，由宿主 nginx 反代，不直接暴露公网
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m

  frontend:
    image: profo-frontend:prod
    build:
      context: ./frontend
      args:
        # 构建时注入 SERVER_API_URL，让 next.config.ts 的 rewrites 在 build 阶段拿到正确值
        # 这样 frontend 容器内 SSR 代理会直连 backend 容器，而非 127.0.0.1 自指向
        SERVER_API_URL: http://backend:8000
        # 构建时注入生产域名（可选）
        # Next.js 自动允许同源 Host，nginx 正确传递 Host 时此变量非必需
        # 仅当 nginx 不传递 Host（如 CDN/二级反代）时才需配置
        PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:-}
    # 跨平台构建：本地 Mac (arm64) 必须构建 amd64 镜像，否则服务器 (x86_64) 跑不起来
    platform: linux/amd64
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 仅暴露到宿主 127.0.0.1，由宿主 nginx 反代，不直接暴露公网
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Server Action / Server Component 在容器内运行，需直连 backend 容器
      # 不设此项时默认 http://127.0.0.1:8000（指向 frontend 自己，导致登录"网络错误"）
      SERVER_API_URL: http://backend:8000
    restart: unless-stopped
    mem_limit: 256m

volumes:
  pgdata:
