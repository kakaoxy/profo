name: Lint Check (Backend & Frontend)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    if: |
      contains(github.event.commits.*.modified.*, 'backend/') ||
      contains(github.event.commits.*.added.*, 'backend/') ||
      contains(github.event.commits.*.removed.*, 'backend/') ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies (backend)
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Dependency audit (uv audit)
        run: uv audit

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    if: |
      contains(github.event.commits.*.modified.*, 'frontend/') ||
      contains(github.event.commits.*.added.*, 'frontend/') ||
      contains(github.event.commits.*.removed.*, 'frontend/') ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frontend)
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc --noEmit)
        run: pnpm typecheck

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Dependency audit (pnpm audit)
        run: pnpm audit --audit-level high